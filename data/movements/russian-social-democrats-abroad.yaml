name: Russian Social Democrats abroad
alternate_names:
  - RSDLP émigrés
country: Soviet Union
founded: 1883
dissolved: 1917
status: defunct
affiliation: Russian Social Democratic Labour Party (RSDLP)
description: >-
  The Russian Marxist emigration before the revolution, from Plekhanov's Emancipation of Labour
  group in Geneva (1883) to the Bolshevik and Menshevik centres in Switzerland, Munich, London
  and Paris. Under Tsarist censorship its books were printed abroad and smuggled into Russia;
  besides its own presses (listed under Russia on the globe), J. H. W. Dietz in Stuttgart
  printed the Russian books of the Iskra editors, among them the first edition of Lenin's What
  Is to Be Done? (1902).
