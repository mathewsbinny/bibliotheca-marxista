name: Revolutionary Communist Party of Côte d'Ivoire
alternate_names:
  - Parti communiste révolutionnaire de Côte d'Ivoire
  - PCRCI
country: Côte d'Ivoire
founded: 1990
status: active
affiliation: Marxist–Leninist (Hoxhaist); ICMLPO
description: >-
  The Marxist–Leninist party of Côte d'Ivoire, founded in 1990 and a member of the International
  Conference of Marxist–Leninist Parties and Organizations, which published the paper Révolution
  prolétarienne and whose statements on the political crises of the 2000s were reprinted abroad
  by fraternal journals.
