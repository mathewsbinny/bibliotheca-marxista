name: Communist Party of Italy in exile
alternate_names:
  - PCd'I in exile
country: Italy
founded: 1926
dissolved: 1945
status: defunct
affiliation: Communist Party of Italy (PCd'I)
description: >-
  The Italian communist party after Mussolini's exceptional laws of November 1926 outlawed it
  and imprisoned Antonio Gramsci. Its centre abroad under Palmiro Togliatti (as 'Ercoli') worked
  from Paris and Moscow, and its writings were printed by the French party's presses and in
  translation abroad until the liberation of Italy.
