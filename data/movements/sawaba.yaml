name: Sawaba
alternate_names:
  - Union démocratique nigérienne
  - Mouvement socialiste africain (section du Niger)
country: Niger
founded: 1954
dissolved: 1975
status: defunct
affiliation: Socialist; backed by Ghana, China, the Soviet bloc and Algeria
description: >-
  The radical socialist party of Djibo Bakary, founded as the Union démocratique nigérienne in
  1954 and renamed Sawaba ('liberation') when it led Niger's government in 1957–1958 as the
  Niger section of the Mouvement socialiste africain. Alone in French West Africa it campaigned
  for a 'no' vote for immediate independence in the referendum of 1958; banned in 1959, it went
  into exile, and in 1964 launched a guerrilla insurrection with fighters trained in Ghana,
  Algeria, China and the Soviet bloc. It was crushed by the Diori government with French
  support.
