name: Communist Party of Hawaii
alternate_names:
  - Hawaii Seven
country: United States
region: Hawaii
founded: 1937
dissolved: 1958
status: defunct
affiliation: Communist Party USA
description: >-
  The communists of the Territory of Hawaii, organised from 1937 among the sugar, pineapple and
  dock workers who built the ILWU into the islands' great multiracial union. In 1951 seven of
  its leaders, the 'Hawaii Seven' — among them the editor Koji Ariyoshi and the teacher John
  Reinecke — were tried under the Smith Act; their convictions were overturned in 1958. Its
  voice was the weekly Honolulu Record (1948–1958).
