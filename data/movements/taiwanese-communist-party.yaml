name: Taiwanese Communist Party
alternate_names:
  - Taiwan Communist Party
  - 台灣共產黨
  - Japanese Communist Party, Taiwanese National Branch
country: China
region: Taiwan
founded: 1928
dissolved: 1931
status: defunct
affiliation: Comintern; Japanese Communist Party
description: >-
  The communist party of Taiwan under Japanese rule, founded in the French Concession of
  Shanghai in April 1928 by Xie Xuehong, Lin Mu-shun and others as the Taiwanese national branch
  of the Japanese Communist Party, under the guidance of the Chinese party. Its Political Thesis
  called for Taiwanese independence from Japan and a workers' and peasants' republic; it led the
  left wing of the Taiwanese Cultural Association and the Peasants' Union until the colonial
  police destroyed it in 1931. Its programmes survive in the police records of the
  Government-General; the works below were written by its members.
sources:
