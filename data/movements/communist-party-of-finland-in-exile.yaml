name: Communist Party of Finland in exile
alternate_names:
  - SKP in exile
country: Finland
founded: 1918
dissolved: 1944
status: defunct
affiliation: Communist Party of Finland (SKP)
description: >-
  The Communist Party of Finland, founded in Moscow in 1918 by Red Guards exiled after the civil
  war and illegal in Finland until 1944, led from the Soviet Union by Otto Wille Kuusinen.
