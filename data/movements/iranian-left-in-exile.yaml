name: Iranian communist movement in exile
alternate_names:
  - Tudeh in exile
country: Iran
founded: 1949
status: active
affiliation: Tudeh Party of Iran; Fedaian; Maoist and Trotskyist groups
description: >-
  The Iranian left abroad after the Tudeh Party was banned in 1949, and again after its
  suppression by the Islamic Republic in 1983: the Tudeh's centre in Leipzig and East Berlin,
  the Fedaian and the Maoist and Trotskyist groups of the Iranian student movement in Europe and
  North America. Besides the exile presses already listed under Iran, West German, Canadian and
  British houses printed its classics, such as the writings of Taqi Arani, and its studies.
