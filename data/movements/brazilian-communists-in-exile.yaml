name: Brazilian communists in exile
alternate_names:
  - PCB in exile
country: Brazil
founded: 1964
dissolved: 1985
status: defunct
affiliation: Brazilian Communist Party; Communist Party of Brazil
description: >-
  The Brazilian communist parties under the military dictatorship of 1964–1985, when Luís Carlos
  Prestes led the PCB from exile in Moscow and the Maoist PCdoB fought a guerrilla in Araguaia;
  their statements were printed abroad, in Portuguese in Lisbon after 1974 and in translation.
