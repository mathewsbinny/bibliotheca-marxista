name: 'Ugandan left: FRONASA and the Marxists of the liberation front'
alternate_names:
  - FRONASA
  - Front for National Salvation
  - Uganda National Liberation Front (left wing)
country: Uganda
founded: 1965
dissolved: 1986
status: defunct
affiliation: Marxist and socialist; FRONASA trained by FRELIMO and backed by Tanzania
description: >-
  The Ugandan left from the founding of the country's first Maoist party around 1965 by Dani
  Wadada Nabudere and Raiti Omongin to the guerrilla war that brought the National Resistance
  Movement to power in 1986. Yoweri Museveni's Front for National Salvation (FRONASA), founded
  in exile in Tanzania in 1971–1973 on a socialist programme, trained its fighters with FRELIMO
  in Mozambique; in the Uganda National Liberation Front that overthrew Amin in 1979, Nabudere,
  Edward Rugumayo, Yash Tandon and Omwony Ojwok formed its Marxist 'Gang of Four'. Much of their
  writing was published in exile, in Dar es Salaam and London.
