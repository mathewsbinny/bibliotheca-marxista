name: Corsican communists
alternate_names:
  - Fédération corse du Parti communiste français
  - Front national de Corse (1943)
country: France
region: Corsica
founded: 1938
status: active
affiliation: French Communist Party (Corsican federation)
description: >-
  The Corsican federation of the French Communist Party, which led the island's Resistance in
  the Front national and the insurrection that freed Corsica in September 1943, the first French
  department to be liberated; its leaders included Arthur Giovoni and Danielle Casanova, who
  died in Auschwitz. Its weekly Terre corse was published in Ajaccio, and it later campaigned
  for Corsican autonomy.
