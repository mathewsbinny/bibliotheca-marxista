name: Communistische Partij van Suriname
alternate_names:
  - Communist Party of Suriname
  - Mokro Dekati
country: Suriname
founded: 1981
status: defunct
affiliation: The Marxist–Leninist party of Bram Behr
description: >-
  The Marxist–Leninist party of Suriname that grew out of the circle around the journalist
  Bram Behr and its paper Mokro ("Mud"), the voice of the working class. Behr was among the
  fifteen opponents of Dési Bouterse's military regime murdered in the December murders of 1982;
  the party then published in exile from Amsterdam, where Mokro continued and Behr's writings
  appeared posthumously.
