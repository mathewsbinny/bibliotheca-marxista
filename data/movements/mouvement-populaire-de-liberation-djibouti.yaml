name: Mouvement populaire de libération
alternate_names:
  - MPL
  - Popular Liberation Movement (Djibouti)
country: Djibouti
founded: 1975
dissolved: 1979
status: defunct
affiliation: Marxist–Leninist (Maoist)
description: >-
  A Marxist–Leninist movement of young Afars, described by historians as Maoist, founded in late
  1975 under Mohamed Kamil Mohamed to fight for the independence of the French Territory of the
  Afars and the Issas. It won five seats in the assembly elections of May 1977, on the eve of
  independence, was banned in December 1977, and merged in 1979 into the Front démocratique de
  libération de Djibouti. It published a bulletin and the periodical L'Avant-garde.
