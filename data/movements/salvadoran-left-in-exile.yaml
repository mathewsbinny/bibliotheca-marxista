name: Salvadoran left in exile
country: El Salvador
founded: 1932
dissolved: 1992
status: defunct
affiliation: Communist Party of El Salvador; FMLN
description: >-
  The Salvadoran communist movement, outlawed after the massacre of 1932 and through the civil
  war until the peace accords of 1992; the poet Roque Dalton and the party leader Schafik Handal
  published from exile in Cuba, Mexico and elsewhere.
