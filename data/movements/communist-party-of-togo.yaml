name: Communist Party of Togo
alternate_names:
  - Parti communiste du Togo
  - PCT
country: Togo
founded: 1980
status: active
affiliation: Marxist–Leninist (Hoxhaist); ICMLPO
description: >-
  The Marxist–Leninist party founded clandestinely in 1980 under the one-party rule of
  Gnassingbé Eyadéma, a member of the International Conference of Marxist–Leninist Parties and
  Organizations, whose periodical Révolution was published underground and abroad.
