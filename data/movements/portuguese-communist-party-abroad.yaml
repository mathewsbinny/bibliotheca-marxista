name: Portuguese Communist Party abroad
alternate_names:
  - PCP abroad
country: Portugal
founded: 1926
dissolved: 1974
status: defunct
affiliation: Portuguese Communist Party (PCP)
description: >-
  The works of the Portuguese Communist Party printed abroad during the dictatorship of
  1926–1974, when the party was illegal and its own Edições Avante! were printed clandestinely
  in Portugal; Álvaro Cunhal led it from exile in Moscow and Paris after his escape from Peniche
  prison in 1960.
