name: Bulgarian communists in exile
country: Bulgaria
founded: 1923
dissolved: 1944
status: defunct
affiliation: Bulgarian Communist Party
description: >-
  The Bulgarian Communist Party after the failed September Uprising of 1923, banned until 1944,
  whose leaders Georgi Dimitrov, Vasil Kolarov and Khristo Kabakchiev worked in exile in Vienna,
  Berlin and Moscow.
