name: ANC and SACP in exile
alternate_names:
  - African National Congress in exile
  - South African Communist Party in exile
country: South Africa
founded: 1960
dissolved: 1990
status: defunct
affiliation: African National Congress; South African Communist Party
description: >-
  The African National Congress and the South African Communist Party between their banning in
  1960 (the party had been banned in 1950) and their legalisation in 1990, with headquarters in
  London, Lusaka and Dar es Salaam. Besides the party's own Inkululeko Publications in London,
  foreign houses printed the speeches of Nelson Mandela and the writings of Ruth First and
  others.
