name: Sardinian communists
alternate_names:
  - Partito comunista italiano, Sardegna
country: Italy
region: Sardinia
founded: 1921
status: defunct
affiliation: Communist Party of Italy and Italian Communist Party
description: >-
  The communists of Sardinia, the island of Antonio Gramsci, who led the post-war struggles of
  its miners and shepherds and the fight for Sardinian autonomy and 'rebirth' (rinascita), under
  leaders such as Velio Spano, veteran of the Spanish Civil War, and the constitutional deputy
  Renzo Laconi; their writings were published in Rome and by Edizioni della Torre in Cagliari.
sources:
