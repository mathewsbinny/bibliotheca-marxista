name: Anton de Kom's anticolonial movement
alternate_names:
  - Anton de Kom
country: Suriname
founded: 1933
dissolved: 1945
status: defunct
affiliation: Surinamese anticolonialism and the Dutch communist movement
description: >-
  The anticolonial movement of the Surinamese writer Anton de Kom (1898–1945), whose meetings
  in Paramaribo in 1933 drew thousands of workers before he was arrested and deported to the
  Netherlands. There, close to the Dutch communist movement, he published Wij slaven van
  Suriname (1934), the founding indictment of Dutch colonialism in Suriname; he died in a Nazi
  camp in 1945 after joining the resistance.
