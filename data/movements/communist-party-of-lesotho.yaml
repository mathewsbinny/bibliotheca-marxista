name: Communist Party of Lesotho
alternate_names:
  - Communist Party of Lesotho (Basutoland)
  - Basutoland Communist Party
country: Lesotho
founded: 1962
status: unknown
affiliation: Marxist–Leninist; allied with the South African Communist Party
description: >-
  The communist party of Basutoland, founded at a congress on 5 May 1962 under its secretary
  John Motloheloa, when the territory was still a British colony surrounded by South Africa. Its
  founding and programme, calling for independence and a socialist Lesotho, were published by
  the South African Communist Party in its journal The African Communist, then printed abroad;
  the party planned its own bulletin, Mosebetsi (The Worker).
