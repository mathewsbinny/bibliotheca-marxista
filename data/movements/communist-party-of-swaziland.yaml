name: Communist Party of Swaziland
alternate_names:
  - CPS
country: eSwatini
founded: 2011
status: active
affiliation: Marxist–Leninist; IMCWP
description: >-
  The Marxist–Leninist party founded in 2011 to fight for a democratic people's republic in
  place of Africa's last absolute monarchy, where political parties are banned from elections;
  its members work underground and from South Africa, and it publishes the weekly Liciniso and
  its programme online.
