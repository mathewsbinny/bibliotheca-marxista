country: Guatemala
founded: 1954
dissolved: 1996
status: defunct
affiliation: Guatemalan Party of Labour (PGT); URNG
description: >-
  The Guatemalan Party of Labour and the left after the CIA-backed coup of 1954, outlawed
  through the civil war until the peace accords of 1996, whose documents and writers, among them
  Luis Cardoza y Aragón in Mexico, were published abroad.
