name: Popular Front for the Liberation of Oman and the Arabian Gulf
alternate_names:
  - PFLOAG
  - Popular Front for the Liberation of Oman
country: Oman
founded: 1968
dissolved: 1992
status: defunct
affiliation: Marxist–Leninist; supported by South Yemen, China and the Soviet Union
description: >-
  The Marxist–Leninist front that grew out of the Dhofar Liberation Front in 1968 and waged the
  Dhofar revolution against the Sultan of Oman and his British and Iranian allies until 1976,
  based in South Yemen. Its statements and appeals were published abroad, among others by the
  Gulf Committee in London.
