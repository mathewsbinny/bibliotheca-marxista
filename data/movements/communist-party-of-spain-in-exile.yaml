name: Communist Party of Spain in exile
alternate_names:
  - PCE in exile
country: Spain
founded: 1939
dissolved: 1977
status: defunct
affiliation: Communist Party of Spain (PCE)
description: >-
  The Communist Party of Spain under the Franco dictatorship, from its defeat in the Civil War
  in 1939 to its legalisation in April 1977. Its leadership, under Dolores Ibárruri and from
  1960 Santiago Carrillo, worked from Moscow, Paris and Bucharest; its histories, congress
  reports and campaigns (as for Julián Grimau, executed in 1963) were printed in Spanish by
  Éditions sociales and its own Colección Ebro in Paris, and in translation by fraternal
  presses.
