name: West African Youth League (Sierra Leone)
alternate_names:
  - WAYL
country: Sierra Leone
founded: 1938
status: defunct
affiliation: Founded by the communist I. T. A. Wallace-Johnson
description: >-
  The radical anticolonial movement founded in Freetown in 1938 by I. T. A. Wallace-Johnson, a
  Sierra Leonean trade unionist who had joined the Communist Party, attended the International
  Labour Defence conference in Moscow in 1933 and sat on the editorial board of the Comintern's
  Negro Worker. Having launched the League in the Gold Coast in 1935, he brought it home with
  its newspaper The African Standard, organising workers until the colonial government interned
  him in 1939.
