name: Socialist League of Malawi
alternate_names:
  - LESOMA
country: Malawi
founded: 1974
status: defunct
affiliation: Communist and pan-Africanist; supported by the German Democratic Republic
description: >-
  The opposition movement of Malawian exiles against the dictatorship of Hastings Banda,
  officially founded in Dar es Salaam in 1974 and led by Attati Mpakati, who embraced communism
  and pan-Africanism. From 1975 to 1978 the German Democratic Republic trained its journalists
  and printed its propaganda; it published the political journal Kuchanso for the Frontline
  States and Malawi. Mpakati was maimed by a letter bomb from Banda's agents in Mozambique in
  1979 and assassinated in Zimbabwe in 1983.
