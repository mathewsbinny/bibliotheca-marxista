name: Parti de la révolution populaire
alternate_names:
  - PRP
  - People's Revolution Party
country: Democratic Republic of the Congo
founded: 1967
dissolved: 1997
status: defunct
affiliation: The Marxist party of Laurent-Désiré Kabila
description: >-
  The Marxist party founded in 1967 by Laurent-Désiré Kabila, a veteran of the Lumumbist
  rebellions of 1964, which held a liberated zone in the Fizi–Baraka mountains of South Kivu
  against Mobutu's Zaire into the 1980s, and from which Kabila led the overthrow of Mobutu in
  1997.
