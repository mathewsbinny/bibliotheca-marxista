name: Chilean left in exile
alternate_names:
  - Unidad Popular in exile
country: Chile
founded: 1973
dissolved: 1990
status: defunct
affiliation: Communist and Socialist parties of Chile; MIR; Unidad Popular
description: >-
  The parties of Salvador Allende's Popular Unity after the coup of September 1973, banned under
  Pinochet until 1990, whose leaders — Luis Corvalán, freed in 1976 and exiled to Moscow,
  Volodia Teitelboim, Carlos Altamirano — and whose documents and speeches were published abroad
  in Spanish and in translation.
