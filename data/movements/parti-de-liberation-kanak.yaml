name: Parti de libération kanak
alternate_names:
  - Palika
  - Kanak Liberation Party
country: France
region: New Caledonia
founded: 1976
status: active
affiliation: Kanak independence movement; founded on a socialist and Marxist programme; FLNKS
description: >-
  The Kanak liberation party of New Caledonia, founded in 1976 by the radical Kanak student
  groups of the Foulards rouges and Groupe 1878, which set the independence struggle on a
  socialist programme of 'Kanak socialist independence' and became a founding member of the
  FLNKS in 1984. Its leaders include the poet Déwé Gorodé and Paul Néaoutyine.
