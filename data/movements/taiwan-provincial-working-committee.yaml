name: Taiwan Provincial Working Committee of the Chinese Communist Party
alternate_names:
  - 中共台灣省工作委員會
  - Taiwan Provincial Work Committee
country: China
region: Taiwan
founded: 1946
dissolved: 1952
status: defunct
affiliation: Chinese Communist Party
description: >-
  The underground organisation of the Chinese Communist Party in Taiwan, set up in 1946 by Cai
  Xiaoqian, a veteran of the Taiwanese Communist Party and the Long March, with committees in
  Taipei, Hsinchu, Tainan, Chiayi and Kaohsiung and among students at National Taiwan
  University. By 1949 it had some 1,300 members and published an underground paper in Taipei. It
  was destroyed by the Kuomintang in the White Terror; its last members were taken in Sanyi,
  Miaoli, in 1952.
