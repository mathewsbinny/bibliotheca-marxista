name: Inuit Ataqatigiit
alternate_names:
  - Community of the People
country: Denmark
region: Greenland
founded: 1976
status: active
affiliation: Greenlandic socialist party, founded on a Marxist programme
description: >-
  The socialist party of Greenland, founded in 1976 by young Greenlanders of the Inuit movement
  in Copenhagen and Nuuk on a Marxist programme of independence from Denmark, among them the
  poet Aqqaluk Lynge. It has since become Greenland's main left-wing party and led its
  government.
