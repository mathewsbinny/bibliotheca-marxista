name: Haitian communists in exile
country: Haiti
founded: 1957
dissolved: 1986
status: defunct
affiliation: Parti unifié des communistes haïtiens
description: >-
  Haitian communists under the Duvalier dictatorship, among them the novelist Jacques Stephen
  Alexis, founder of the Parti d'entente populaire, killed in 1961; their works were printed
  abroad until 1986.
