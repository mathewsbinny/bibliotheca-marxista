name: Union of the Peoples of Cameroon in exile
alternate_names:
  - UPC in exile
country: Cameroon
founded: 1955
dissolved: 1991
status: defunct
affiliation: Union des populations du Cameroun
description: >-
  The UPC after France banned it in 1955: its leaders Ruben Um Nyobè, Félix Moumié and Ernest
  Ouandié were killed, and its exiled leadership and supporters, such as the writer Mongo Beti,
  published from Conakry, Accra and Paris until multiparty politics returned in 1991.
