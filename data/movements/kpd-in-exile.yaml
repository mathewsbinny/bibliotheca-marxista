name: Communist Party of Germany in exile
alternate_names:
  - KPD in exile
country: Germany
founded: 1933
dissolved: 1945
status: defunct
affiliation: Communist Party of Germany (KPD); Comintern
description: >-
  The German communist movement after the Nazi seizure of power in 1933, when the KPD was banned
  and its leaders went into exile in Paris, Prague and Moscow. Its manifestos, the Brown Book on
  the Reichstag fire, the speeches of Wilhelm Pieck and Walter Ulbricht and the work of its
  exiled writers were printed abroad: in German by the cooperative press of foreign workers in
  Moscow, and in translation by the communist presses of other countries, until the National
  Committee for a Free Germany of 1943–1945.
