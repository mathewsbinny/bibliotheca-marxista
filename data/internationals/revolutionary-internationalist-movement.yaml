name: Revolutionary Internationalist Movement
alternate_names:
  - RIM
founded: 1984
dissolved: 2012
status: defunct
affiliation: Maoist (Marxism–Leninism–Maoism)
summary: >-
  An international of Maoist parties founded in 1984, among them the Communist Party of Peru and
  the Communist Party of Nepal (Maoist), which published the journal A World to Win.
description: >-
  An international grouping of Maoist parties and organisations founded in 1984 with a common
  Declaration, among them the Revolutionary Communist Party, USA, the Communist Party of Peru
  and the Communist Party of Nepal (Maoist), which in 1993 adopted Marxism–Leninism–Maoism and
  published the journal A World to Win from London. It broke apart over the Nepalese and
  American parties' lines in the late 2000s.
