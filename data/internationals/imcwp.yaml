name: International Meeting of Communist and Workers' Parties
alternate_names:
  - IMCWP
  - SolidNet
founded: 1998
status: active
affiliation: Marxist–Leninist
summary: >-
  The annual meeting of some eighty communist and workers' parties, begun by the Communist Party
  of Greece in Athens in 1998.
description: >-
  The annual meeting of communist and workers' parties begun by the Communist Party of Greece in
  Athens in 1998, which brings together some eighty parties to adopt joint statements and
  coordinate action, and publishes its proceedings through the host parties and the SolidNet
  portal.
