name: Communist International
alternate_names:
  - Comintern
  - Third International
  - Kommunistische Internationale
  - Internationale communiste
  - Kommunisticheskiĭ internat͡sional
founded: 1919
dissolved: 1943
status: defunct
affiliation: Marxist–Leninist
summary: >-
  Lenin's Third International, founded in Moscow in 1919 to unite the communist parties of the
  world as sections of a single world party, until Stalin dissolved it in 1943.
description: >-
  The Third International, founded in Moscow in March 1919 on Lenin's initiative to unite the
  communist parties of the world as sections of a single world party. Its Executive Committee
  issued the theses, manifestos and congress proceedings of its seven world congresses through
  its own publishing house in Petrograd and Moscow and, in Western Europe, through Carl Hoym in
  Hamburg. It was dissolved by Stalin in May 1943.
