name: Communist Information Bureau
alternate_names:
  - Cominform
  - Information Bureau of the Communist and Workers’ Parties
  - Informbiro
founded: 1947
dissolved: 1956
status: defunct
affiliation: Marxist–Leninist
summary: >-
  The Communist Information Bureau of the Soviet, Eastern European, French and Italian parties,
  founded in 1947. It expelled Yugoslavia in 1948 and was dissolved in 1956.
description: >-
  The Cominform, founded at Szklarska Poręba in September 1947 by the communist parties of the
  Soviet Union, Eastern Europe, France and Italy. Based first in Belgrade and, after the
  expulsion of Yugoslavia in 1948, in Bucharest, it published the resolutions of its meetings
  and the weekly For a Lasting Peace, for a People's Democracy! in many languages. It was
  dissolved in April 1956.
