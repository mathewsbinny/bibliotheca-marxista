name: International Conferences of Communist and Workers' Parties
alternate_names:
  - Moscow Conferences
  - Problems of Peace and Socialism
  - World Marxist Review
  - Peace and Socialism
founded: 1957
dissolved: 1990
status: defunct
affiliation: Marxist–Leninist (pro-Soviet)
summary: >-
  The world conferences of the communist and workers' parties held in Moscow in 1957, 1960 and
  1969, and their joint journal Problems of Peace and Socialism, published in Prague from 1958
  to 1990.
description: >-
  The world conferences of the communist and workers' parties held in Moscow in 1957, 1960 and
  1969, and their common theoretical and information journal Problems of Peace and Socialism
  (World Marxist Review in English), founded in Prague in 1958 and edited jointly by the parties
  until 1990. Its house, Peace and Socialism Publishers, issued the conference documents and its
  own symposia in many languages.
sources:
