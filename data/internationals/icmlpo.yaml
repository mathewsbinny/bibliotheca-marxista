name: International Conference of Marxist–Leninist Parties and Organizations
alternate_names:
  - ICMLPO
  - CIPOML
  - Conferencia Internacional de Partidos y Organizaciones Marxistas-Leninistas
founded: 1994
status: active
affiliation: Marxist–Leninist (Hoxhaist)
summary: >-
  The international of the Marxist–Leninist parties that kept to the line of Enver Hoxha's
  Albania, founded in Quito in 1994.
description: >-
  The international of the Marxist–Leninist parties that upheld the Party of Labour of Albania
  after the fall of its regime, founded in Quito in 1994 by parties from Latin America, Europe
  and Africa, among them the Workers' Communist Party of France, the Communist Party of Togo and
  the Revolutionary Communist Party of Côte d'Ivoire. It publishes the journal Unity and
  Struggle and the communiqués of its plenary sessions.
sources:
