summary: >-
  The Krestintern, founded by the Comintern in 1923 to win the peasant parties of Eastern Europe
  and the colonies to an alliance with the workers.
description: >-
  The Krestintern, founded in Moscow in October 1923 by the Comintern to win the peasant parties
  of Eastern Europe and the colonies to an alliance with the workers. Its International Peasant
  Council published appeals and reports, and its Agrarian Institute in Moscow studied the
  agrarian question; it faded after 1928 and was formally ended in 1939.
