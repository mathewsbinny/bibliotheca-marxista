name: Young Communist International
alternate_names:
  - Kommunistische Jugendinternationale
  - KIM
  - Kommunisticheskiĭ internat͡sional molodezhi
founded: 1919
dissolved: 1943
status: defunct
affiliation: Marxist–Leninist
summary: >-
  The youth organisation of the Communist International, which led the communist youth leagues
  of the world from 1919 until 1943.
description: >-
  The youth organisation of the Communist International, founded in Berlin in November 1919 from
  the socialist youth international, which led the communist youth leagues of the world from
  Berlin and later Moscow and published its programme, congress reports and the journal
  Jugend-Internationale. It was dissolved with the Comintern in 1943.
