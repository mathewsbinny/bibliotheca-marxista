name: International Red Aid
alternate_names:
  - MOPR
  - Internationale Rote Hilfe
  - Secours rouge international
  - Socorro Rojo Internacional
founded: 1922
dissolved: 1947
status: defunct
affiliation: Marxist–Leninist
summary: >-
  MOPR: the Comintern's organisation for the aid of political prisoners and their families, with
  national sections in some seventy countries from 1922.
description: >-
  MOPR, the welfare organisation founded by the Comintern in 1922 to support political prisoners
  of the class struggle and their families, with national sections such as the Rote Hilfe in
  Germany, the Secours rouge in France, the International Labor Defense in the United States and
  the Socorro Rojo in Spain. Its Executive Committee and the MOPR-Verlag in Berlin published its
  appeals, reports and congress protocols.
sources:
