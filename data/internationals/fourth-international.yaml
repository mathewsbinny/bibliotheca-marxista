name: Fourth International
alternate_names:
  - FI
  - Quatrième Internationale
  - Vierte Internationale
  - Cuarta Internacional
founded: 1938
status: active
affiliation: Trotskyist
summary: >-
  Trotsky's international, founded in 1938 against both capitalism and Stalinism; it split in
  1953, and several rival internationals have since claimed its name.
description: >-
  The international founded by Leon Trotsky and his followers near Paris in September 1938 on
  the Transitional Program, as the world party of socialist revolution against both capitalism
  and Stalinism. It split in 1953 between the International Committee and the International
  Secretariat, which partly reunited in 1963 as the United Secretariat; several rival
  internationals have since claimed its name. The works of all its committees are listed here.
