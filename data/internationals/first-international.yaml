name: International Workingmen's Association
alternate_names:
  - First International
  - International Working Men's Association
  - Association internationale des travailleurs
  - Internationale Arbeiter-Assoziation
founded: 1864
dissolved: 1876
status: defunct
affiliation: Socialist, Marxist and anarchist
summary: >-
  The first international workers' organisation, founded in London in 1864, for which Marx wrote
  the Inaugural Address and The Civil War in France. It split between Marxists and anarchists in
  1872 and was dissolved in 1876.
description: >-
  The First International, founded in London in 1864, which united trade unionists, socialists
  and anarchists across Europe and North America. Karl Marx wrote its Inaugural Address and
  Rules and, for its General Council, The Civil War in France (1871) on the Paris Commune. It
  split between the followers of Marx and those of Bakunin at the Hague Congress of 1872, moved
  its seat to New York and was dissolved in 1876.
