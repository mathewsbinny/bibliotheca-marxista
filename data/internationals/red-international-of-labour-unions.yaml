name: Red International of Labour Unions
alternate_names:
  - Profintern
  - RILU
  - Red International of Labor Unions
  - Rote Gewerkschaftsinternationale
founded: 1921
dissolved: 1937
status: defunct
affiliation: Marxist–Leninist
summary: >-
  The Profintern: the Comintern's international of revolutionary trade unions, founded in 1921
  against the reformist Amsterdam International and wound up in 1937.
description: >-
  The Profintern, founded in Moscow in July 1921 to unite revolutionary trade unions against the
  reformist Amsterdam International. Led by Solomon Lozovsky, it published its congress
  resolutions and programmes of action in Moscow and through its bureaus abroad, notably the
  British Bureau and the National Minority Movement in London. It was wound up in 1937 under the
  Popular Front.
