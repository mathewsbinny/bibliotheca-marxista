name: Georgi Dimitrov
alternate_names:
  - G. Dimitrov
  - Georgi Mikhailov Dimitrov
  - Георги Димитров
  - Georgi Mihajlov Dimitrov
born: 1882
died: 1949
nationality: Bulgarian
featured: true
description: >-
  Bulgarian communist who defended himself triumphantly at the Reichstag fire trial of 1933,
  became General Secretary of the Communist International (1935–1943) and launched its Popular
  Front policy, and led Bulgaria from 1946 until his death.
