name: Wilfred Burchett
alternate_names:
  - Wilfred G. Burchett
  - Wilfred Graham Burchett
  - Wilfred J. Burchett
  - Уилфред Бэрчетт
  - W.G Burchett
born: 1911
died: 1983
nationality: Australian
description: >
  Australian war correspondent who was the first Western journalist to report from Hiroshima
  after the atomic bombing. He reported the Korean War from the Chinese and North Korean side
  and the Vietnam War from the North and the National Liberation Front areas, and wrote widely
  on national liberation movements in Asia and Africa. His Australian passport was withheld from
  1955 to 1972.
