name: Friedrich Engels
alternate_names:
  - Engels, Friedrich
  - Frederick Engels
  - F. Engels
  - Фридрих Энгельс
  - "フリードリヒ エンゲルス"
  - "エンゲルス"
born: 1820
died: 1895
nationality: German
featured: true
description: >
  German philosopher, social scientist and revolutionary, Karl Marx's lifelong
  collaborator. The son of a textile manufacturer, he worked in his family's firm
  in Manchester, where he wrote The Condition of the Working Class in England. With
  Marx he wrote The Holy Family, The German Ideology and the Communist Manifesto;
  after Marx's death he edited the second and third volumes of Capital and became
  the leading adviser to the European socialist parties.
