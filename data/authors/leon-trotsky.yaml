name: Leon Trotsky
alternate_names:
  - Lev Davidovich Trotsky
  - L. Trotsky
  - Trotsky, Leon
  - Лев Давидович Троцкий
  - Breton, Andre/trotski, Leon
  - Lev Davidovič Trockij
born: 1879
died: 1940
nationality: Russian
featured: true
description: >-
  Russian revolutionary, chairman of the Petrograd Soviet in 1905 and 1917, organiser of the
  October insurrection and founder of the Red Army. Defeated by Stalin and exiled in 1929, he
  founded the Fourth International in 1938 and was assassinated in Mexico.
