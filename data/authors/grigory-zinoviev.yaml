name: Grigory Zinoviev
alternate_names:
  - G. Zinoviev
  - Grigorii Evseevich Zinov'ev
  - Григорий Евсеевич Зиновьев
  - Grigory Yevseyevich Zinovyev
  - G. Zinov'ev
  - Grigorij Evseevič Zinov′ev
  - Grigorii Zinoviev
born: 1883
died: 1936
nationality: Russian
description: >-
  Bolshevik leader, Lenin's close collaborator in exile and first chairman of the Executive
  Committee of the Communist International (1919–1926). Allied first with Stalin and then with
  Trotsky, he was expelled, tried in the first Moscow Trial and executed.
