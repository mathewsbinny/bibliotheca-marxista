    url: https://www.marxists.org/archive/lafargue/index.htm
  - title: Wikipedia — Paul Lafargue
    url: https://en.wikipedia.org/wiki/Paul_Lafargue
works:
  - title: Le Droit à la paresse
    subtitle: Réfutation du "Droit au travail" de 1848
    year: 1883
    publisher: Henry Oriol
    place: Paris
    notes: First serialised in L'Égalité in 1880.
  - title: 'The Right to Be Lazy: And Other Studies'
    year: 1907
    publisher: C. H. Kerr & Company
