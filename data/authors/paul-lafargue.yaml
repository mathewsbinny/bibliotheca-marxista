name: Paul Lafargue
alternate_names:
  - Lafargue, Paul
born: 1842
died: 1911
nationality: French
featured: true
description: >
  French socialist journalist and Marx's son-in-law, married to Laura Marx. A co-founder with
  Jules Guesde of the French Workers' Party, he did more than anyone to introduce Marxism in
  France. His best-known work is the satirical The Right to Be Lazy.
sources:
