description: >
  Russian revolutionary and theorist, "the father of Russian Marxism". A founder of the
  Emancipation of Labour Group in Geneva in 1883, he laid the theoretical foundations of Russian
  Social Democracy against the Narodniks and taught a generation including Lenin, before siding
  with the Mensheviks.
