name: Helen Foster Snow
alternate_names:
  - Nym Wales
  - Helen Snow
born: 1907
died: 1997
nationality: American
description: >
  American journalist who wrote as Nym Wales. She followed Edgar Snow, then her
  husband, into the Communist base area at Yan'an in 1937, interviewing its
  leaders for Inside Red China, and co-founded the Chinese Industrial
  Cooperatives (Gung Ho) movement. Her Song of Ariran, the life story of the
  Korean revolutionary Kim San, became a classic in Korea.
sources:
