name: Cheddi Jagan
born: 1918
died: 1997
nationality: Guyanese
description: >-
  Founder of the People's Progressive Party, Marxist leader of British Guiana's first
  elected government (1953) and President of Guyana from 1992 to 1997, author of The
  West on Trial.
