name: Karl Kautsky
alternate_names:
  - Kautsky, Karl
  - Karl Johann Kautsky
born: 1854
died: 1938
nationality: Czech-Austrian
featured: true
description: >
  Czech-Austrian Marxist theorist, founding editor of Die Neue Zeit and after Engels's death the
  leading theoretician of the Second International, known as "the Pope of Marxism". He edited
  Marx's Theories of Surplus Value, drafted the theoretical part of the SPD's Erfurt Programme,
  and later broke with the Bolsheviks.
