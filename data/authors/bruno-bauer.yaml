name: Bruno Bauer
alternate_names:
  - Bauer, Bruno
born: 1809
died: 1882
nationality: German
description: >
  German theologian, philosopher and historian, a leading Young Hegelian and for a
  time Marx's mentor in Berlin. His radical biblical criticism cost him his
  university post in 1842; his writings on the Jewish question and his "critical
  criticism" were the targets of Marx's On the Jewish Question and of Marx and
  Engels's The Holy Family.
