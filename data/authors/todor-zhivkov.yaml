name: Todor Zhivkov
born: 1911
died: 1998
nationality: Bulgarian
description: >-
  Leader of the People's Republic of Bulgaria as First (later General) Secretary of the
  Bulgarian Communist Party from 1954 to 1989 and head of state from 1971, whose speeches and
  reports were published in many languages by Sofia Press and Partizdat.
