description: >-
  First Secretary of the Party of Labour of Albania from its founding in 1941 until his death,
  and leader of socialist Albania. He broke with Yugoslavia, the Soviet Union and finally China,
  and his anti-revisionist writings became the basis of the Hoxhaist current of
  Marxism–Leninism.
