name: Palmiro Togliatti
alternate_names:
  - "M. Ercoli"
born: 1893
died: 1964
nationality: Italian
description: >-
  Leader of the Italian Communist Party from 1927 until his death, a secretary of the
  Comintern in the 1930s, and architect of the party's "Italian road to socialism" and
  of the thesis of polycentrism.
