  - P. Van Parijs
born: 1951
nationality: Belgian
description: >-
  Belgian philosopher of the analytical Marxist September Group, author of Marxism Recycled
  (1993), who then turned to liberal egalitarianism and basic income; his works from his Marxist
  years are listed.
