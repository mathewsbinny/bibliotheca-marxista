name: John Strachey
born: 1901
died: 1963
nationality: British
description: >-
  Writer whose The Coming Struggle for Power (1932) and The Nature of Capitalist Crisis made him
  Britain's most widely read Marxist author of the 1930s and a mainstay of the Left Book Club;
  later a Labour minister.
