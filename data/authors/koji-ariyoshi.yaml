name: Koji Ariyoshi
born: 1914
died: 1976
nationality: American
description: >-
  Hawaii-born GI who served with the US mission to the Chinese Communists at Yan'an, then edited
  the left-wing Honolulu Record (1948–1958) and was convicted among the "Hawaii Seven"; author
  of From Kona to Yenan (2000).
