description: >
  German philosopher, the leading figure of the Young Hegelians. His critique of religion as the
  projection of human nature, set out in The Essence of Christianity, and his call for a
  materialist "philosophy of the future" shaped the thinking of the young Marx and Engels, who
  then criticised him in the Theses on Feuerbach and Engels's Ludwig Feuerbach.
