description: >
  German-Jewish philosopher and early communist, one of the first Young Hegelians
  to move to socialism, who helped win the young Engels to communism and worked
  alongside Marx on the Rheinische Zeitung. He later became a forerunner of Labour
  Zionism with Rome and Jerusalem.
