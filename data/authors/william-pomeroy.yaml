name: William J. Pomeroy
alternate_names:
  - William Pomeroy
  - William Joseph Pomeroy
born: 1916
died: 2009
nationality: American
description: >
  American communist who joined the Hukbalahap (Huk) guerrillas in the
  Philippines after the Second World War. He was captured in 1952 and imprisoned
  until 1962, and afterwards wrote on guerrilla warfare, neo-colonialism and
  Philippine history, mostly for International Publishers.
