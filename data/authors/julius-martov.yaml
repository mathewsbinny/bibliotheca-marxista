name: Julius Martov
alternate_names:
  - L. Martov
  - Iulii Osipovich Martov
  - Юлий Осипович Мартов
born: 1873
died: 1923
nationality: Russian
description: >-
  Co-founder with Lenin of the St Petersburg League of Struggle and of Iskra, whose
  dispute with Lenin at the 1903 congress split Russian Social Democracy; he led the
  Menshevik faction thereafter.
