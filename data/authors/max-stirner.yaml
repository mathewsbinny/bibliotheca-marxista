description: >
  Pen name of Johann Kaspar Schmidt, a German philosopher in the Berlin circle of Young
  Hegelians known as "Die Freien". His egoist attack on Feuerbach, on humanism and on socialism
  in The Ego and Its Own provoked the long critique of "Saint Max" in Marx and Engels's The
  German Ideology, and later influenced individualist anarchism.
