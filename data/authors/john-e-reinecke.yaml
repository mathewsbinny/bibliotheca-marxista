name: John E. Reinecke
alternate_names:
  - John Reinecke
born: 1904
died: 1982
nationality: American
description: >-
  Hawaii schoolteacher and linguist of Hawaiian Creole, dismissed for communism in 1948 and
  convicted among the "Hawaii Seven" under the Smith Act; author of the memoir A Man Must Stand
  Up (1993).
