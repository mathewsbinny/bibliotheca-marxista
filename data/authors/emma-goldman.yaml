name: Emma Goldman
born: 1869
died: 1940
nationality: American
description: >-
  Anarchist (not Marxist) revolutionary, deported from the United States to Soviet Russia in
  1919; her My Disillusionment in Russia (1923) is an early eyewitness critique of the Bolshevik
  state.
