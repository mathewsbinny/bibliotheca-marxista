name: Vladimir Mayakovsky
alternate_names:
  - Владимир Владимирович Маяковский
  - "Vladimir Majakovskij"
born: 1893
died: 1930
nationality: Soviet
description: >-
  Futurist poet and playwright who put his art at the service of the revolution, in
  agitational verse, ROSTA posters and the satirical plays The Bedbug and The Bathhouse;
  Stalin later declared him "the best, most talented poet of our Soviet epoch".
