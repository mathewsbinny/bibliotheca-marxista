name: Mahmoud Darwish
alternate_names:
  - محمود درويش
born: 1941
died: 2008
nationality: Palestinian
description: >-
  Palestine's national poet, who in his youth was a member of Rakah and wrote for its press in
  Haifa before leaving Israel in 1970; author of the PLO's 1988 declaration of independence.
