description: >
  Karl Marx's youngest daughter, a socialist activist, trade-union organiser and translator — of
  Flaubert's Madame Bovary, among others — who worked in the new unionism of the late 1880s.
  With her partner Edward Aveling she wrote on the woman question and on the American labour
  movement.
