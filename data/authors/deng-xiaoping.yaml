description: >-
  Chinese communist leader, General Secretary of the party in 1956–1966, twice purged during the
  Cultural Revolution, and from 1978 the paramount leader of China. His programme of "reform and
  opening up" and "socialism with Chinese characteristics", known as Deng Xiaoping Theory, has
  guided the Chinese Communist Party since.
