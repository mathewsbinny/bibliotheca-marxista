name: Rosa Luxemburg
alternate_names:
  - Luxemburg, Rosa
  - Róża Luksemburg
  - Роза Люксембург
  - Rosa Luxemburgo
  - Rosa Luxembourg
  - Rosa de Luxemburgo
born: 1871
died: 1919
nationality: Polish-German
featured: true
description: >
  Polish-born Marxist theorist and revolutionary, a leader of the left wing of the SPD and
  co-founder of the Spartacus League and the Communist Party of Germany. Her reply to Bernstein,
  Reform or Revolution, and her theory of imperialism in The Accumulation of Capital made her
  one of Marxism's major thinkers. She was murdered in Berlin in January 1919.
