description: >-
  Bolshevik leader, chairman of the Moscow Soviet and first editor of Lenin's collected works.
  With Zinoviev he formed the triumvirate with Stalin after Lenin's death, then joined the
  United Opposition; he was executed after the first Moscow Trial.
