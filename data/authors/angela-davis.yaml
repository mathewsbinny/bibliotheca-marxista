name: Angela Davis
alternate_names:
  - Angela Y. Davis
  - Angela Yvonne Davis
born: 1944
nationality: American
featured: true
description: >-
  American Marxist philosopher and activist, a member of the Communist Party USA and twice its
  vice-presidential candidate, whose 1972 acquittal followed an international campaign; her
  writing on race, gender, class and prisons founded the prison abolition movement.
