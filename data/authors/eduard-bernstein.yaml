description: >
  German Social Democrat who edited the party's exile paper Der Sozialdemokrat in Zurich and
  London under the Anti-Socialist Laws and was Engels's literary executor. His critique of
  Marxist theory in The Preconditions of Socialism opened the "revisionism" debate in the Second
  International.
