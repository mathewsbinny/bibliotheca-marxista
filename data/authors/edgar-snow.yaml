name: Edgar Snow
alternate_names:
  - Snow, Edgar
  - Edgar Parks Snow
  - Edgar P. Snow
  - Эдгар Сноу
born: 1905
died: 1972
nationality: American
description: >
  American journalist whose reporting from the Communist base areas of northern China in 1936 —
  published as Red Star Over China — gave the world its first extended account of Mao Zedong and
  the Chinese Red Army. He reported on the Sino-Japanese War and the Soviet Union, returned to
  China several times after 1949, and was one of the few Western writers with access to Mao in
  the 1960s.
