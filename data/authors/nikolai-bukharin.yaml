description: >-
  Bolshevik theorist and editor of Pravda, author with Preobrazhensky of The ABC of Communism,
  and in the 1920s the leading defender of the New Economic Policy. As leader of the Right
  Opposition he was defeated by Stalin in 1929, and was tried and executed in the third Moscow
  Trial. His followers abroad formed the International Communist Opposition.
