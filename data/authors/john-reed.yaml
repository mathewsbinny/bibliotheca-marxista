description: >
  American journalist, poet and socialist. He reported on the Mexican Revolution and the Eastern
  Front of the First World War, and witnessed the October Revolution in Petrograd, which he
  recounted in Ten Days That Shook the World. A founder of the Communist Labor Party of America,
  he died in Moscow and is buried at the Kremlin Wall.
