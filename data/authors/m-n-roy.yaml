name: M. N. Roy
alternate_names:
  - Manabendra Nath Roy
born: 1887
died: 1954
nationality: Indian
featured: true
description: >-
  Bengali revolutionary who founded the Mexican Communist Party and the Communist Party of India
  (at Tashkent, 1920), debated the colonial question with Lenin at the Comintern, and later
  founded Radical Humanism.
