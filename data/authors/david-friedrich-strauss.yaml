name: David Friedrich Strauss
alternate_names:
  - Strauss, David Friedrich
  - David Friedrich Strauß
born: 1808
died: 1874
nationality: German
description: >
  German theologian whose Life of Jesus, treating the gospels as myth, caused a scandal that
  split the Hegelian school into right and left and opened the way for the Young Hegelians'
  critique of religion. George Eliot translated it into English in 1846.
