name: August Bebel
alternate_names:
  - Bebel, August
  - A. Bebel
born: 1840
died: 1913
nationality: German
featured: true
description: >
  German turner and co-founder, with Wilhelm Liebknecht, of the Social Democratic Workers' Party
  in 1869, and for decades the leader of German Social Democracy. His Woman and Socialism, first
  issued under the Anti-Socialist Laws, became one of the most widely read socialist books of
  its time.
