name: Jon Elster
born: 1940
nationality: Norwegian
description: >-
  Norwegian social theorist, a founder of analytical Marxism with Making Sense of Marx (1985)
  and An Introduction to Karl Marx (1986), who then turned to rational-choice theory; his works
  from his Marxist years are listed.
