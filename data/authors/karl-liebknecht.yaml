description: >-
  German socialist, son of Wilhelm Liebknecht, the first Reichstag deputy to vote against war
  credits in 1914 and co-founder with Rosa Luxemburg of the Spartacus League and the Communist
  Party of Germany; both were murdered in January 1919.
