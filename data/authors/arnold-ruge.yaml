name: Arnold Ruge
alternate_names:
  - Ruge, Arnold
born: 1802
died: 1880
nationality: German
description: >
  German philosopher and radical publicist, the chief organiser of the Young Hegelian press. He
  edited the Hallische Jahrbücher and its successor the Deutsche Jahrbücher until their
  suppression, then in exile the Anekdota and, with Marx, the Deutsch-Französische Jahrbücher,
  before breaking with Marx over communism.
sources:
