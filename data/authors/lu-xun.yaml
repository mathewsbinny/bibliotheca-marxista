name: Lu Xun
alternate_names:
  - Xun Lu
born: 1881
died: 1936
nationality: Chinese
description: >-
  The founder of modern Chinese literature, author of Diary of a Madman and The True Story of Ah
  Q, essayist and translator of Soviet literature, who led the League of Left-Wing Writers from
  1930 and was honoured by Mao as the commander of China's cultural revolution.
