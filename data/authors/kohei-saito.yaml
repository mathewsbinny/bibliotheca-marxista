name: Kohei Saito
alternate_names:
  - Kōhei Saitō
  - 斎藤幸平
born: 1987
nationality: Japanese
description: >-
  Japanese Marxist philosopher at the University of Tokyo and an editor of the
  Marx-Engels-Gesamtausgabe, whose reading of Marx's late ecological notebooks argues for
  "degrowth communism"; his Capital in the Anthropocene sold over half a million copies in
  Japan.
