description: >
  German tanner and self-taught philosopher who arrived independently at a
  materialist dialectic; Marx praised him and Engels credited him with discovering
  dialectical materialism on his own. He worked in Russia, Germany and finally the
  United States, where he edited socialist papers in Chicago.
