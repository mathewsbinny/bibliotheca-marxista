name: Wilhelm Liebknecht
alternate_names:
  - Liebknecht, Wilhelm
born: 1826
died: 1900
nationality: German
featured: true
description: >
  German revolutionary of 1848, a member of the Communist League and close to Marx
  and Engels in London exile, who co-founded the Social Democratic Workers' Party
  with August Bebel in 1869 and edited its central organs, Der Volksstaat and later
  Vorwärts. He was the father of Karl Liebknecht.
