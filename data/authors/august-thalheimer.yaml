name: August Thalheimer
alternate_names:
  - A. Thalheimer
born: 1884
died: 1948
nationality: German
description: >-
  Marxist theorist and co-leader with Heinrich Brandler of the Communist Party of Germany in
  1921–1923. Expelled as a "rightist" in 1928–29, he founded the Communist Party of Germany
  (Opposition), the German section of the Right Opposition aligned with Bukharin, and died in
  exile in Cuba.
sources:
