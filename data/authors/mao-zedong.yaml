description: >-
  Founding member and, from 1935, leader of the Chinese Communist Party, who led the revolution
  to victory in 1949 and chaired the People's Republic of China until his death. His theory of
  protracted people's war and his campaigns against revisionism, culminating in the Cultural
  Revolution, shaped Maoism worldwide.
