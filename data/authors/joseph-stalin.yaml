description: >-
  Georgian-born Bolshevik who became General Secretary of the Communist Party of the Soviet
  Union in 1922 and ruled the Soviet Union from the late 1920s until his death, directing forced
  collectivisation, rapid industrialisation, the Great Purge and the Soviet war effort in the
  Second World War.
