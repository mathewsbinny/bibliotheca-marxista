description: >
  German journalist, historian and literary critic who came to Marxism in the 1890s and became
  the leading historian of German Social Democracy and Marx's first major biographer. A
  co-founder of the Spartacus League with Rosa Luxemburg and Karl Liebknecht, he gave his name
  to Mehring Books.
