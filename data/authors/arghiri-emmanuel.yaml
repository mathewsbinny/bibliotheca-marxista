name: Arghiri Emmanuel
born: 1911
died: 2001
nationality: Greek-French
description: >-
  Greek-born French Marxist economist whose theory of unequal exchange, arguing that
  international trade transfers value from low-wage to high-wage nations, was a foundation of
  dependency and world-systems theory.
