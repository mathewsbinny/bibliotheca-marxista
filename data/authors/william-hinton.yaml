name: William Hinton
alternate_names:
  - William H. Hinton
born: 1919
died: 2004
nationality: American
description: >
  American farmer and writer who worked as a tractor technician in China during the land reform
  of the late 1940s. His notes from the village of Zhangzhuang ("Long Bow") became Fanshen, a
  classic account of revolution in the Chinese countryside, which he followed with studies of
  the Cultural Revolution and of China's turn away from collective agriculture.
