name: Ernst Thälmann
alternate_names:
  - Ernst Thaelmann
born: 1886
died: 1944
nationality: German
description: >-
  Hamburg dock worker who led the Communist Party of Germany from 1925 to 1933, was arrested by
  the Nazis in 1933 and murdered in Buchenwald after eleven years in solitary confinement.
