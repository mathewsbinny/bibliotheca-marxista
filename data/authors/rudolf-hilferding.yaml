name: Rudolf Hilferding
born: 1877
died: 1941
nationality: Austrian / German
description: >-
  Austrian-born Marxist economist and Social Democratic finance minister of the Weimar
  Republic, whose Finance Capital analysed the fusion of bank and industrial capital and
  shaped Lenin's and Bukharin's theories of imperialism.
