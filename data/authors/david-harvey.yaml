name: David Harvey
born: 1935
nationality: British
featured: true
description: >-
  British Marxist geographer, Distinguished Professor at the City University of New York, whose
  work on the urbanisation of capital, uneven development and neoliberalism, and whose
  long-running lectures on Capital, have made him one of the most widely read Marxists of his
  generation.
