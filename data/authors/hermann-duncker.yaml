name: Hermann Duncker
born: 1874
died: 1960
nationality: German
description: >-
  A founder of the Communist Party of Germany and its leading educator, who headed the
  Marxist Workers' School in Berlin and edited the Elementarbücher des Kommunismus;
  later a teacher in the GDR.
