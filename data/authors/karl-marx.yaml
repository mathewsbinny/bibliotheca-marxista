name: Karl Marx
alternate_names:
  - Marx, Karl
  - Karl Heinrich Marx
  - K. Marx
  - Карл Маркс
  - カール・マルクス
  - マルクス
  - Karl (Karl Heinrich) Marx
  - カール・ハインリヒ マルクス
born: 1818
died: 1883
nationality: German
featured: true
description: >
  German philosopher, economist and revolutionary. A Young Hegelian in his student years in
  Berlin, he edited the Rheinische Zeitung and, with Arnold Ruge, the Deutsch-Französische
  Jahrbücher, before working out with Friedrich Engels the materialist conception of history.
  After the revolutions of 1848 he lived in exile in London, where he wrote Capital and led the
  International Working Men's Association. Much of his work was published only after his death.
