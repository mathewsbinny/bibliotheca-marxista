name: Alexander Bogdanov
alternate_names:
  - A. Bogdanov
  - Aleksandr Aleksandrovich Bogdanov
  - Александр Александрович Богданов
  - Aleksandr Bogdanov
  - Alexander Alexandrowitsch Bogdanow
  - A. A. Bogdanov
  - Aleksandr A. Bogdanov
born: 1873
died: 1928
nationality: Russian
featured: true
description: >-
  Physician, philosopher and co-founder of the Bolshevik faction, whose empiriomonism Lenin
  attacked in Materialism and Empirio-Criticism. He founded the Proletkult movement and wrote
  the utopian novel Red Star.
