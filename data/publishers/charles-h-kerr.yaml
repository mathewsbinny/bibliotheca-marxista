description: >-
  The oldest socialist publisher in the United States, founded in Chicago in 1886 and turned
  into a socialist cooperative by Charles H. Kerr in 1899. It published the first complete
  English translation of Capital (1906–1909) and the Standard Socialist Series and the
  International Socialist Review, and later the writings of the IWW, Eugene Debs and Mother
  Jones; it has been run as a nonprofit cooperative since 1971.
