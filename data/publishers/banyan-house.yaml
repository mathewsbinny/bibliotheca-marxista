name: Banyan House Publishing
alternate_names:
  - Banyan House
country: Vietnam
city: Hanoi
founded: 2023
status: active
languages: [English]
website: https://www.banyanhouse.org/
description: >
  A Hanoi publisher of "revolutionary books for a changing world", founded in 2023.
  Its name comes from the banyan tree that traditionally stands at the entrance to
  a Vietnamese village — the place where villagers gather and make decisions
  together — and in particular from the Tân Trào banyan in Tuyên Quang province,
  beneath which Vietnam's 1945 revolution against Japanese fascism and French
  colonialism began. In that spirit of collective action, the house aims to
  publish books that inspire change throughout "the village that is our world".
  Its first book, the product of nearly three years of translation, was the first
  English edition of Vietnam's university curriculum on the basic principles of
  Marxism-Leninism; its titles are also available as free ebooks.
