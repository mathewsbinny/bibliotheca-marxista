name: Pravda (Bratislava)
alternate_names:
  - Vydavateľstvo Pravda
  - Slovenské vydavateľstvo politickej literatúry
  - Epocha
country: Czechoslovakia
city: Bratislava
founded: 1953
dissolved: 1990
status: defunct
affiliation: Communist Party of Slovakia (KSS)
languages:
  - Slovak
identifiers:
  wikidata: "Q112151713"
description: >-
  The publishing house of the Communist Party of Slovakia, part of the Pravda printing
  and publishing combine founded in 1945. It published political books, textbooks,
  encyclopedias and party materials as the Slovak Publishing House of Political
  Literature (1953–1968), Epocha (1968–1970) and then Pravda, until its publishing
  passed to state enterprises in 1990.
