description: >-
  The Lithuanian SSR's publishing house of political, philosophical and scientific
  literature, which began as the State Publishing House of Political and Scientific
  Literature (VPMLL) and took the name Mintis ("Thought") in 1964. It published Lenin
  and the documents of the Communist Party of Lithuania in Lithuanian.
