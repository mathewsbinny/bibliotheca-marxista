description: >-
  The All-Ethiopian Socialist Movement, a Marxist–Leninist party founded by Ethiopian
  students abroad in 1968, which allied with the Derg after the 1974 revolution against
  the Ethiopian People's Revolutionary Party, before being suppressed by the Derg itself
  in 1977.
