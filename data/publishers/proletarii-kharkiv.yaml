name: Proletarii
alternate_names:
  - Proletariĭ
  - Пролетарий
  - Proletar
country: Soviet Union
region: Ukraine
city: Kharkiv
founded: 1921
dissolved: 1932
status: defunct
affiliation: Communist Party (Bolsheviks) of Ukraine
languages:
  - Russian
  - Ukrainian
description: >-
  The publishing house of the Central Committee of the Communist Party (Bolsheviks) of Ukraine
  in Kharkiv in the 1920s, which issued the Russian editions of Lenin, party histories and
  political literature for Ukraine's workers until it was merged into the party publishing house
  Partvydav in the early 1930s.
