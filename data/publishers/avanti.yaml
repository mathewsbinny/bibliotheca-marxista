name: Avanti!
alternate_names:
  - Edizioni Avanti!
  - Società Editrice Avanti!
country: Italy
city: Rome
founded: 1896
dissolved: 1993
status: defunct
affiliation: Newspaper and publishing house of the Italian Socialist Party
languages: [Italian]
description: >
  The daily newspaper of the Italian Socialist Party, founded in Rome on
  25 December 1896, and its publishing house, which issued the party's pamphlets,
  congress reports and editions of socialist classics. The paper later moved its
  main office to Milan. Suppressed under Fascism and published in exile and
  clandestinely, it resumed after the Liberation and ceased in December 1993.
