name: Working People's Alliance
alternate_names:
  - WPA
country: Guyana
city: Georgetown
founded: 1974
status: active
languages:
  - English
description: >-
  Formed in Guyana in 1974 as an alliance of radical groups, and a party from 1979, it
  was informally led by Walter Rodney until his assassination in June 1980, and set out
  to replace ethnic politics with class solidarity. Its publications include Clive
  Thomas's Sugar and Liberation; its paper was Dayclean.
