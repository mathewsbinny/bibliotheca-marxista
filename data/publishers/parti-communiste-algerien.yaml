description: >-
  The Algerian Communist Party, founded in 1936 from the Algerian region of the French
  Communist Party, which fought for independence, joined the armed struggle in 1955 and
  was banned by the French in 1955 and by the independent government in 1962. It
  published pamphlets, programmes and memoranda, including its memorandum to the United
  Nations on the Algerian war.
