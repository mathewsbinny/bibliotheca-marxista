description: >-
  A Tokyo publisher founded on 21 February 1957 in the orbit of the Japanese Communist
  Party. It publishes the writings of party leaders such as Fuwa Tetsuzō, Japanese
  editions of Marx and Engels, party documents, and proletarian literature, including
  the collected works of Miyamoto Yuriko and Kobayashi Takiji.
