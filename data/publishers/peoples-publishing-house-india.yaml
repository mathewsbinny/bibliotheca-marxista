name: People's Publishing House (New Delhi)
alternate_names:
  - PPH
  - People's Publishing House, Bombay
  - Lok Vangmay Griha
country: India
city: New Delhi
founded: 1942
status: active
affiliation: Publishing arm of the Communist Party of India
languages: [English, Hindi, and other Indian languages]
description: >
  Founded in Bombay in 1942, when the Communist Party of India was legalised, as
  the party's publishing and book-distribution arm, operating from Raj Bhuvan on
  Sandhurst Road, the party's headquarters. It was incorporated in 1947 and moved
  its headquarters to Delhi in the early 1950s; its building on Rani Jhansi Road
  was built between 1956 and 1958. It publishes Marxist and progressive literature,
  history, fiction and children's books, and remains active with branches across
  India. In Maharashtra its successor is Lok Vangmay Griha.
