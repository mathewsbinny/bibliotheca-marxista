name: Tanzania Publishing House
alternate_names:
  - TPH
country: Tanzania
city: Dar es Salaam
founded: 1966
status: active
affiliation: State-owned; owned by Tanzania's Ministry of Education
languages: [English, Swahili]
description: >
  Tanzania's state publisher, set up in the 1960s (its bookshop gives 1966) to
  supply school and cultural books in Kiswahili and English in line with the
  country's ujamaa socialism. Under Walter Bgoya, its general manager from 1973 to
  1991, it became a centre of anti-imperialist publishing, issuing Walter Rodney's
  How Europe Underdeveloped Africa (1972, with Bogle-L'Ouverture in London) and
  works by Agostinho Neto and Samora Machel. It remains active, now mainly as a
  textbook publisher.
