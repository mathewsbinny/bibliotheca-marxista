description: >
  The London publishing house of the South African Communist Party during the apartheid
  years, when the party was banned at home. Its name is the Zulu and Xhosa word for
  freedom. It published the party's quarterly The African Communist (founded 1959) and
  books on the party's history and politics, including Fifty Fighting Years (1971),
  Moses Kotane: South African Revolutionary (1975) and South African Communists Speak:
  Documents from the History of the South African Communist Party, 1915–1980 (1981). It
  was active from 1971 until 1990, when the party was unbanned in South Africa; The
  African Communist is now published from Johannesburg.
