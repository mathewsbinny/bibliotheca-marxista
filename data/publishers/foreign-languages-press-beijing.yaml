description: >
  The People's Republic of China's publisher of foreign-language books, formed in
  1952 from the publishing work of the International News Bureau to increase the
  distribution of Chinese material abroad. Best known internationally for its
  editions of the works of Mao Zedong and other political literature in the 1960s
  and 1970s, it remains active under the China International Communications Group.
  Its imprint gives the city as Peking until the adoption of Pinyin spellings
  around 1979, and Beijing thereafter.
