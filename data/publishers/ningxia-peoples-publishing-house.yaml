name: Ningxia People's Publishing House
alternate_names:
  - Ningxia ren min chu ban she
  - 宁夏人民出版社
country: China
city: Yinchuan
founded: 1973
status: active
estimated:
  - founded
affiliation: Publishing house of the Communist Party committee of Ningxia
languages:
  - Chinese
description: >-
  The People's Publishing House of Ningxia, the provincial party press, which publishes the
  local editions of the works of Mao, Marx and Lenin, the documents of the Party and the
  provincial government, political education literature and local history. Only its output to
  1990 is catalogued here.
