country: Turkey
city: Ankara
founded: 1965
status: active
languages:
  - Turkish
identifiers:
  wikidata: "Q21527018"
description: >-
  Founded in Ankara in 1965 by Muzaffer Erdost, it translated the classics of Marx,
  Engels, Lenin, Stalin and Mao into Turkish. After Erdost's brother İlhan was beaten to
  death in Mamak military prison following the 1980 coup, his name was added to the
  house's; it still sells its books at half price every 7 November, the anniversary of
  his death.
