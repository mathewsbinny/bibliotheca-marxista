description: >-
  The Marxist–Leninist ruling party of the People's Republic of the Congo (1969–1991),
  founded by Marien Ngouabi. Its imprint published the messages and theoretical writings
  of its presidents — Joachim Yhombi-Opango's The Theoretical Weapon, Denis Sassou
  Nguesso's addresses — and the proceedings of its joint colloquia with the Soviet
  party.
