name: La Lutte (Saigon)
alternate_names:
  - La Lutte
country: Vietnam
city: Saigon
founded: 1933
dissolved: 1939
status: defunct
affiliation: United-front paper of the Vietnamese communists and Trotskyists
languages:
  - French
  - Vietnamese
description: >-
  The Saigon weekly founded in 1933 by Nguyễn An Ninh, Tạ Thu Thâu, Nguyễn Văn Tạo and
  others, a united front of Stalinists and Trotskyists that won seats on the Saigon
  municipal council, until the split of 1937; it published pamphlets and election
  programmes alongside the paper.
sources:
  - title: Wikipedia — La Lutte (newspaper)
