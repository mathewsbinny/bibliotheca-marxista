name: Éditions Sociales
alternate_names:
  - Éditions Sociales Internationales
  - Les Éditions Sociales
  - Editions Sociales
country: France
city: Paris
founded: 1927
predecessor: librairie-de-l-humanite
status: active
affiliation: Publishing house of the French Communist Party until the 1990s; independent since 1997
languages: [French]
description: >
  The French Communist Party's publisher, founded in 1927 as Éditions Sociales
  Internationales and reconstituted at the Liberation in 1944 as Éditions
  Sociales. Under the philosopher Lucien Sève (1970–1982) it became a full
  publishing house, known above all for its French editions of Marx and Engels.
  In 1986 it was absorbed into the Messidor–La Farandole group, which failed in
  1991; its successor collapsed in 1993. In 1997 former staff and authors
  recovered the name and backlist, and the relaunched house — formally
  independent of the PCF — continues the Grande Édition de Marx et d'Engels.
name_history:
  - name: Éditions Sociales Internationales
    from: 1927
    to: 1944
  - name: Éditions Sociales
    from: 1944
    to: 1986
  - name: Messidor / Éditions Sociales
    from: 1986
    to: 1993
    note: A department of the Messidor–La Farandole group, later Scandéditions
  - name: Les Éditions Sociales (relaunched)
    from: 1997
    note: Independent of the PCF
