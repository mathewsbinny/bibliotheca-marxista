name: Russian Free Press Fund
alternate_names:
  - Fond volʹnoi russkoi pressy
  - Printed by the Russian Free Press Fund
country: United Kingdom
home_country: Soviet Union
city: London
founded: 1891
dissolved: 1917
status: defunct
affiliation: Émigré publishing house of Russian revolutionaries in London
languages:
  - Russian
  - English
description: >-
  The London publishing house of Russian revolutionary émigrés, founded in 1891 by
  Sergei Stepniak-Kravchinsky, Feliks Volkhovsky and others, which printed socialist and
  populist literature for smuggling into Russia, in the tradition of Herzen's Free
  Russian Printing House of the 1850s and 1860s.
