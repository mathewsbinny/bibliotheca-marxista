name: Central Party Literature Press
alternate_names:
  - 中央文献出版社
  - Zhong yang wen xian chu ban she
  - Central Literature Publishing House
country: China
city: Beijing
founded: 1987
status: active
affiliation: Party Literature Research Office of the Chinese Communist Party Central Committee
languages: [Chinese]
description: >
  Established on 15 April 1987 under the Chinese Communist Party's Party Literature
  (Documentation) Research Office, it publishes the collected and selected writings
  of the party's leaders, among them Deng Xiaoping, Chen Yun and Mao Zedong,
  together with chronologies, biographies and studies of their thought.
sources:
  - title: Wikipedia — Central Literature Publishing House
    url: https://en.wikipedia.org/wiki/Central_Literature_Publishing_House
