name: Otto Meissner
alternate_names:
  - Verlag von Otto Meissner
  - Otto Meißner
country: Germany
city: Hamburg
founded: 1848
status: active
languages: [German]
description: >
  The Hamburg house of the publisher and bookseller Otto Meissner (1819–1902), a
  Hamburg city councillor from 1871 to 1876, who took on reform-minded and socialist
  authors. It published the first volume of Karl Marx's Capital in 1867 — printed by
  Otto Wigand in Leipzig — and, after Marx's death, the second (1885) and third
  (1894) volumes edited by Friedrich Engels, as well as the 1869 second edition of
  The Eighteenth Brumaire of Louis Napoleon. The publishing house he founded in
  1848 still exists.
sources:
