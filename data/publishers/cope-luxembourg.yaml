description: >-
  A workers' cooperative press in Luxembourg, whose catalogued books of the early 1980s
  include defences of the Polish government during the Solidarity crisis and the memoirs
  of Luxembourgers forcibly conscripted into the Wehrmacht. It is the printing and
  publishing cooperative of the Communist Party of Luxembourg's paper Zeitung vum
  Lëtzebuerger Vollek, founded in 1946, and still trades from the paper's offices in
  Esch-sur-Alzette.
