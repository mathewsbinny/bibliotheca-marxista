name: Editorial Vitória
alternate_names:
  - Editorial Vitória Limitada
country: Brazil
city: Rio de Janeiro
founded: 1944
dissolved: 1964
status: defunct
affiliation: Publishing house of the Brazilian Communist Party (PCB)
languages: [Portuguese]
description: >
  The principal publishing venture in the history of the Brazilian Communist
  Party, organised by Leôncio Basbaum on business lines and the most important
  communist publisher in Brazil in the 1940s and 1950s. It issued communist and
  party literature from 1944 until the military coup of 1964.
sources:
  - title: "A Editorial Vitória e as Edições Comunistas no Brasil: da legalidade ao golpe (1944–1964), doctoral thesis"
    url: https://www.academia.edu/102364056/A_Editorial_Vit%C3%B3ria_e_as_Edi%C3%A7%C3%B5es_Comunistas_no_Brasil_Da_Legalidade_ao_Golpe_1944_1964_Tese_de_Doutorado
