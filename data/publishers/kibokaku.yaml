name: Kibōkaku
alternate_names:
  - 希望閣
country: Japan
city: Tokyo
founded: 1924
dissolved: 1933
status: defunct
estimated:
  - dissolved
languages:
  - Japanese
description: >-
  One of the major left-wing publishers of pre-war Japan, which issued Japanese
  translations of Marx and Lenin — including a Lenin selected works — and writings of
  the Japanese labour and socialist movements in the 1920s and early 1930s, before the
  suppression of the left.
sources:
