description: >
  The publications of FRELIMO, the Mozambique Liberation Front. During the armed
  struggle against Portuguese colonial rule its Department of Information and
  Propaganda, working from the movement's exile headquarters in Dar es Salaam,
  issued political posters, bulletins and pamphlets, including the English-language
  Mozambique Revolution. After independence in 1975 the department issued party
  documents such as Tarefas concretas e imediatas a realizar (Maputo, 1976) before
  its work passed, around 1976, to the new state's bodies, among them the National
  Directorate of Propaganda and Publicity (DNPP). FRELIMO has governed Mozambique
  since independence and continues to publish as a party.
