name: Iskra Press
alternate_names:
  - Искра
  - Tipografiia «Iskry»
country: Germany
home_country: Soviet Union
city: Munich
founded: 1900
dissolved: 1905
status: defunct
languages:
  - Russian
description: >
  The press of Iskra ("The Spark"), the newspaper of the Russian Social Democratic
  Labour Party founded by Lenin, Martov, Plekhanov and others in 1900. Printed in exile
  to evade the tsarist censorship, it moved from Munich to London in 1902 — where it was
  printed at the Twentieth Century Press — and to Geneva in 1903. It issued the
  newspaper and party pamphlets for smuggling into Russia. After the 1903 split Iskra
  passed to the Mensheviks, and it ceased in 1905.
name_history:
  - name: Iskra, Munich
    from: 1900
    to: 1902
  - name: Iskra, London
    from: 1902
    to: 1903
    note: Printed at the Twentieth Century Press, Clerkenwell Green
  - name: Iskra, Geneva
    from: 1903
    to: 1905
