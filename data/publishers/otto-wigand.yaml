description: >
  The Leipzig house of Otto Friedrich Wigand (1795–1870), who had earlier founded a
  publishing business in Kaschau (Košice) before settling in Leipzig in 1833; it
  traded as Verlag Otto Wigand from 1839. After the German Confederation banned the
  Young Germany writers in 1835, Wigand became the champion of the Young Hegelians,
  publishing Arnold Ruge's Hallische Jahrbücher, Ludwig Feuerbach — whose complete
  works he issued from 1846 — Bruno Bauer, Moses Hess and Max Stirner's The Ego and
  Its Own, as well as Friedrich Engels's The Condition of the Working Class in
  England (1845). In 1867 his press printed the first edition of Marx's Capital for
  the Hamburg publisher Otto Meissner. He retired in 1864, handing the business to
  his son Hugo Karl Wigand, and the firm continued until 1906.
