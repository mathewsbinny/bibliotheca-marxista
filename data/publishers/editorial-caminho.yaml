name: Editorial Caminho
alternate_names:
  - Caminho
country: Portugal
city: Lisbon
founded: 1975
status: active
affiliation: Founded by Portuguese Communist Party activists
languages:
  - Portuguese
description: >-
  Founded in Lisbon in 1975 by Portuguese Communist Party activists, among them
  Francisco Melo and Vítor Branco, first publishing the newspaper O Diário and from
  April 1977 books, with Zeferino Coelho as its editor: left-committed but more
  independent than a party house. It became the publisher of José Saramago and is now
  part of LeYa. Only its output to 1991 is catalogued here.
