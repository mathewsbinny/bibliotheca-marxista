description: >-
  Founded in Oslo in 1970 by members of SUF (m-l), the Maoist youth league that became
  part of the Workers' Communist Party (AKP), it published the Norwegian
  Marxist–Leninist movement and a growing list of new Norwegian fiction. It has been
  owned by Aschehoug since 1992; only its output to 1991 is catalogued here.
