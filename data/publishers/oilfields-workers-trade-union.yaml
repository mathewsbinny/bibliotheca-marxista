description: >-
  Trinidad's oil workers' union, founded in 1937, which under its president George
  Weekes (1962–1987), co-founder with C. L. R. James of the Marxist Workers and Farmers
  Party, became the centre of the Caribbean labour left. It published Lennox Pierre's
  The Ideology of the Working Class and studies of African and Caribbean history.
