affiliation: Communist Party of Canada (Labor-Progressive Party, 1943–1959)
languages:
  - English
description: >-
  The publishing house of the Communist Party of Canada, which operated as the
  Labor-Progressive Party from 1943 to 1959. It published party programmes and the
  writings of its leader Tim Buck, the historian Stanley Ryerson and others, and
  distributed Soviet literature in Canada. Its imprint appears in library catalogues
  from the mid-1940s to the 1980s.
