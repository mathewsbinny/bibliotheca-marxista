description: >-
  The publisher of the legal American communist party in the 1920s, the Workers Party of
  America, whose literature department and the Daily Worker Publishing Company in Chicago issued
  the first American editions of Lenin and the party's pamphlets until Workers Library
  Publishers took over in New York.
