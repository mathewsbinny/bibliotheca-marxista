description: >
  Founded in Mexico City on 18 November 1965 by Arnaldo Orfila Reynal, dismissed
  for political reasons as director of the Fondo de Cultura Económica, with
  Laurette Séjourné and a circle of intellectuals — among them Julio Cortázar and
  Octavio Paz — to create a house beyond the reach of censorship for emancipatory
  ideas and left-wing thought across Latin America, and became a reference point
  for critical social science in Spanish. An Argentine branch
  followed in 1966 and an independent sister house, Siglo XXI de España, in 1967.
  It remains active.
