name: Dongbei Shudian
alternate_names:
  - Dong bei shu dian
  - 东北书店
  - Northeast Bookstore
country: China
city: Harbin
founded: 1945
dissolved: 1951
status: defunct
affiliation: Publishing house of the Communist Party in Northeast China
languages:
  - Chinese
description: >-
  The publishing house the Communist Party set up in the Northeast after the Japanese
  surrender in 1945, which published Mao's Selected Works (the first collected edition,
  1948), the works of Marx and Lenin and the literature of land reform, in Harbin,
  Shenyang and elsewhere, until it became the Northeast branch of Xinhua.
