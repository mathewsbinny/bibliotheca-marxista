name: New Books Publications
alternate_names:
  - New Books
country: Ireland
city: Dublin
founded: 1952
dissolved: 1989
status: defunct
estimated:
  - founded
affiliation: Communist Party of Ireland
languages:
  - English
description: >-
  The Dublin publisher associated with the Irish communist movement, which kept the
  writings of James Connolly in print and published Lenin on Ireland and the Communist
  Party of Ireland's own histories. Its imprint appears in library catalogues from the
  1950s to the 1970s.
sources:
