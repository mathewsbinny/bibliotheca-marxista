description: >
  A nonprofit radical publisher founded in Chicago in 2001 by Anthony Arnove,
  Ahmed Shawki and Julie Fain, who had worked on the International Socialist Review.
  Named after the 1886 Haymarket affair, it publishes books for struggles for
  social and economic justice; its first title was The Struggle for Palestine.
  It also runs Haymarket House, an organising and events space in Chicago, and
  remains active.
