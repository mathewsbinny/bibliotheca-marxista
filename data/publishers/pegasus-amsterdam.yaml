country: Netherlands
city: Amsterdam
founded: 1934
status: active
affiliation: Communist Party of the Netherlands (CPN)
languages:
  - Dutch
identifiers:
  wikidata: "Q2921236"
description: >-
  Founded in 1934, the publishing house of the Communist Party of the Netherlands, which
  published Dutch editions of Marx, Engels and Lenin, official Soviet histories, and
  Dutch communist writers such as Theun de Vries. It survives as an Amsterdam bookshop
  for Slavic studies and East European literature; only its output to 1991 is catalogued
  here.
