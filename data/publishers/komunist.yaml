name: Komunist
alternate_names:
  - Izdavački centar Komunist
  - Izdavački centar "Komunist"
country: Yugoslavia
city: Belgrade
founded: 1961
dissolved: 1991
status: defunct
estimated:
  - founded
  - dissolved
affiliation: League of Communists of Yugoslavia
languages:
  - Serbo-Croatian
  - Slovene
  - Macedonian
description: >-
  The publishing centre of the League of Communists of Yugoslavia, named after its
  central organ Komunist, with branches in Belgrade, Ljubljana and the other republican
  capitals. It published congress documents, party statutes and the writings of the
  League's leaders and theorists, including on Yugoslav self-management. Its imprint
  appears in library catalogues from the 1960s to the end of the League in 1990.
