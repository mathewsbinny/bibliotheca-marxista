description: >-
  The Maoist organisation founded in Montreal in 1972 by Charles Gagnon, one of the two main
  groups of the Canadian Marxist–Leninist movement, which published its newspaper En Lutte!/In
  Struggle!, its programme and its polemics in French and English until it dissolved in 1982.
