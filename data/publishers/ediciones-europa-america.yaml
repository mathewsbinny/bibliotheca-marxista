name: Ediciones Europa-América
alternate_names:
  - Europa-América
  - EDEYA
country: Spain
city: Madrid
founded: 1929
dissolved: 1939
status: defunct
affiliation: Communist International publisher in Spain, associated with the Communist Party of Spain
languages: [Spanish]
description: >
  A publisher created by the Communist International after its Sixth Congress,
  active from 1929 and made operational in Spain in 1931 by its agent Ettore
  Quaglierini ("Pablo Bono"). From 1935 its catalogue ranged from Marxist classics
  and pamphlets on Soviet affairs to popular series, large-format books, the
  magazine La Internacional Comunista and children's books. Its publishing ended in
  1939 with the defeat of the Republic in the Civil War.
sources:
  - title: Filosofía en español — Ediciones Europa-América
    url: https://www.filosofia.org/ave/001/a438.htm
