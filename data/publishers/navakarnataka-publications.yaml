name: Navakarnataka Publications
alternate_names:
  - Navakarnataka Prakashana
  - ನವಕರ್ನಾಟಕ ಪ್ರಕಾಶನ
country: India
city: Bangalore
founded: 1960
status: active
languages: [Kannada, English]
website: https://navakarnataka.com/
description: >
  A Bangalore publisher of progressive literature founded in 1960, which aimed to
  bring such writing into every household in Karnataka. It has published more than
  6,000 titles — most in Kannada, some 400 in English — and runs its own shops in Bengaluru, Mysuru,
  Mangaluru and Kalaburagi. It remains active.
sources:
