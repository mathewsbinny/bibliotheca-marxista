name: Népszava
alternate_names:
  - Népszava Könyvkereskedés
  - Népszava-Könyvkereskedés Kiadása
country: Hungary
city: Budapest
founded: 1877
dissolved: 1948
status: defunct
affiliation: Publishing house of the Social Democratic Party of Hungary
languages:
  - Hungarian
description: >-
  The publishing house and bookshop of Népszava ("People's Voice"), the newspaper of the
  Social Democratic Party of Hungary, which published socialist pamphlets, translations
  of Marx, Kautsky and Bebel and the party's literature until the party's merger with
  the communists in 1948.
