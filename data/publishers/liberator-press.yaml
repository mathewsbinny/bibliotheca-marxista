description: >-
  The Chicago publisher of the October League (M-L), founded in 1971, and its successor
  from 1977, the Communist Party (Marxist–Leninist), leading organisations of the Maoist
  New Communist Movement. It published Harry Haywood's Black Bolshevik and Martin
  Nicolaus's Restoration of Capitalism in the USSR, and pamphlets from 1973 to 1979.
