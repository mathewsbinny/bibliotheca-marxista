description: >-
  The exile press of the Tudeh Party of Iran, which was banned in Iran in 1949 and
  rebuilt its organisation in the Soviet bloc, with headquarters in Leipzig from 1957.
  Its books and annuals of the 1970s and 1980s carry the imprint Tudeh Publishing
  Centre, Stockholm, and include Persian translations of Marx and the works of party
  intellectuals such as Ehsan Tabari; the party's paper Mardom and journal Donya were
  produced in East Germany.
