name: Pathfinder Press
alternate_names:
  - Pioneer Publishers
  - Merit Publishers
country: United States
city: New York
founded: 1930
status: active
affiliation: Publishing arm of the Socialist Workers Party
languages: [English, Spanish, French, and others]
website: https://www.pathfinderpress.com/
description: >
  The publisher of the American Trotskyist movement. It began in New York in 1930
  as Pioneer Publishers, affiliated with the Communist League of America (a
  predecessor of the Socialist Workers Party), became Merit Publishers in 1965 and
  Pathfinder Press in 1969. It publishes the writings of Leon Trotsky, James P.
  Cannon, Malcolm X, Che Guevara and Fidel Castro, and the leaders of the SWP, and
  remains active.
name_history:
  - name: Pioneer Publishers
    from: 1930
    to: 1965
  - name: Merit Publishers
    from: 1965
    to: 1969
  - name: Pathfinder Press
    from: 1969
sources:
