name: Editori Riuniti
alternate_names:
  - Edizioni Rinascita
  - Edizioni di Cultura Sociale
country: Italy
city: Rome
founded: 1953
status: active
affiliation: Publishing house of the Italian Communist Party
languages: [Italian]
website: https://editoririuniti.it/
description: >
  Formed in Rome in 1953 by merging the two publishers close to the Italian
  Communist Party — Edizioni Rinascita, led by Valentino Gerratana, and Edizioni di
  Cultura Sociale, directed by Roberto Bonchio, who then led Editori Riuniti for
  decades. It published the classics of Marxism, including the complete works of
  Marx and Engels in Italian, and the journals Studi storici (from 1959) and
  Critica marxista (from 1963). Since 2013 the name has belonged to Gruppo
  Editoriale Italiano, which relaunched it.
name_history:
  - name: Edizioni Rinascita and Edizioni di Cultura Sociale
    to: 1953
    note: The Communist Party's two earlier publishers
  - name: Editori Riuniti
    from: 1953
  - name: Editori Riuniti (Gruppo Editoriale Italiano)
    from: 2013
