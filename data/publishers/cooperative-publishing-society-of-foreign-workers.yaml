name: Co-operative Publishing Society of Foreign Workers in the USSR
alternate_names:
  - Verlagsgenossenschaft ausländischer Arbeiter in der UdSSR
  - VEGAAR
  - Éditions en langues étrangères (coopérative)
country: Soviet Union
city: Moscow
founded: 1931
dissolved: 1938
status: defunct
languages:
  - English
  - German
  - French
  - and others
identifiers:
  wikidata: "Q28134137"
  gnd: "1081390565"
description: >-
  A Moscow and Leningrad publisher of the 1930s for the foreign workers and political
  émigrés living in the Soviet Union, which issued Stalin's speeches, Lenin, Soviet
  fiction and the writings of German and other exiled communists in their own languages.
  Its imprint appears in library catalogues from 1931 to 1938; its work passed to the
  Foreign Languages Publishing House.
