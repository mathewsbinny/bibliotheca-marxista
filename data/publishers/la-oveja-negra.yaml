name: Editorial La Oveja Negra
alternate_names:
  - La Oveja Negra
  - Oveja Negra
country: Colombia
city: Medellín
founded: 1968
status: active
languages:
  - Spanish
description: >-
  Founded in Medellín in December 1968 by eleven recent graduates from the student
  movement to circulate left-wing ideas in Colombia, through translations of Marxist
  works, cheap formats and imported books, before it turned to mass-market publishing in
  the 1970s. Only its output to 1979 is catalogued here.
sources:
  - title: >-
      "Editorial Oveja Negra: del auge del libro de izquierda a la masificación del
      libro en Colombia" (Redalyc)
    url: https://www.redalyc.org/journal/4983/498363510010/
