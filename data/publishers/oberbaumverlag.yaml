name: Oberbaumverlag
alternate_names:
  - Oberbaum Verlag
  - Oberbaumpresse
country: Germany
city: West Berlin
founded: 1965
dissolved: 2012
status: defunct
languages:
  - German
description: >-
  A West Berlin publisher of the post-1968 Marxist–Leninist left, whose books on the
  history of the German communist movement shaped the outlook of the Maoist KPD/AO's
  cadres, alongside reprints of Weimar-era communist literature and studies of national
  liberation.
sources:
