description: >
  The publishing house of the Portuguese Communist Party, named after the party's
  central organ Avante!, founded in 1931. The imprint was already in use
  underground under the Salazar dictatorship — a bibliography of the party's
  history lists an Edições Avante! title dated 1957 — though how regularly before
  1974 is not confirmed. Its legal existence dates from 1974: after the Carnation
  Revolution of 25 April 1974 the first legal Avante! appeared on 17 May, and
  Edições Avante! was publishing openly the same year, beginning with the
  proceedings of the party's 7th (Extraordinary) Congress of October 1974 and
  Álvaro Cunhal's speeches, which later filled 22 volumes covering 1974–88. Its
  main series include the Biblioteca do Marxismo-Leninismo, Lenin's Selected Works
  in six volumes, Marx's Capital, Marx and Engels's Selected Works in three
  volumes, Álvaro Cunhal's Selected Works, and party documents and histories. It
  has published continuously since 1974 — among recent titles a centenary history
  of the party in 2021 — and remains active.
