description: >-
  The publishing house of the POUM, the anti-Stalinist Marxist party founded in Barcelona in
  1935 by Andreu Nin and Joaquín Maurín, which published its programmes, the writings of Nin,
  Maurín and Juan Andrade and its paper La Batalla until the party was outlawed in 1937; La
  Batalla continued in exile in Paris.
