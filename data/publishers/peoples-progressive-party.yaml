name: People's Progressive Party
alternate_names:
  - PPP
country: Guyana
city: Georgetown
founded: 1950
status: active
languages:
  - English
description: >-
  The Marxist party founded in British Guiana in 1950 by Cheddi Jagan, which led the
  colony's first elected government in 1953 before it was removed by Britain. Its own
  imprint, and that of its education committee, published Jagan's analyses of poverty,
  sugar and Caribbean unity. The party's paper was Thunder.
