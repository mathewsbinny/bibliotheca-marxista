name: Lenizdat
alternate_names:
  - Лениздат
  - Leningrad Publishing House
country: Soviet Union
city: Leningrad
founded: 1930
dissolved: 2009
status: defunct
affiliation: Publishing house of the Leningrad Communist Party committees
languages:
  - Russian
description: >-
  The publishing house of the Leningrad party organisation, founded in 1930 as
  Leneblizdat and renamed Lenizdat in 1938. It published political literature, the
  history of the revolution and the siege of Leningrad, and general books for the city
  and region.
