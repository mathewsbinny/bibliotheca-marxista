name: Komunistické nakladatelství a knihkupectví
alternate_names:
  - Komunistické knihkupectví a nakladatelství
country: Czechoslovakia
city: Prague
founded: 1921
dissolved: 1938
status: defunct
affiliation: Publishing house of the Communist Party of Czechoslovakia
languages:
  - Czech
description: >-
  The publishing house and bookshop of the Communist Party of Czechoslovakia between the
  wars, which published Czech translations of Marx, Engels and Lenin, Comintern
  documents and the party's own literature until the party was banned in 1938.
