name: Fedon Publishers
country: Grenada
city: St. George's
founded: 1982
dissolved: 1983
status: defunct
estimated:
  - founded
affiliation: People's Revolutionary Government of Grenada
languages:
  - English
description: >-
  The publishing house of Maurice Bishop's People's Revolutionary Government
  (1979–1983), named after Julien Fédon, leader of the 1795 rebellion, with Chris Searle
  as its main editor. It published the revolution's speeches, budgets and accounts of
  its programmes, such as "To construct from morning" and Grenada Is Not Alone, until
  the US invasion of 1983.
