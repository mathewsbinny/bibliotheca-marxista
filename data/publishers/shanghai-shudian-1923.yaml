name: Shanghai Shudian (1923–1926)
alternate_names:
  - 上海书店
  - Shanghai Bookstore
country: China
city: Shanghai
founded: 1923
dissolved: 1926
status: defunct
affiliation: Bookstore and publisher of the Communist Party of China
languages:
  - Chinese
description: >-
  The Shanghai bookstore that the Communist Party of China opened in 1923 to publish and
  sell its literature—the journals Xiangdao and Xin qingnian and pamphlets on
  Marxism—until the warlord authorities closed it in 1926.
