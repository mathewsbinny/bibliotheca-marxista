description: >-
  The faction of Israeli communism recognised by the Soviet Union after the party split
  in 1965: the New Communist List (Rakah), predominantly Arab and anti-Zionist, led by
  Meir Vilner and Tawfik Toubi, whose Arabic paper al-Ittihad in Haifa was edited by
  Emile Habibi and published Palestinian writers such as Mahmoud Darwish and Samih
  al-Qasim. It took the name Communist Party of Israel in 1989. Only its imprint of
  1965–1991 is catalogued here.
