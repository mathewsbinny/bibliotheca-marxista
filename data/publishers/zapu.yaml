name: Zimbabwe African People’s Union
alternate_names:
  - ZAPU
  - ZAPU Publications
  - Patriotic Front (ZAPU)
country: Zimbabwe
city: Lusaka
founded: 1961
dissolved: 1987
status: defunct
affiliation: Soviet-aligned liberation movement of Zimbabwe
languages:
  - English
description: >-
  The Zimbabwe African People's Union, founded in 1961 by Joshua Nkomo, which fought
  white-minority rule in Rhodesia from exile in Zambia with Soviet support through its
  army ZIPRA, formed the Patriotic Front with ZANU in 1976, and merged into ZANU–PF in
  1987. Its National Publicity Bureau published statements and pamphlets from Lusaka and
  Cairo.
sources:
