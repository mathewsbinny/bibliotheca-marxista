name: Jiangxi People's Publishing House
alternate_names:
  - Jiangxi ren min chu ban she
  - 江西人民出版社
country: China
city: Nanchang
founded: 1954
status: active
estimated:
  - founded
affiliation: Publishing house of the Communist Party committee of Jiangxi
languages:
  - Chinese
description: >-
  The People's Publishing House of Jiangxi, the provincial party press, which publishes the
  local editions of the works of Mao, Marx and Lenin, the documents of the Party and the
  provincial government, political education literature and local history. Only its output to
  1990 is catalogued here.
