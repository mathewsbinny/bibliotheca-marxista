description: >-
  The Marxist–Leninist Palestinian organisation founded by George Habash in December
  1967, the second-largest faction of the PLO. Its Information Department in Beirut,
  where Ghassan Kanafani edited its weekly al-Hadaf, published its strategy, programmes
  and analyses in Arabic and English.
