description: >-
  The joint publishing house formed in Hong Kong in 1948 from the three left-wing publishers
  Shenghuo, Dushu and Xinzhi, which published Marxist literature for the coming People's
  Republic and moved to Beijing in 1949. Only its output to 1966 is catalogued here.
