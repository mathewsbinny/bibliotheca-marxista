website: https://mehring.com/
description: >
  The Trotskyist publisher of the International Committee of the Fourth
  International and the Socialist Equality Party (formerly the Workers League),
  named after Franz Mehring. It grew out of Labor Publications, founded in 1970,
  and has traded as Mehring Books since 1995 or 1998. It publishes the
  writings of Leon Trotsky and other anti-Stalinist socialists — many in English
  for the first time — alongside works on the history of the socialist movement,
  the arts, economics and philosophy, with distribution in the United States,
  Canada, Australia and Britain.
