description: >
  The first Russian Marxist organisation, founded in Geneva in 1883 by Georgi Plekhanov, Pavel
  Axelrod, Vera Zasulich, Lev Deutsch and Vasily Ignatov. From exile it translated and published
  the works of Marx and Engels for smuggling into Russia, in its Library of Contemporary
  Socialism series, together with Plekhanov's own writings. The group dissolved in 1903, when
  its members joined the Russian Social Democratic Labour Party at its Second Congress.
