name: Jajasan Pembaruan
alternate_names:
  - Yayasan Pembaruan
  - Pembaruan Foundation
country: Indonesia
city: Jakarta
founded: 1950
dissolved: 1966
status: defunct
affiliation: Communist Party of Indonesia (PKI)
languages:
  - Indonesian
description: >-
  The publishing foundation of the Communist Party of Indonesia, set up as the party was
  rebuilt under D. N. Aidit from 1950. It issued the writings of Aidit and other PKI
  leaders, party documents, and Indonesian translations of Marx, Lenin, Mao and others,
  alongside magazines, until the party was destroyed in the mass killings of 1965–66. At
  its height the PKI was the largest communist party outside the socialist states.
sources:
  - title: >-
      Yuliantri, "Jajasan 'Pembaruan': Propaganda discourse through its printed
      products", Informasi 51/1
    url: https://journal.uny.ac.id/index.php/informasi/article/view/32778
