description: >-
  Founded in Warsaw on 20 November 1948 by merging the Polish Workers' Party's publisher
  Książka with the Polish Socialist Party's Wiedza, as the two parties united into the
  Polish United Workers' Party. It was the party's main publisher of Marxist–Leninist
  theory, history, philosophy and social science, part of the RSW Prasa-Książka-Ruch
  conglomerate from 1973 until 1990. It continues as a publisher; only its output to
  1990 is catalogued here.
