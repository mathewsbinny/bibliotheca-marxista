description: >
  Founded in 1972 by Peter Randall and the theologians Beyers Naudé and Danie van
  Zyl — its name joins the initials of Randall, van Zyl and Naudé — to publish the
  reports of the Study Project on Christianity in Apartheid Society (SPRO-CAS).
  By 1974 it was a full publishing house specialising in anti-apartheid
  literature, funded mainly by international donors. It published many black
  writers and the literary magazine Staffrider (1978–1993), and Randall was banned
  by the state. It was anti-apartheid rather than Marxist, but central to the
  South African left's publishing. In 1994 it sold a majority stake to Hodder &
  Stoughton Educational Southern Africa, and by 1999 it had been fully acquired,
  ending its life as an independent house; Hodder's South African business later
  became part of Macmillan South Africa.
