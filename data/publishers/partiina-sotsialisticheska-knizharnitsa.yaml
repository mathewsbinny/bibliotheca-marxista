name: Partiĭna sotsialisticheska knizharnitsa
alternate_names:
  - Party Socialist Bookshop
  - Партийна социалистическа книжарница
country: Bulgaria
city: Sofia
founded: 1903
dissolved: 1919
status: defunct
affiliation: Publishing house of the Bulgarian Workers' Social Democratic Party (Narrow Socialists)
languages:
  - Bulgarian
description: >-
  The bookshop and press of the Bulgarian Workers' Social Democratic Party (Narrow
  Socialists) of Dimitar Blagoev, which published Marxist literature and the party's
  pamphlets from the split of 1903 until the party became the Bulgarian Communist Party
  in 1919.
