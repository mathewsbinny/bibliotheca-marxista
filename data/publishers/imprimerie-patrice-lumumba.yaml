name: Imprimerie Patrice Lumumba
alternate_names:
  - Imprimerie nationale Patrice Lumumba
country: Guinea
city: Conakry
founded: 1962
dissolved: 1996
status: defunct
languages:
  - French
description: >-
  The national printing house of Sékou Touré's Guinea, named after the murdered
  Congolese leader, which printed the state's laws, the party's pan-Africanist
  publications and festival literature.
