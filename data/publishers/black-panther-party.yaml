description: >-
  The publications of the Black Panther Party, founded in Oakland in 1966 by Huey P. Newton and
  Bobby Seale, which adopted Marxism–Leninism and issued the writings of Newton and Eldridge
  Cleaver, its Ten-Point Program and the newspaper The Black Panther through its Ministry of
  Information.
