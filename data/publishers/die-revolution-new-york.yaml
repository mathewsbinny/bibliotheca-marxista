name: Die Revolution (Joseph Weydemeyer)
alternate_names:
  - Die Revolution
  - Joseph Weydemeyer
country: United States
home_country: Germany
city: New York
founded: 1852
dissolved: 1852
status: defunct
languages:
  - German
description: >
  A German-language periodical founded in New York in 1852 by Joseph Weydemeyer, a
  member of the Communist League and Marx's friend, who had emigrated to the United
  States after 1848. Its first number carried the first edition of Marx's Der achtzehnte
  Brumaire des Louis Napoleon (The Eighteenth Brumaire of Louis Napoleon). The
  periodical soon failed for lack of money.
