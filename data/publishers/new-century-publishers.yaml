name: New Century Publishers
country: United States
city: New York
founded: 1945
dissolved: 1963
status: defunct
predecessor: workers-library-publishers
affiliation: Communist Party USA
languages:
  - English
description: >-
  The Communist Party USA's pamphlet publisher from 1945 to 1963, successor to Workers
  Library Publishers, with titles by Herbert Aptheker, William Z. Foster and others. An
  unrelated New Jersey publisher of the 1980s used the same name and is excluded.
sources:
  - title: Encyclopedia of American Communism — Communist Party of America publications
    url: https://www.marxists.org/history/usa/eam/cpa/cpapubs.html
