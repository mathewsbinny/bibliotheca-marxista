name: Hakuyōsha
alternate_names:
  - 白揚社
country: Japan
city: Tokyo
founded: 1917
status: active
languages:
  - Japanese
description: >-
  A Tokyo publisher that was one of the major left-wing houses of pre-war Japan, issuing
  Marxist philosophy and Japanese economic and social history through the 1930s;
  notoriously, it was the one left publisher whose books were never banned. Only its
  output to 1945 is catalogued here.
sources:
  - title: >-
      Making Capital of "Illegal" Publication under Japanese Imperial Censorship
      (Humanities, 2023)
