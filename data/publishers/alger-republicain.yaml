name: Alger républicain
alternate_names:
  - Éditions Alger républicain
country: Algeria
city: Algiers
founded: 1938
dissolved: 1991
status: defunct
estimated:
  - dissolved
affiliation: Daily close to the Algerian Communist Party
languages:
  - French
description: >-
  The Algiers daily founded in 1938, on which Albert Camus worked, which became the paper of the
  Algerian Communist Party's milieu under Henri Alleg, was banned during the war of independence
  and again after the coup of 1965, and reappeared from 1989. Its book imprint published Boualem
  Khalfa, Henri Alleg and other writers of the Algerian left.
