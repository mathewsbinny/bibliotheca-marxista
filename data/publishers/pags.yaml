name: Parti de l'avant-garde socialiste
alternate_names:
  - PAGS
  - Ḥizb al-Ṭalīʻah al-Ishtirākīyah
  - Socialist Vanguard Party
country: Algeria
city: Algiers
founded: 1966
dissolved: 1993
status: defunct
affiliation: Algeria's communist party from 1966
languages:
  - French
  - Arabic
description: >-
  The Socialist Vanguard Party (PAGS), founded in 1966 by Algerian communists after the
  coup that brought Houari Boumediène to power, which worked clandestinely and then
  legally from 1989, publishing its paper Saout Ech-Chaab and its resolutions, until it
  dissolved in 1993.
