description: >
  The review and publishing house founded in Milan on 15 January 1891 by Filippo
  Turati with Anna Kuliscioff — the most influential Marxist review in Italy in
  the 1890s and the voice of the reformist wing of the Italian Socialist Party. Suppressed under the Fascist press laws in 1926, it resumed in 1945; in
  1976 the PSI under Bettino Craxi rescued its publishing house. After ten years'
  silence the review returned in 2023.
