name: Workers' Educational Association (London)
alternate_names:
  - Bildungs-Gesellschaft für Arbeiter
  - Kommunistischer Arbeiterbildungsverein
  - Deutscher Arbeiterbildungsverein
  - German Workers' Educational Association
country: United Kingdom
home_country: Germany
city: London
founded: 1840
dissolved: 1918
status: defunct
affiliation: Founded by members of the League of the Just; linked to the Communist League
languages:
  - German
description: >
  The German communist workers' association in London, founded on 7 February 1840 by
  members of the League of the Just. Its small office press, the "Bildungs- Gesellschaft
  für Arbeiter", was run by the printer J. E. Burghard at 46 Liverpool Street,
  Bishopsgate — a member of the Communist League from June 1847. In January 1848 the
  tailor Friedrich Lessner brought it the manuscript of the Manifest der Kommunistischen
  Partei, which it printed in February 1848, the first edition of the Communist
  Manifesto. The association continued in London until 1918.
