name: Eritrean People's Liberation Front
alternate_names:
  - EPLF
  - Hezbāwi genbār ḥārenat ʼÉretrā
country: Eritrea
city: Nakfa
founded: 1970
dissolved: 1994
status: defunct
languages:
  - Tigrinya
  - English
  - Arabic
description: >-
  The publications of the Eritrean People's Liberation Front, the Marxist-led movement
  that fought for Eritrean independence from Ethiopia, issued from its base areas and
  its offices abroad, including dictionaries and selected articles. The EPLF became the
  People's Front for Democracy and Justice in 1994, after independence.
