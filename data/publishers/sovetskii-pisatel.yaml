name: Sovetskii pisatel'
alternate_names:
  - Sovetsky Pisatel
  - Советский писатель
  - Sov. pisatel'
country: Soviet Union
city: Moscow
founded: 1934
dissolved: 1992
status: defunct
affiliation: Union of Soviet Writers
languages: [Russian]
identifiers:
  wikidata: "Q4426449"
description: >
  "Soviet Writer", formed in 1934 by merging Sovetskaya Literatura with the Moscow
  Writers' Partnership and the Writers' Publishing House in Leningrad; its first
  books appeared after the First Congress of Soviet Writers in November 1934, the
  congress that proclaimed Socialist Realism. From 1938 it was the publishing house
  of the Union of Soviet Writers, issuing new Soviet fiction, poetry and criticism
  from Moscow and a Leningrad branch. In 1992 the Leningrad branch closed and the
  Moscow house became a commercial company.
