name: Donskaia rech'
alternate_names:
  - Izdanie N. Paramonova Donskaia rechʹ
  - Донская речь
country: Soviet Union
city: Rostov-on-Don
founded: 1903
dissolved: 1907
status: defunct
affiliation: Publishing house of Nikolai Paramonov
languages:
  - Russian
description: >-
  The Rostov-on-Don publishing house of the merchant Nikolai Paramonov, which in 1903–1906
  published cheap editions of socialist and democratic literature—Marx, Engels, Kautsky,
  Lassalle and Bebel—in hundreds of thousands of copies, until it was prosecuted.
