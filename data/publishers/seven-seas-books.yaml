name: Seven Seas Books
alternate_names:
  - Seven Seas Publishers
  - 7 Seas Publishers
country: East Germany
city: Berlin
founded: 1958
dissolved: 1980
status: defunct
affiliation: Founded by Gertrude Gelbin (Gertrude Heym); a subsidiary of Verlag Volk und Welt
languages: [English]
description: >
  An East Berlin publisher of English-language paperbacks, founded in 1958 by the
  American Gertrude Gelbin, wife of the novelist Stefan Heym, and later edited by
  Kay Pankey. Its list featured progressive and socialist writers from Britain,
  the United States, Australia, Africa and elsewhere — many hard to find in print
  in their own countries — alongside translations of East German authors. It
  closed in 1980.
