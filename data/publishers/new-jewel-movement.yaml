description: >-
  Grenada's Marxist–Leninist party, which took power under Maurice Bishop in 1979 and
  collapsed with his killing and the US invasion of 1983. The publications under its
  name include those of its UK support group, which published the defence of the
  imprisoned party leaders such as Bernard Coard.
