description: >-
  The publishing house of the Communist Academy (until 1924 the Socialist Academy of
  Social Sciences), the Soviet centre of Marxist research in the 1920s and early 1930s,
  which published Marxist theory, political economy, history and philosophy until the
  Academy was merged into the Academy of Sciences in 1936.
