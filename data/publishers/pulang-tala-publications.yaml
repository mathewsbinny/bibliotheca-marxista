name: Pulang Tala Publications
alternate_names:
  - Lathalaang Pulang Tala
  - Pulang Tala
country: Philippines
city: Manila
founded: 1970
dissolved: 1972
status: defunct
affiliation: Early imprint of the Communist Party of the Philippines
languages: [English, Filipino]
description: >
  An early imprint of the Communist Party of the Philippines, whose name means
  "Red Star"; its Filipino form was Lathalaang Pulang Tala. It is known almost
  entirely from one year, 1971, when it published the first printed edition of
  Philippine Society and Revolution, the party's founding text, written by Jose
  Maria Sison under the pen name Amado Guerrero. The text had first appeared in
  1970 as chapters serialised in University of the Philippines campus papers and
  then in mimeographed copies; Pulang Tala issued it as a "little red book", sold,
  Sison recalled, mainly in the lobbies of the Diliman campus. The same year
  Lathalaang Pulang Tala published the Filipino edition, Lipunan at Rebolusyong
  Pilipino. By 1972 the book was being reissued by another imprint, Bandilang Pula
  Publishing, and the declaration of martial law in September 1972 drove the
  party's publishing fully underground. Pulang Tala was a short-lived front name
  from the party's semi-open period, around 1970–72; these dates are approximate,
  as no documented founding or closing date, and no title from another year, has
  been found.
