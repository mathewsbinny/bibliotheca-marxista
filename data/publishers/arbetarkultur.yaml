name: Arbetarkultur
alternate_names:
  - Arbetarkulturs förlag
country: Sweden
city: Stockholm
founded: 1930
dissolved: 1990
status: defunct
affiliation: Communist Party of Sweden (later VPK)
languages:
  - Swedish
description: >-
  The Stockholm publishing house of the Swedish communist movement, which issued Swedish
  translations of Stalin, Lenin and Soviet writing from the 1930s, and later Swedish
  working-class fiction. Its imprint appears in library catalogues from 1940 to the
  1980s.
sources:
  - title: Open Library — Arbetarkultur
    url: https://openlibrary.org/publishers/Arbetarkultur
  - title: Flamman — Böcker för arbetarklassen
    url: http://flamman.se/a/bocker-for-arbetarklassen
