description: >-
  The St Petersburg (Petrograd) publishing house founded by the Bolshevik Vladimir
  Bonch-Bruevich, which published popular science and social-democratic literature and,
  in 1917, the first editions of Lenin's Imperialism, the Highest Stage of Capitalism
  and The State and Revolution.
