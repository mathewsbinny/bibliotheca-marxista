description: >
  Launched in 1970 by New Left Review as New Left Books (NLB), taking as its logo
  Tatlin's planned Monument to the Third International. Verso — the left-hand page
  — began as NLB's paperback imprint at the end of the 1970s and became its sole
  imprint. Now based in London and Brooklyn, it describes itself as the largest
  independent radical publisher in the English-speaking world, with more than 1,800 titles by 2020,
  from Benedict Anderson, Eric Hobsbawm and Ellen Meiksins Wood to Mike Davis,
  David Harvey and Slavoj Žižek.
