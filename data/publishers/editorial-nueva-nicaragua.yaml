name: Editorial Nueva Nicaragua
alternate_names:
  - Nueva Nicaragua
  - Editorial Nueva Nicaragua — Ediciones Monimbó
country: Nicaragua
city: Managua
founded: 1981
dissolved: 1997
status: defunct
affiliation: Associated with the Sandinista revolutionary government
languages: [Spanish]
description: >
  A Managua publisher of the Sandinista revolution, active from 1981 to 1997,
  issuing works such as Carlos Fonseca's Bajo la bandera del sandinismo (1981) and
  Nicaraguan literature, often with Ediciones Monimbó.
sources:
  - title: Open Library — Editorial Nueva Nicaragua
    url: https://openlibrary.org/publishers/Editorial_Nueva_Nicaragua
