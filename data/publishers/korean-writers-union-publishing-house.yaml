name: Korean Writers' Union Publishing House
alternate_names:
  - Chosŏn Chakka Tongmaeng Ch'ulp'ansa
  - 조선작가동맹출판사
country: North Korea
city: Pyongyang
founded: 1950
dissolved: 1961
status: defunct
estimated:
  - founded
affiliation: Korean Writers' Union (Chosŏn Chakka Tongmaeng)
languages:
  - Korean
description: >-
  The press of the Korean Writers' Union, the North Korean writers' organisation. Its
  imprint is catalogued mainly on novels and poetry of the 1950s and 1960s, by writers
  such as Han Sŏr-ya and Yi Ki-yŏng. In 1961 its press was merged with the state
  literature and art houses into the publishing house of the Korean Federation of
  Literature and Arts, the forerunner of the Literature and Art Publishing House; the
  few later books catalogued under its name are reissues or cataloguing variants.
