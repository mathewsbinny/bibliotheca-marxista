name: Parti communiste tunisien
alternate_names:
  - Tunisian Communist Party
  - al-Ḥizb al-Shuyūʻī al-Tūnisī
country: Tunisia
city: Tunis
founded: 1934
dissolved: 1993
status: defunct
affiliation: Communist Party of Tunisia
languages:
  - French
  - Arabic
description: >-
  The Tunisian Communist Party, founded in 1934 from the Tunisian region of the French
  Communist Party, banned from 1963 to 1981, which became the Ettajdid movement in 1993.
  Its publications include its memorandum to the United Nations on Tunisian
  independence.
