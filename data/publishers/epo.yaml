name: EPO
alternate_names:
  - Uitgeverij EPO
  - Éditions EPO
country: Belgium
city: Berchem (Antwerp)
founded: 1978
status: active
affiliation: Workers' Party of Belgium (PVDA-PTB, formerly AMADA)
languages:
  - Dutch
  - French
description: >-
  An Antwerp publisher founded in 1978, which grew out of "Proletarian Education",
  started in 1973 by the Marxist party AMADA (All Power to the Workers), later the
  Workers' Party of Belgium. It published Ludo Martens's writings and remains an
  independent left-wing publisher of about 35 books a year.
