name: Editura Politică
alternate_names:
  - Editura de stat pentru literatură politică
  - Editura Partidului Muncitoresc Român
  - Political Publishing House
country: Romania
city: Bucharest
founded: 1951
dissolved: 1989
status: defunct
affiliation: Publishing house of the Romanian Communist Party
languages:
  - Romanian
identifiers:
  wikidata: "Q12733422"
description: >-
  The party publishing house of Romania, which began as the State Publishing House for
  Political Literature and published the Romanian editions of Marx, Engels and Lenin,
  the documents of the Romanian Communist Party and the speeches of its leaders. In 1990
  its staff founded the Humanitas publishing house.
