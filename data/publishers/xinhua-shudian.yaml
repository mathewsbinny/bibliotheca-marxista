description: >-
  The bookstore founded in Yan'an in 1937, which published and distributed the Party's
  literature in the base areas during the war—the works of Mao, Marx, Engels, Lenin and
  Stalin and the rectification documents—before becoming the state book distributor of
  the People's Republic. Only its publications to 1952 are catalogued here; later it
  distributed, rather than published, books.
