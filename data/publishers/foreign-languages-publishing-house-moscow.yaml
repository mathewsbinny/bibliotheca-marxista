name: Foreign Languages Publishing House (Moscow)
alternate_names:
  - Издательство литературы на иностранных языках
  - FLPH Moscow
  - Co-operative Publishing Society of Foreign Workers in the U.S.S.R.
country: Soviet Union
city: Moscow
founded: 1931
dissolved: 1963
status: defunct
successor: progress-publishers
languages: [English, French, German, Spanish, and many others]
identifiers:
  wikidata: "Q113408973"
description: >
  The Soviet state publisher of political, scientific and literary works in
  foreign languages for readers abroad. It was founded on 27 March 1931, taking
  over the publishing work of the Communist International, as the Co-operative
  Publishing Society of Foreign Workers in the USSR, and was renamed the Foreign
  Languages Publishing House on 3 July 1938. On 10 August 1963 it was reorganised,
  together with the Foreign Literature Publishing House, into Progress Publishers
  (humanities) and Mir Publishers (science).
