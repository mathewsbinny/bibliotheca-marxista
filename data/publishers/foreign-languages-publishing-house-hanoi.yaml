name: Foreign Languages Publishing House (Hanoi)
alternate_names:
  - Nhà xuất bản Ngoại văn
  - Éditions en Langues Étrangères
  - FLPH Hanoi
  - Thế Giới Publishers
country: Vietnam
city: Hanoi
founded: 1957
status: active
languages: [English, French, and others]
identifiers:
  wikidata: "Q7799952"
description: >
  Vietnam's official foreign-language publisher, founded in 1957 to introduce
  readers abroad to Vietnam. As the Foreign Languages Publishing House it issued
  the writings of Ho Chi Minh, Vo Nguyen Giap and others, along with accounts of
  the wars of resistance. It was renamed Thế Giới Publishers ("World Publishers")
  in 1992 and remains active, publishing the journal Vietnamese Studies and its
  French edition, Études Vietnamiennes.
name_history:
  - name: Foreign Languages Publishing House
    from: 1957
    to: 1992
    note: Nhà xuất bản Ngoại văn; also Éditions en Langues Étrangères
  - name: Thế Giới Publishers
    from: 1992
