description: >-
  The publications of the Nepalese communist parties descended from the Communist Party
  of Nepal, founded in 1949 — among them the Communist Party of Nepal (Unified
  Marxist–Leninist) and the Unified Communist Party of Nepal (Maoist), which led the
  people's war of 1996–2006. Both have since led governments of Nepal.
