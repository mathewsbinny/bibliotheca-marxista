description: >-
  The Lima publisher of José Carlos Mariátegui's works, continuing the Biblioteca Amauta
  under which he issued Seven Interpretive Essays on Peruvian Reality in 1928. His
  children published his complete works through it in twenty volumes, alongside
  facsimiles of his journal Amauta and the Anuario mariateguiano.
