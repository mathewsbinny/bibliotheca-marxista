name: Lawrence & Wishart
country: United Kingdom
city: London
founded: 1936
status: active
predecessor: martin-lawrence
affiliation: Historically associated with the Communist Party of Great Britain
languages: [English]
website: https://lwbooks.co.uk/
description: >
  Formed in 1936 by the merger of Martin Lawrence, the Communist Party's publisher,
  with Wishart Ltd, the family-owned anti-fascist house founded by Ernest Wishart.
  Its list includes the English-language Marx/Engels Collected Works and the first
  major English selection of Gramsci's Prison Notebooks. It remains active,
  publishing books and journals.
