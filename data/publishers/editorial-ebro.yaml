name: Editorial Ebro
alternate_names:
  - Colección Ebro
  - Ebro
country: France
home_country: Spain
city: Paris
founded: 1967
dissolved: 1977
status: defunct
affiliation: Exile imprint of the Communist Party of Spain
languages:
  - Spanish
description: >
  The Communist Party of Spain's publishing imprint in exile in Paris during the Franco
  dictatorship, also known as the Colección Ebro. Between 1967 and 1977 — the year the
  party was legalised in Spain — it published a series of books on contemporary Spanish
  history — a notable "public relations" effort by the main party of the anti-Francoist
  opposition — including memoirs and writings by Modesto, Cordón, Líster, Hidalgo de
  Cisneros, Dolores Ibárruri (La Pasionaria) and Santiago Carrillo.
sources:
