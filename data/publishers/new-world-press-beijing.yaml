name: New World Press (Beijing)
alternate_names:
  - 新世界出版社
  - New World Press, Peking
country: China
city: Beijing
founded: 1951
status: active
languages: [English, and others]
identifiers:
  wikidata: "Q25103672"
description: >
  A Beijing publisher of books about China — its history, society, culture and
  politics — for readers abroad, and a companion to the Foreign Languages Press.
  It remains active as a national publishing house under the China International
  Communications Group. Most sources give 1951 as its founding year; one account
  dates it to 1966 as a subsidiary of the Foreign Languages Press.
