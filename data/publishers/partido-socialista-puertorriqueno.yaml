description: >-
  The Movimiento Pro Independencia, founded in 1959 by Juan Mari Brás, which adopted
  Marxism–Leninism and in 1971 became the Puerto Rican Socialist Party, the leading Marxist
  force of the independence movement, with the weekly Claridad and a branch among Puerto Ricans
  in the United States. It published its political theses, programmes and pamphlets from San
  Juan and Río Piedras, and dissolved in 1993.
