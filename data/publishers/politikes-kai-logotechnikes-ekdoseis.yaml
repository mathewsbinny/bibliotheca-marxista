name: Politikes kai Logotechnikes Ekdoseis
alternate_names:
  - Πολιτικές και Λογοτεχνικές Εκδόσεις
  - Political and Literary Editions
country: Romania
home_country: Greece
city: Bucharest
founded: 1954
dissolved: 1968
status: defunct
affiliation: Communist Party of Greece (KKE), in exile
languages:
  - Greek
description: >-
  The Bucharest publishing house of the exiled Communist Party of Greece, founded in
  1954 for the Greek political refugees in the Eastern Bloc after the Civil War. It
  published party and Marxist texts, Soviet and Russian literature in Greek and Greek
  left writers, circulating illegally among Greeks in Western Europe and Greece, until
  it ceased in 1968.
sources:
  - title: ERoL — The Marxist-Leninist publishing field during the 60s–70s in Greece
    url: https://www.marxists.org/history/erol/greece/mais.pdf
