  - Arabic
identifiers:
  wikidata: "Q3376100"
description: >-
  The Tunisian Socialist Study and Action Group, founded in Paris in 1963 by Tunisian
  students and known by its journal Perspectives tunisiennes, which moved from socialism
  to Marxism-Leninism, was repressed by the Bourguiba government in the trials of 1968,
  and became the El Amel Ettounsi organisation.
