description: >-
  The publishing house of the British Socialist Workers Party, which grew out of the
  International Socialists' bookshop (I.S. Books from 1971, Bookmarks from 1973–74) and
  has published books since 1979, including the works of Tony Cliff, Chris Harman and
  Paul Foot. Its bookshop, now in Bloomsbury, is Britain's largest socialist bookshop.
