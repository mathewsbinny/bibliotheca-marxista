description: >
  The Social Democrats' cooperative printing and publishing house in Leipzig,
  active from 1872 to 1881, which printed the party paper Vorwärts. It published
  Wilhelm Liebknecht's Wissen ist Macht — Macht ist Wissen (1873), and Engels's
  polemic against Eugen Dühring, serialised in Vorwärts from 1877, which the
  cooperative issued in book form in 1878 as Herrn Eugen Dühring's Umwälzung der
  Wissenschaft — Anti-Dühring. It closed in 1881, three years into the
  Anti-Socialist Law.
