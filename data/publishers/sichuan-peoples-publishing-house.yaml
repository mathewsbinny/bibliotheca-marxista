name: Sichuan People's Publishing House
alternate_names:
  - Sichuan ren min chu ban she
  - 四川人民出版社
country: China
city: Chengdu
founded: 1953
status: active
estimated:
  - founded
affiliation: Publishing house of the Communist Party committee of Sichuan
languages:
  - Chinese
description: >-
  The People's Publishing House of Sichuan, the provincial party press, which publishes the
  local editions of the works of Mao, Marx and Lenin, the documents of the Party and the
  provincial government, political education literature and local history. Only its output to
  1990 is catalogued here.
