description: >-
  A Paris publishing house and bookshop of the revolutionary syndicalist and communist
  left, founded during the First World War and run by Marcel Hasfeld, which published
  Lenin, Trotsky, Zinoviev and the Russian revolution's documents, Nguyễn Ái Quốc's Le
  Procès de la colonisation française (1925), and the La Vie ouvrière circle around
  Pierre Monatte.
