description: >-
  The Marxist–Leninist guerrilla organisation founded in 1971 on the ideas of Bijan
  Jazani, which split after the 1979 revolution into the Majority and Minority factions;
  their publications, mostly from exile in Germany, France and Sweden, include Jazani's
  writings and documents of the repression of the 1980s.
