description: >-
  The publishing house founded in 1934 by the socialist Kristinn E. Andrésson, which
  published Halldór Laxness and other left-wing writers; from 1937 it was owned by Mál
  og menning, whose imprint it remained until Mál og menning merged into Edda in 2000.
