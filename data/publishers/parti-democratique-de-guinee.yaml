name: Parti démocratique de Guinée
alternate_names:
  - PDG
  - Democratic Party of Guinea
country: Guinea
city: Conakry
founded: 1947
dissolved: 1984
status: defunct
languages:
  - French
description: >-
  The ruling party of Ahmed Sékou Touré's Guinea, the only state of French Africa to
  vote for independence in 1958, which declared itself socialist and Marxist in the
  1960s and 70s. Its imprint published Touré's multi-volume works and the party's
  election and policy documents.
sources:
  - title: Wikipedia — Democratic Party of Guinea – African Democratic Rally
    url: https://en.wikipedia.org/wiki/Democratic_Party_of_Guinea_%E2%80%93_African_Democratic_Rally
