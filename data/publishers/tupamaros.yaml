description: >-
  The National Liberation Movement–Tupamaros, the Marxist urban guerrilla organisation
  founded in Uruguay in the early 1960s around Raúl Sendic, which was crushed under the
  dictatorship of 1973–1985 and re-emerged as a legal party in the Broad Front. Its
  propaganda department published its documents, analyses and electoral pamphlets. Only
  its output to 1995 is catalogued here.
