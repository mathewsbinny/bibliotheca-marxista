description: >-
  Founded in Cologne in 1967 by Gisela Erler and Herbert Röttgen of the Socialist German
  Student Union (SDS), and in Munich from 1968, where its edition of Che Guevara's
  Bolivian Diary made it widely known. Named for the three continents of the
  anti-colonial struggle, it was one of the best-known publishers of the West German
  protest and alternative movements. Only its output to 1990 is catalogued here.
