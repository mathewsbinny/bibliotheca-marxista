name: Ediciones Pueblos Unidos
alternate_names:
  - EPU
country: Uruguay
city: Montevideo
founded: 1942
dissolved: 1990
status: defunct
affiliation: Publishing house of the Communist Party of Uruguay
languages: [Spanish]
identifiers:
  wikidata: "Q60429258"
description: >
  The Communist Party of Uruguay's publishing house, active from 1942 to 1990. It
  was set up by the Italian Ettore Quaglierini, a Comintern official charged with
  organising Spanish-language publishing of Soviet political and philosophical
  literature in Spain and Uruguay. It published more than 100 works — at first
  mainly Soviet works in Spanish translation, such as the Marxist Philosophical
  Dictionary (1946), and texts by Marx.
sources:
