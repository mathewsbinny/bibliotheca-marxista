description: >
  Founded by François Maspero in 1959, during the Algerian War, and the leading
  French publisher of the anti-colonial and non-communist left: Third World
  revolutionaries, Marxist theory and books the French state wanted banned.
  Between June 1959 and May 1982 it published some 1,350 titles, 30 collections
  and a dozen journals. In 1982 Maspero handed the house to François Gèze for a
  symbolic franc, asking him to change its name; it became Éditions La Découverte
  in 1983 and continues its collections.
