name: Militärverlag der DDR
alternate_names:
  - Deutscher Militärverlag
  - Verlag des Ministeriums für Nationale Verteidigung
country: East Germany
city: Berlin
founded: 1956
dissolved: 1990
status: defunct
affiliation: Publishing house of the Ministry of National Defence of the GDR
languages:
  - German
description: >-
  The military publishing house of the GDR, founded in 1956 as the publishing house of
  the Ministry of National Defence, called Deutscher Militärverlag from 1961 and
  Militärverlag der DDR from 1972. It published the political education literature of
  the National People's Army, military history and theory, and war memoirs and fiction.
