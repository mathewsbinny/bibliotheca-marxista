name: Bogle-L'Ouverture Publications
alternate_names:
  - Bogle-L'Ouverture Press
country: United Kingdom
city: London
founded: 1969
status: active
languages: [English]
description: >
  A Black radical publishing house founded in London in 1969 by the Guyanese
  activists Jessica and Eric Huntley, and named after Paul Bogle and Toussaint
  Louverture. It published Walter Rodney's The Groundings with My Brothers (1969)
  and, jointly with Tanzania Publishing House, How Europe Underdeveloped Africa
  (1972), along with poetry and fiction by Linton Kwesi Johnson, Beryl Gilroy,
  Valerie Bloom and others. Its Walter Rodney Bookshop in West Ealing (opened 1974)
  closed in 1990, but the house continued as Bogle-L'Ouverture Press from the
  Huntleys' home. Its archives are held at the London Metropolitan Archives.
