name: Marx-Engels-Verlag
alternate_names:
  - Marx-Engels-Archiv Verlagsgesellschaft
  - Marx-Engels-Gesamtausgabe (MEGA)
country: Germany
city: Berlin
founded: 1927
dissolved: 1935
status: defunct
affiliation: Publisher of the first Marx-Engels-Gesamtausgabe (MEGA) for the Marx-Engels Institute, Moscow
languages: [German]
description: >
  The German publishing arm of the first historical-critical edition of Marx and
  Engels, the Marx-Engels-Gesamtausgabe (MEGA), prepared by David Ryazanov and the
  Marx-Engels Institute in Moscow. The first volume appeared in 1927 under the
  Marx-Engels-Archiv Verlagsgesellschaft in Frankfurt am Main; later volumes came
  from the Marx-Engels-Verlag in Berlin, including the first full editions of The
  German Ideology and the Economic and Philosophic Manuscripts of 1844 in 1932.
  The Marx-Engels-Verlag ran from 1927 to 1935. Ryazanov was removed in 1931, the
  Nazi seizure of power and Stalin's purges ended the project, and only twelve
  volumes had appeared when it was abandoned in 1941.
name_history:
  - name: Marx-Engels-Archiv Verlagsgesellschaft, Frankfurt am Main
    from: 1927
  - name: Marx-Engels-Verlag, Berlin
    to: 1935
    note: The edition itself continued in Moscow until it was abandoned in 1941
