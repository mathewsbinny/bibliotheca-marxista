name: LeftWord Books
alternate_names:
  - Naya Rasta Publishers
country: India
city: New Delhi
founded: 1999
status: active
affiliation: Founded by CPI(M) members Prakash Karat, Sitaram Yechury and Sukomal Sen
languages: [English, Hindi]
website: https://leftword.com/
description: >
  A Marxist publishing house in New Delhi, founded in 1999 as the publishing
  division of Naya Rasta Publishers Private Limited. It publishes new work on
  politics, history and culture alongside Indian editions of socialist classics,
  and since 1 May 2012 has run the May Day Bookstore and Café. It remains active.
