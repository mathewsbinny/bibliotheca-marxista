name: Zrínyi Katonai Kiadó
alternate_names:
  - Zrínyi Kiadó
  - Zrínyi
country: Hungary
city: Budapest
founded: 1957
status: active
estimated:
  - founded
affiliation: Publishing house of the Hungarian People's Army
languages:
  - Hungarian
description: >-
  The military publishing house of the Hungarian People's Republic, named after the poet
  and general Miklós Zrínyi, which published the army's political education literature,
  military history and theory, and memoirs and fiction about the Second World War. Only
  its output to 1990 is catalogued here.
