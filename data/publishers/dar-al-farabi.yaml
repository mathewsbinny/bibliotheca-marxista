name: Dar al-Farabi
alternate_names:
  - دار الفارابي
  - Dār al-Fārābī
country: Lebanon
city: Beirut
founded: 1956
status: active
affiliation: Lebanese Communist Party
languages:
  - Arabic
description: >-
  A Beirut publisher of the Arab communist left, whose list includes Arabic translations
  of Marx and Lenin and the histories and writings of the Lebanese Communist Party and
  its leaders, such as the selected writings of Farajallah el-Helou (1974). It remains
  active as a general publisher of literature and social thought.
sources:
