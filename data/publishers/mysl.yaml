description: >-
  The Moscow publishing house of philosophy, political economy, history and geography,
  formed in 1963 from the State Publishing House of Social and Economic Literature
  (Sotsekgiz). It published Soviet Marxist philosophy, including the Philosophical
  Heritage series, as well as atlases and works of geography.
