name: Synchroni Epochi
alternate_names:
  - Σύγχρονη Εποχή
  - Sygchronē Epochē
  - Syghroni Epoxh
country: Greece
city: Athens
founded: 1972
status: active
affiliation: Founded by decision of the Central Committee of the Communist Party of Greece (KKE)
languages: [Greek]
website: https://sep.gr/
description: >
  The Communist Party of Greece's publishing house, founded in 1972 by decision of
  the party's Central Committee, underground, under the military dictatorship of
  21 April. It was created to publish and distribute the works of Marx, Engels and
  Lenin, and has since published almost 2,000 titles in philosophy, economics,
  sociology, science, Greek and foreign literature and children's books. It
  remains active.
sources:
  - title: Synchroni Epochi — company profile
    url: https://sep.gr/sep-profile/
