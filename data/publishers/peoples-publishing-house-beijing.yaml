description: >
  The Chinese Communist Party's principal publisher of political and theoretical
  works. It was first established on 1 September 1921 by Li Da to spread communist
  texts, and re-established in Beijing on 1 December 1950 as the first official
  publishing house of the People's Republic. It publishes Chinese translations of
  Marx, Engels and Lenin, the works of the Party's leaders — including Quotations
  from Chairman Mao Tse-tung — and philosophy and social science, and remains
  active. This catalogue covers its imprints to 1990.
