description: >-
  The imprint of Remarques congolaises (from 1965 Remarques africaines), the Brussels
  anticolonial weekly edited by Jacques Ceulemans, which supported Patrice Lumumba and the
  Congolese independence movement. It published Jules Chomé's accounts of the Congo crisis and
  of Lumumba's murder, Thomas Kanza's Congo 196?, Mabika Kalanda's La remise en question (1967),
  a founding text of Congolese "mental decolonisation", and works by Burundian and other African
  writers.
