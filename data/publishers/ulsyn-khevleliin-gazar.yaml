name: Ulsyn Khėvlėliĭn Gazar (State Publishing House)
alternate_names:
  - Улсын Хэвлэлийн Газар
  - State Publishing House of Mongolia
  - Ulsyn Khevleliin Gazar
country: Mongolia
city: Ulaanbaatar
founded: 1921
dissolved: 1990
status: defunct
languages:
  - Mongolian
  - English
  - Russian
description: >-
  The State Publishing House of the Mongolian People's Republic, through which, guided
  and financed by the Soviet Union, the state published Mongolia's literature, history
  and political writing from the 1921 revolution until it was disbanded, along with the
  censorship office, after the democratic revolution of 1990.
sources:
  - title: Wikipedia — Ulsyn Khevleliin Gazar
    url: https://en.wikipedia.org/wiki/Ulsyn_Khevleliin_Gazar
