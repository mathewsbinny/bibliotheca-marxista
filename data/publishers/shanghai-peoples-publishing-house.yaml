description: >
  One of China's provincial-level people's publishing houses, the regional
  counterparts of the People's Publishing House in Beijing. It was established in
  March 1951 as the East China People's Publishing House and renamed Shanghai
  People's Publishing House in January 1955, when the East China Region was
  dissolved. It remains active. This catalogue covers its imprints to 1990.
