description: >
  An imprint for critical theory, cultural criticism and left politics, founded
  in 2009 by Tariq Goddard and Mark Fisher within John Hunt Publishing, with the
  aim to "publish books that make our readers uncomfortable"; its early list
  included Fisher's Capitalist Realism. Goddard and Fisher left in 2014 to found
  Repeater Books. In October 2021 Watkins Media, Repeater's owner, bought John Hunt
  Publishing, reuniting Zer0 with its founders' circle, and in June 2023 John Hunt
  Publishing was renamed Collective Ink. Zer0 remains its largest imprint.
