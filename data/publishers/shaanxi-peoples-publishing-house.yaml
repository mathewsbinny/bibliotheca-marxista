name: Shaanxi People's Publishing House
alternate_names:
  - Shaanxi ren min chu ban she
  - 陕西人民出版社
country: China
city: Xi'an
founded: 1952
status: active
estimated:
  - founded
affiliation: Publishing house of the Communist Party committee of Shaanxi
languages:
  - Chinese
description: >-
  The People's Publishing House of Shaanxi, the provincial party press, which publishes the
  local editions of the works of Mao, Marx and Lenin, the documents of the Party and the
  provincial government, political education literature and local history. Only its output to
  1990 is catalogued here.
