description: >-
  The communist cultural monthly founded in New York in 1948 from the merger of New Masses and
  Mainstream, edited by Samuel Sillen and Charles Humboldt, whose book imprint published W. E.
  B. Du Bois, Howard Fast, Herbert Aptheker and Paul Robeson in the McCarthy years; from 1956 it
  continued as Mainstream until 1963.
