description: >-
  The St Petersburg publishing partnership led from 1900 by Maxim Gorky and Konstantin
  Pyatnitsky, which published the realist and radical writers of the years before and
  after the 1905 revolution—Gorky, Andreyev, Bunin, Kuprin, Serafimovich—and
  social-democratic pamphlets, and passed part of its income to the Bolsheviks.
