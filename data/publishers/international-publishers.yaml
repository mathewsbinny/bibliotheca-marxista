name: International Publishers
country: United States
city: New York
founded: 1924
status: active
affiliation: Founded by A. A. Heller and Alexander Trachtenberg; closely associated with the Communist Party USA
languages: [English]
website: https://intpubnyc.com/
description: >
  A New York house founded in 1924 that became the principal American publisher
  of Marxist classics — including the "Little Lenin Library" and "Little Marx
  Library" series — as well as labour history and African American history. It
  worked alongside the Communist Party's pamphlet imprints: Daily Worker Publishing
  Co. (1924–1927), Workers Library Publishers (1927–1945), New Century Publishers
  (1945–1963) and New Outlook Publishers (from 1963). It remains active.
