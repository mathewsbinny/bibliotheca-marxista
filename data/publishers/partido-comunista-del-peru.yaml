name: Partido Comunista del Perú
alternate_names:
  - PCP
  - Communist Party of Peru
country: Peru
city: Lima
founded: 1964
dissolved: 1986
status: defunct
estimated:
  - dissolved
affiliation: Maoist Communist Party of Peru
languages:
  - Spanish
description: >-
  The Maoist Communist Party of Peru that emerged from the Sino-Soviet split in 1964,
  whose factions included Bandera Roja, Patria Roja and the Shining Path of Abimael
  Guzmán, which launched its armed struggle in 1980. Its documents on revolutionary
  strategy and the united front were issued clandestinely in Lima.
sources:
