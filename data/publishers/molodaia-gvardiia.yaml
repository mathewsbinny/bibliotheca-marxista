name: Molodaia gvardiia
alternate_names:
  - Molodaya Gvardiya
  - Молодая гвардия
  - Mol. gvardiia
country: Soviet Union
city: Moscow
founded: 1922
status: active
affiliation: Komsomol (All-Union Leninist Young Communist League)
languages: [Russian]
description: >
  "Young Guard", founded in Moscow on 10 October 1922 on the initiative of the
  Central Committee of the Komsomol. It published fiction for young readers,
  including its Library of Contemporary Fiction, Komsomol literature, and the
  long-running biography series The Lives of Remarkable People (ZhZL). Its output
  fell sharply after 1991 and revived in the 2000s. Only its output to 1991 is
  catalogued here.
sources:
