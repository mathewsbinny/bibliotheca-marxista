name: Buchhandlung Vorwärts
alternate_names:
  - Verlag der Expedition des Vorwärts
  - Expedition der Buchhandlung Vorwärts
  - Buchhandlung Vorwärts (Hans Weber)
  - Buchhandlung Vorwärts Paul Singer GmbH
country: Germany
city: Berlin
founded: 1891
dissolved: 1933
status: defunct
affiliation: Official publishing house of the Social Democratic Party of Germany (SPD)
languages: [German]
description: >
  The book-publishing side of Vorwärts, the SPD's central newspaper, which began
  on 1 January 1891. As the party's official publishing house, based at
  Lindenstraße 3 in Berlin-Kreuzberg, it published party congress proceedings,
  election handbooks and pamphlets by August Bebel and others, and in 1909 Karl
  Kautsky's The Road to Power, which the party executive tried to suppress. The
  newspaper appeared until 15 March 1933; when the Nazis banned the SPD and seized
  its property that spring, the whole Vorwärts publishing operation went with it.
  The Vorwärts revived by the SPD after 1945 is a newspaper, not a continuation of
  this publishing house.
