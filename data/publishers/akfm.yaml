description: >-
  The publications of the Congress Party for the Independence of Madagascar, a
  pro-Soviet Marxist party founded on 8 November 1958 under Richard Andriamanjato, with
  Gisèle Rabesahala as general secretary from 1960 to 1990. It belonged to the ruling
  front of Didier Ratsiraka's socialist Democratic Republic of Madagascar (1975–1992).
