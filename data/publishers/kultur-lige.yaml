name: Kultur-Lige
alternate_names:
  - Kooperativer farlag Kultur-Lige
  - Ḳulṭur-lige
country: Poland
city: Warsaw
founded: 1918
dissolved: 1939
status: defunct
affiliation: Yiddish cultural league of the socialist parties
languages:
  - Yiddish
description: >-
  The Yiddish cultural league founded in Kyiv in 1918 by the Jewish socialist parties,
  which moved to Warsaw in 1921 and there became the main publisher of left-wing Yiddish
  literature, socialist pamphlets and translations between the wars.
