name: Verlag für Literatur und Politik
alternate_names:
  - VLP
  - Litpol
country: Austria
city: Vienna
founded: 1924
dissolved: 1934
status: defunct
affiliation: Communist International; Communist Party of Germany (KPD)
languages: [German]
description: >
  A Comintern publishing house registered in Vienna on 6 August 1924, with a branch
  in Berlin. Nominally owned by the Austrian communist Johannes Wertheim, it worked
  for the KPD, the Communist International and the Moscow Lenin Institute,
  publishing German editions of Lenin, Stalin, Bukharin and Zinoviev, memoirs of
  Lenin by Krupskaya and Clara Zetkin, and some literature. It issued 132 titles
  and three journals before ceasing work at the end of 1933, and was banned on
  30 June 1934.
