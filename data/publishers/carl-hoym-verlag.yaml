name: Carl Hoym Verlag
alternate_names:
  - Hoym-Verlag
  - Verlag Carl Hoym Nachf. Louis Cahnbley
  - Verlag der Kommunistischen Internationale
country: Germany
city: Hamburg
founded: 1920
dissolved: 1933
status: defunct
international: communist-international
affiliation: Publishing house of the Communist International's Western European Bureau
languages: [German]
description: >
  To publish independently of outside firms, the Communist International's
  Western European Bureau bought the Hamburg bookshop of Carl Hoym on 3 February
  1920. Trading as Verlag Carl Hoym Nachf. Louis Cahnbley, it moved its main office
  to Berlin in 1921 and later traded as the Verlag der Kommunistischen Internationale,
  publishing the Comintern's congress proceedings and German editions of the works
  of Lenin and other Bolshevik leaders until the Nazi seizure of power in 1933.
