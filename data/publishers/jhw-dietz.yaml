name: J. H. W. Dietz Verlag
alternate_names:
  - J. H. W. Dietz Nachf.
  - Verlag J. H. W. Dietz
country: Germany
city: Stuttgart
founded: 1881
status: active
affiliation: Publishing house of the Social Democratic Party of Germany (SPD)
languages: [German]
description: >
  Founded in Stuttgart in 1881 by Johann Heinrich Wilhelm Dietz, the principal
  publisher of German Social Democracy. It published Die Neue Zeit, the works of
  Karl Kautsky and August Bebel, and German editions of Marx and Engels. It later moved to
  Berlin, was suppressed by the Nazis in 1933, and was revived after 1945; as
  J. H. W. Dietz Nachf. it is now based in Bonn and remains the SPD-associated
  publisher. The East Berlin Dietz Verlag of the SED is a separate house.
name_history:
  - name: J. H. W. Dietz, Stuttgart
    from: 1881
  - name: J. H. W. Dietz Nachf., Berlin
    to: 1933
  - name: J. H. W. Dietz Nachf., Bonn
    note: Revived after the Second World War
