description: >
  The Berlin publishing house of Franz Duncker (1822–1888), a liberal publisher and
  politician, which issued Karl Marx's Zur Kritik der politischen Oekonomie. Erstes
  Heft (A Contribution to the Critique of Political Economy) in 1859. It was active
  from 1850 to 1878.
