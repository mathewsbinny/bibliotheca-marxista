description: >
  The publishing arm of the Lovestoneites, the American wing of the Right
  Opposition that sided with Nikolai Bukharin against Stalin after Jay Lovestone's
  expulsion from the Communist Party in 1929. Named after the group's weekly,
  Revolutionary Age (1929–1931) and then Workers Age (1932–1941), it issued
  pamphlets by Lovestone, Bertram D. Wolfe and Will Herberg, and ended when the
  organisation, by then the Independent Labor League of America, dissolved in
  January 1941. Its founding year is that of the group; the imprint appears in
  library catalogues from 1933, as the Workers Age Publishing Association and, from 1937, as Workers Age Publishers.
