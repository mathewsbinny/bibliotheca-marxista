name: Ediciones Era
country: Mexico
city: Mexico City
founded: 1960
status: active
affiliation: Independent left
languages:
  - Spanish
description: >-
  The Mexico City publisher founded in 1960 by the Spanish Republican exile family Espresate
  with Vicente Rojo, the leading house of the Mexican left, which published José Revueltas,
  Gramsci, Lukács, Trotsky's Mexican writings, Bolívar Echeverría and the documents of the 1968
  student movement.
