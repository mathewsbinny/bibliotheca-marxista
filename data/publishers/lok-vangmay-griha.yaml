name: Lok Vangmay Griha
alternate_names:
  - Lokvangmay Griha
  - Lokavāṅmaya Gr̥ha
  - House of People's Literature
country: India
city: Bombay
founded: 1961
status: active
affiliation: The People's Publishing House of the Communist Party of India in Maharashtra
languages: [Marathi]
website: https://lokvangmaybooks.in/
identifiers:
  wikidata: "Q125523040"
description: >
  The Marathi publishing house of the Communist Party of India's People's
  Publishing House — its name means "House of People's Literature" — publishing
  and distributing in Bombay since 1961. From Bhupesh Gupta Bhavan it runs its own
  printing press at Prabhadevi, producing 35 to 45 titles a year, and the People's
  Book House at Horniman Circle, which began in 1953 as a book cart selling Soviet
  and Marxist literature. It remains active.
