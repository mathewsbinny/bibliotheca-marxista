name: Foreign Languages Publishing House (Bucharest)
alternate_names:
  - Editura în limbi străine
  - Foreign Languages Publishing House of the Rumanian Institute for Cultural Relations with Foreign Countries
country: Romania
city: Bucharest
founded: 1950
dissolved: 1962
status: defunct
languages: [French, English, German, Russian, Italian, Spanish, Bengali, Tamil, Telugu]
description: >
  Romania's state publisher of foreign-language material, the counterpart of the
  houses in Moscow, Hanoi and Sofia. A 1958–59 chronology from the Romanian
  Academy's literary institute records its books in French, English, German,
  Russian, Italian and Spanish, and even in Bengali, Tamil and Telugu. It
  operated from 1950 to about 1962. It began within the post-1948 system of state
  publishers — the philosopher Mihai Șora worked there before becoming
  editor-in-chief of the main state literary publisher in the late 1950s — and
  ended around 1962, when Romania's foreign-language output was reorganised: the main
  literary publisher was split in 1960, creating Editura Meridiane (art and
  tourism books for foreign readers), and a four-language literary review for
  foreign audiences was run separately from 1962. The closing year is approximate,
  and what became of this house is not recorded; library catalogue records show
  its imprints from 1956 to 1960.
