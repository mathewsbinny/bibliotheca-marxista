name: Deutsch-Französische Jahrbücher
alternate_names:
  - Bureau der Jahrbücher
  - German-French Annals
country: France
home_country: Germany
city: Paris
founded: 1844
dissolved: 1844
status: defunct
languages:
  - German
description: >
  The journal edited in Paris by Arnold Ruge and Karl Marx, published from the "Bureau
  der Jahrbücher". Only one double issue appeared, in February 1844, before
  disagreements between the editors, lack of funds and the confiscation of copies at the
  German border ended it. It carried Marx's On the Jewish Question and his introduction
  to A Contribution to the Critique of Hegel's Philosophy of Right, and Engels's
  Outlines of a Critique of Political Economy — the first meeting in print of Marx and
  Engels.
sources:
