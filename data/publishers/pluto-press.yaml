name: Pluto Press
country: United Kingdom
city: London
founded: 1969
status: active
languages: [English]
website: https://www.plutobooks.com/
description: >
  Founded in London in 1969 by Richard Kuper, out of the radical politics of the
  late 1960s — the movement against the Vietnam War, student radicalism, second-wave
  feminism and militant workers' organisations. An independent radical publisher,
  it helped relaunch the Left Book Club in 2015 and remains active.
