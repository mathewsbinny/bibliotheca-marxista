name: Qinghai People's Publishing House
alternate_names:
  - Qinghai ren min chu ban she
  - 青海人民出版社
country: China
city: Xining
founded: 1955
status: active
estimated:
  - founded
affiliation: Publishing house of the Communist Party committee of Qinghai
languages:
  - Chinese
description: >-
  The People's Publishing House of Qinghai, the provincial party press, which publishes the
  local editions of the works of Mao, Marx and Lenin, the documents of the Party and the
  provincial government, political education literature and local history. Only its output to
  1990 is catalogued here.
