name: Manisha Granthalaya
alternate_names:
  - Manisha Granthalaya Private Ltd
country: India
city: Calcutta
founded: 1964
status: active
languages: [Bengali, English]
description: >
  A Marxist publisher and bookshop on College Street, Calcutta, established in
  1964. Its list included Marxist scholarship in English as well as Bengali — for
  example Debiprasad Chattopadhyaya's Indian Atheism: A Marxist Analysis (1969) —
  and it remains active.
sources:
  - title: EconPapers — review of Indian Atheism (Manisha Granthalaya, 1969)
    url: https://econpapers.repec.org/article/saeindqtr/v_3a26_3ay_3a1970_3ai_3a2_3ap_3a197-198.htm
