name: Editorial Anteo
alternate_names:
  - Anteo
country: Argentina
city: Buenos Aires
founded: 1942
dissolved: 1988
status: defunct
affiliation: Official publisher of the Communist Party of Argentina
languages: [Spanish]
description: >
  Created in 1942 as the official publishing house of the Communist Party of
  Argentina, devoted to theoretical and doctrinal literature. It issued the
  party's programmes, resolutions and congress documents from the 1940s to the
  1970s, alongside Marxist classics in Spanish, and closed in 1988.
sources:
  - title: "Horacio A. López, Las editoriales rojas: de La Internacional a Cartago (review, SciELO)"
    url: https://www.scielo.cl/scielo.php?script=sci_arttext&pid=S0718-50492018000300286
