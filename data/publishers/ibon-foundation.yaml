name: IBON Foundation
alternate_names:
  - IBON
  - IBON Databank
country: Philippines
city: Quezon City
founded: 1978
status: active
languages: [English, Filipino]
website: https://www.ibon.org/
description: >
  A progressive research and publishing organisation founded in 1978, six years
  into Marcos's martial law, by Sr. Soledad Perpiñan, Sally Bulatao and Antonio
  Tujan, a former political detainee. It began with the fact sheet IBON Facts and
  Figures on the country's economic and social conditions, and grew into a
  publisher and distributor of progressive books, textbooks and journals,
  co-publishing internationally with Zed Books and others. It remains active.
sources:
  - title: IBON Foundation — History
    url: https://www.ibon.org/about/history/
  - title: Wikipedia — IBON Foundation
    url: https://en.wikipedia.org/wiki/IBON_Foundation
