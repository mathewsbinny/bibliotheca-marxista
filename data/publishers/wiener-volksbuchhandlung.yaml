name: Wiener Volksbuchhandlung
alternate_names:
  - Wiener Volksbuchhandlung Ignaz Brand
country: Austria
city: Vienna
founded: 1894
dissolved: 1934
status: defunct
affiliation: Publishing house of the Social Democratic Workers' Party of Austria
languages: [German]
description: >
  The publishing house of Austrian Social Democracy, founded in 1894. It
  published the works of Victor Adler, Karl Renner, Otto Bauer and the other
  Austro-Marxists, the party's pamphlets and educational literature, and editions
  of Marx and Engels. It was suppressed with the party in the Austrian Civil War
  of February 1934.
