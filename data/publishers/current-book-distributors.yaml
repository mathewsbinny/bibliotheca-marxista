description: >-
  The Sydney publisher and distributor of the Communist Party of Australia, which issued
  its programmes, congress documents and pamphlets, among them the party programme
  Australia's Path to Socialism, and Australian editions of Soviet and British communist
  writing. Its imprint appears in library catalogues from 1940 to the 1960s.
sources:
