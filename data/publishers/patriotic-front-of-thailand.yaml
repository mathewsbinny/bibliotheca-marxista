name: Patriotic Front of Thailand
alternate_names:
  - Thailand Patriotic Front
  - Office of the Representative Abroad of the Patriotic Front of Thailand
country: China
home_country: Thailand
city: Peking
founded: 1965
status: defunct
affiliation: Communist Party of Thailand
languages:
  - English
description: >-
  The united front of the Communist Party of Thailand, proclaimed on 1 January 1965,
  whose office abroad in Peking published English-language manifestos, anniversary
  statements and reports of the armed struggle that the party began in the northeast of
  Thailand in 1965.
