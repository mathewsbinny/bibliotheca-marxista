description: >
  Founded in Milan in 1954 by Giangiacomo Feltrinelli, who in 1949 had set up
  the Feltrinelli Library for the study of contemporary history and the labour
  movement; the house grew out of Colip, the Cooperativa del Libro Popolare
  (1949–1954). Antifascist from the start, it was a prominent platform for
  Marxism and the international left alongside a broad literary list, and is now
  one of Italy's largest publishers.
