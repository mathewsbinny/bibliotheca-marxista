name: Xinjiang People's Publishing House
alternate_names:
  - Xinjiang ren min chu ban she
  - 新疆人民出版社
country: China
city: Ürümqi
founded: 1960
status: active
estimated:
  - founded
affiliation: Publishing house of the Communist Party committee of Xinjiang
languages:
  - Chinese
description: >-
  The People's Publishing House of Xinjiang, the provincial party press, which publishes the
  local editions of the works of Mao, Marx and Lenin, the documents of the Party and the
  provincial government, political education literature and local history. Only its output to
  1990 is catalogued here.
