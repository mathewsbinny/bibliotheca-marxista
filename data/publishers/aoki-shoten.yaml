description: >-
  A Tokyo publisher founded after the war by Aoki Haruo, specialising in books based on
  Marxism across the humanities and the sciences, and widely known in the 1960s and 70s
  for its Marx and Engels editions. It stopped regular publishing after 2015. Only its
  output to 1991 is catalogued here.
