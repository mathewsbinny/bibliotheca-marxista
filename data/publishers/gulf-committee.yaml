name: Gulf Committee
alternate_names:
  - Gulf Solidarity Committee
country: United Kingdom
home_country: Oman
city: London
founded: 1971
dissolved: 1978
status: defunct
languages:
  - English
description: >-
  A London-based solidarity committee of the 1970s which published the documents and
  case of the Popular Front for the Liberation of Oman (and the Arabian Gulf) during the
  Marxist-led Dhofar rebellion (1965–1976), together with critical studies of the Gulf
  states. It is listed under Oman, the movement it published, although it worked from
  London.
