name: Foundation for Nationalist Studies
alternate_names:
  - Constantino Foundation
country: Philippines
city: Quezon City
founded: 1976
status: active
languages: [English]
website: https://constantinofoundation.org/
description: >
  Founded on 18 October 1976 by the historian Renato Constantino and Letizia Roxas
  Constantino, publishing Constantino's anti-imperialist histories of the
  Philippines — including The Miseducation of the Filipino (1982 edition) — and
  other nationalist and left writing. It is nationalist and anti-imperialist
  rather than a party press. It continues today as the Constantino Foundation.
