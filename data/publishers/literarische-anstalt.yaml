description: >
  The Frankfurt publishing house of Joseph Rütten, active from 1844 to 1859, which in 1845
  published Marx and Engels's first joint book, Die heilige Familie, oder Kritik der kritischen
  Kritik (The Holy Family), their polemic against Bruno Bauer and his circle. It is generally
  identified as the forerunner of the publishing house Rütten & Loening; that succession still
  needs confirming.
