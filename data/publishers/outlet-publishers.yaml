description: >-
  The publisher of Outlet, the newspaper founded in 1968 and edited by Tim Hector as the
  organ of his Antigua Caribbean Liberation Movement, which in its heyday was the most
  widely read paper on the island; its publications include a Marcus Garvey centenary
  special.
