description: >-
  The state book publisher and distributor of the Lao People's Democratic Republic, proclaimed
  in December 1975. It published the speeches and writings of Kaysone Phomvihane, the documents
  of the Lao People's Revolutionary Party's congresses, and works on the building of socialism
  in Laos.
