description: >-
  The foreign committee and press of the General Jewish Labour Bund, the Marxist party of Jewish
  workers founded in Vilna in 1897, which printed its pamphlets, congress reports and the
  classics in Yiddish and Russian in Geneva and London for smuggling into the Russian Empire
  until 1917.
