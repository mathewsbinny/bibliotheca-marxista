name: Kansankulttuuri
alternate_names:
  - Kansankulttuuri Oy
country: Finland
city: Helsinki
founded: 1940
dissolved: 1986
status: defunct
affiliation: Communist Party of Finland (SKP); Finnish People's Democratic League (SKDL)
languages:
  - Finnish
description: >-
  Founded in October 1940 on the initiative of the Finland–Soviet Union Peace and
  Friendship Society, it could not begin work before its board members were arrested in
  1941, and published from late 1944, once the far left was released after the
  armistice. Owned by the Yrjö Sirola Foundation, the SKDL, the SKP and the
  Finland–Soviet Union Society, it published socialist and Marxist non-fiction and
  fiction until its bankruptcy in January 1986.
sources:
  - title: Finnish Wikipedia — Kansankulttuuri (kustantamo)
