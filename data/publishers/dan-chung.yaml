name: Dân chúng
alternate_names:
  - Báo Dân chúng
  - The People
country: Vietnam
city: Saigon
founded: 1938
dissolved: 1939
status: defunct
affiliation: Legal press of the Indochinese Communist Party
languages:
  - Vietnamese
description: >-
  The legal newspaper and press of the Indochinese Communist Party in the Popular Front
  years, published in Saigon from 1938 until the party was driven underground in 1939.
  Its pamphlets include Vấn đề dân cày (The Peasant Question) by Qua Ninh and Văn Dinh —
  Trường Chinh and Võ Nguyên Giáp — a founding text of Vietnamese communism.
sources:
  - title: Bibliothèque nationale de France — catalogue records
    url: https://catalogue.bnf.fr/rechercher.do?motRecherche=%22D%C3%A2n%20ch%C3%BAng%22
