name: Robotnik
alternate_names:
  - Spółka Nakładowo-Wydawnicza Robotnik
  - Grupa Polityczna Robotnik
country: Poland
city: Warsaw
founded: 1894
dissolved: 1939
status: defunct
affiliation: Publishing house of the Polish Socialist Party (PPS)
languages:
  - Polish
description: >-
  The imprint of Robotnik ("The Worker"), the central organ of the Polish Socialist Party,
  founded in 1894 and printed underground and in exile (in London) under Tsarist rule, then
  legally in Warsaw between the wars, which published the party's pamphlets and socialist
  literature.
sources:
