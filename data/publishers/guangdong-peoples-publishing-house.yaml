name: Guangdong People's Publishing House
alternate_names:
  - Guangdong ren min chu ban she
  - 广东人民出版社
country: China
city: Guangzhou
founded: 1955
status: active
estimated:
  - founded
affiliation: Publishing house of the Communist Party committee of Guangdong
languages:
  - Chinese
description: >-
  The People's Publishing House of Guangdong, the provincial party press, which publishes the
  local editions of the works of Mao, Marx and Lenin, the documents of the Party and the
  provincial government, political education literature and local history. Only its output to
  1990 is catalogued here.
