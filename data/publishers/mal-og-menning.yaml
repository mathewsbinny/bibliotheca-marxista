description: >-
  Founded on 17 June 1937 by a group of radical writers led by Kristinn E. Andrésson —
  among them Halldór Laxness and Jóhannes úr Kötlum of the Society of Revolutionary
  Writers — combining their book club with the Heimskringla press. Andrésson, a
  Socialist Unity Party member of parliament, led it until 1971. It became a leading
  general publisher and is now part of Forlagið; only its output to 1990 is catalogued
  here.
