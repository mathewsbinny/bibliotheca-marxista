name: Wydawnictwo Ministerstwa Obrony Narodowej
alternate_names:
  - Wydawnictwo MON
  - Ministry of National Defence Publishing House
country: Poland
city: Warsaw
founded: 1947
dissolved: 1990
status: defunct
affiliation: Publishing house of the Polish Ministry of National Defence
languages:
  - Polish
description: >-
  The military publishing house of the Polish People's Republic, which published the
  political education literature of the Polish People's Army, military history, memoirs
  of the Second World War and war fiction. It became the Bellona publishing house in
  1990.
