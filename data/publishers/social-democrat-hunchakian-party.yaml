description: >-
  The first Marxist party of the Armenians, founded in Geneva in 1887 by students from the
  Russian Empire, which published its paper Hnchak (The Bell) and its programmes in Geneva,
  London, Paris and later Istanbul; after the Sovietisation of Armenia its diaspora branches,
  centred in Beirut, supported Soviet Armenia.
