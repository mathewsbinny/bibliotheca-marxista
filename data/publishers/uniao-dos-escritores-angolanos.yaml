name: União dos Escritores Angolanos
alternate_names:
  - Union of Angolan Writers
  - UEA
country: Angola
city: Luanda
founded: 1975
status: active
languages:
  - Portuguese
description: >-
  The Union of Angolan Writers, proclaimed in Luanda on 10 December 1975 in a session
  addressed by President Agostinho Neto, a founding member, with Luandino Vieira as its
  first secretary-general. In the years of the MPLA's People's Republic its editions put
  Angolan literature into print in large numbers. Only its output to 1992 is catalogued
  here.
sources:
  - title: Portuguese Wikipedia — União dos Escritores Angolanos
    url: https://pt.wikipedia.org/wiki/Uni%C3%A3o_dos_Escritores_Angolanos
