name: Mir Publishers
alternate_names:
  - Издательство «Мир»
  - Mir
country: Soviet Union
city: Moscow
founded: 1964
dissolved: 2012
status: defunct
predecessor: foreign-languages-publishing-house-moscow
languages: [Russian, English, French, German, Spanish, Arabic, and others]
description: >
  Formed from the science and technology departments of the Foreign Languages
  Publishing House and the Foreign Literature Publishing House in the Soviet
  reorganisation of 1963–64. Mir translated foreign scientific works into Russian
  and published Soviet textbooks and popular science in English, French, Spanish,
  Arabic and other languages, as well as science fiction. It absorbed several other
  publishers in 2000, went through bankruptcy proceedings from 2006, and was
  liquidated in 2012.
