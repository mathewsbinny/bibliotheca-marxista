description: >-
  The party's own imprint, used from its founding in 1920 until its dissolution in 1991
  for programmes such as The British Road to Socialism, congress documents, pamphlets
  and early British editions of Lenin, Stalin and Bukharin. Its books were also
  published through Martin Lawrence and later Lawrence & Wishart.
