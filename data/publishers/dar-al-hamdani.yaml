description: >-
  A printing and publishing house of Aden in the People's Democratic Republic of Yemen
  (1967–1990), the Arab world's only Marxist state, which printed publications of its
  mass organisations such as the General Federation of Yemeni Women, and Yemeni
  literature and scholarship in the 1980s.
