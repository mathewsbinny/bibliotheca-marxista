description: >-
  The Communist Party USA's pamphlet house, created in 1927 when the party renamed its
  Daily Worker Publishing Company. It issued propaganda pamphlets and the party's
  official magazines, including works by Earl Browder, William Z. Foster and Harry
  Haywood, while International Publishers handled its books. It was succeeded by New
  Century Publishers in 1945.
