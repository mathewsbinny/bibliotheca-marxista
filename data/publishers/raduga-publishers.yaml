name: Raduga Publishers
alternate_names:
  - Издательство «Радуга»
  - Raduga
country: Soviet Union
city: Moscow
founded: 1982
status: active
predecessor: progress-publishers
languages: [English, Hindi, and many others]
description: >
  Moscow publisher of Russian and Soviet fiction, poetry and children's books in
  translation, created in 1982 when Progress Publishers' literature list was split
  off as an independent house (English Wikipedia dates the Raduga imprint to 1973).
  Its series included Russian Classics and Adventure & Fantasy, and many of its
  books were exported to India and neighbouring countries. The company survived
  the end of the Soviet Union, though by the 2020s its business had moved away
  from books.
