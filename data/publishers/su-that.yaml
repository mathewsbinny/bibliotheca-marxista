name: Sự Thật Publishing House
alternate_names:
  - Nhà xuất bản Sự thật
  - Sự thật
  - Truth Publishing House
country: Vietnam
city: Hanoi
founded: 1945
dissolved: 1992
status: defunct
affiliation: Communist Party of Vietnam
languages:
  - Vietnamese
description: >-
  "Truth", the political publishing house of the Vietnamese communist party, founded on
  5 December 1945 under the direction of General Secretary Trường Chinh. It published
  the works of Marx, Engels and Lenin in Vietnamese, the writings of Hồ Chí Minh, Trường
  Chinh, Lê Duẩn and other leaders, and party documents. In 1992 it was merged with
  three other houses into the National Political Publishing House (now Chính trị quốc
  gia Sự thật).
sources:
  - title: Vietnamese Wikipedia — Nhà xuất bản Chính trị quốc gia Sự thật
