description: >
  Founded in March 1926 with a $100,000 grant from the Garland Fund to publish
  inexpensive editions of radical, socialist and labour literature, including a
  series of studies of Soviet Russia. The Fund later turned the press over to its
  publisher, James Henle, and it became a general trade house whose list included
  James T. Farrell's Studs Lonigan trilogy and the first books of Nelson Algren,
  Saul Bellow and Dr. Seuss. With a backlist of some 500 titles, it was sold to
  Random House in October 1988.
