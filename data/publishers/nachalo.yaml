identifiers:
  wikidata: "Q4315156"
description: >-
  The publishing imprint of Nachalo ("The Beginning"), first the legal Marxist monthly of 1899,
  edited by Pyotr Struve and Mikhail Tugan-Baranovsky, in which Lenin and Plekhanov wrote, and
  then the Menshevik daily of the 1905 revolution, whose book imprint published
  social-democratic pamphlets.
