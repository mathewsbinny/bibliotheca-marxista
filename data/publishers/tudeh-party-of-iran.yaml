description: >-
  The communist party of Iran, founded in 1941 and banned in 1949, which worked in exile
  and briefly openly after the 1979 revolution until its suppression in 1983. Its own
  Persian-language imprint, published in Tehran and in exile in Berlin, covers the works
  of party intellectuals such as Ehsan Tabari and the poet Siavash Kasraei; its
  Stockholm publishing centre is listed separately.
