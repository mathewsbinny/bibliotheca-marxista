name: Kyōseikaku
alternate_names:
  - 共生閣
country: Japan
city: Tokyo
founded: 1926
dissolved: 1940
status: defunct
languages:
  - Japanese
description: >-
  One of the major left-wing publishers of pre-war Japan, publishing Marxist theory in
  translation, including Plekhanov and Soviet textbooks, and Japanese Marxist economic
  history such as Ichikawa Shōichi's history of Japanese finance capital, in the late
  1920s and early 1930s.
sources:
