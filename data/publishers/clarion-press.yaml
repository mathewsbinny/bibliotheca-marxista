name: Clarion Press
alternate_names:
  - Clarion Newspaper Company
  - The "Clarion" Newspaper Company
country: United Kingdom
city: London
founded: 1891
dissolved: 1934
status: defunct
affiliation: Publisher of the socialist weekly The Clarion
languages:
  - English
description: >-
  The publishing company of The Clarion, the socialist weekly founded in Manchester in
  1891 by Robert Blatchford, which moved to London and published Blatchford's Merrie
  England, a best seller of British socialism, and the pamphlets and books of the
  Clarion movement until the paper closed in 1934.
