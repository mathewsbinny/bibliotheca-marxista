name: National Book Agency
alternate_names:
  - NBA
  - National Book Agency Private Limited
country: India
city: Calcutta
founded: 1939
status: active
affiliation: Publishing arm of the Communist Party of India (Marxist)
languages: [Bengali, English, Hindi, Urdu]
website: https://www.nationalbookagency.com/
identifiers:
  wikidata: "Q3348064"
description: >
  Founded in Calcutta on 26 June 1939 by Muzaffar Ahmad, one of the founders of
  the Communist Party of India, to publish Marxist and progressive literature in
  Bengali, English, Hindi and Urdu. It is now the publishing arm of the Communist
  Party of India (Marxist), and remains active as the "House of Marxist and
  Progressive Literature".
