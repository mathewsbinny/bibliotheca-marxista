name: Ōtsuki Shoten
alternate_names:
  - 大月書店
  - Otsuki Shoten
country: Japan
city: Tokyo
founded: 1946
status: active
languages:
  - Japanese
description: >-
  A Tokyo publisher founded in November 1946, which became the principal Japanese
  publisher of Marx and Engels: a 23-volume Selected Works (1949–1952) and, from 1959,
  the 49-volume Collected Works (Marukusu-Engerusu zenshū), completed over 32 years.
  Only its output to 1991 is catalogued here.
