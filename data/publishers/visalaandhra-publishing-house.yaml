description: >
  The Telugu publishing house of the Communist Party of India, founded in 1952 and
  sharing its name with Visalaandhra, the party's Telugu newspaper. Based at
  Vignana Bhavan, Hyderabad, it publishes Telugu books and remains active. Its
  counterpart for the Communist Party of India (Marxist) is Prajasakti Book House.
