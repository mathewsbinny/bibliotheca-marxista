description: >
  The publishing body of Hardial Bains's Communist Party of Canada (Marxist–Leninist),
  founded in 1970. Its books and pamphlets, usually printed at People's Canada
  Publishing House and distributed by the National Publications Centre, include Bains's
  own writings and, after the party sided with Albania against China in 1976–77, North
  American editions of the works of Enver Hoxha. Its founding and closing dates are not
  documented; its imprint appears in library catalogues from the mid-1970s to about
  1980.
