  - Ministry of Foreign Affairs of Democratic Kampuchea
country: Cambodia
city: Phnom Penh
founded: 1976
dissolved: 1986
status: defunct
estimated:
  - dissolved
languages:
  - English
  - French
  - Khmer
description: >-
  The publications of Democratic Kampuchea, the Khmer Rouge state of 1975–1979 under
  which some 1.5 to 2 million Cambodians died, and of its government in exile, which as
  part of the Coalition Government of Democratic Kampuchea kept Cambodia's seat at the
  United Nations until 1993. Its foreign ministry issued propaganda against Vietnam's
  occupation of the country.
