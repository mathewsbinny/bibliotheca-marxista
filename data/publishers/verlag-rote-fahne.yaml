description: >-
  The publishing house of the Maoist KPD/AO, founded in West Berlin in February 1970 out
  of the student movement and called simply KPD from 1971, named after its paper Rote
  Fahne. Based in Dortmund from 1972 and Cologne from 1975, it published the party's
  programmes and campaigns until the party dissolved itself in March 1980.
