name: Molot
alternate_names:
  - Knigoizdatelʹstvo Molot
  - Книгоиздательство «Молот»
country: Soviet Union
city: St Petersburg
founded: 1905
dissolved: 1907
status: defunct
affiliation: Social-democratic publishing house of the 1905 revolution
languages:
  - Russian
description: >-
  A St Petersburg publishing house of the 1905 revolution that issued social-democratic
  and Bolshevik literature legally in the brief freedom of the press: pamphlets by
  Lenin, Kautsky and Bebel and translations of Marx, until it was closed in the reaction
  of 1907.
