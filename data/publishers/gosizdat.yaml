  - State Publishing House of the RSFSR
  - Госиздат
country: Soviet Union
city: Moscow
founded: 1919
dissolved: 1930
status: defunct
affiliation: State Publishing House of the RSFSR
languages:
  - Russian
identifiers:
  wikidata: "Q4146356"
description: >-
  The State Publishing House of the Russian Soviet Republic, founded in 1919, which in
  the 1920s was the main Soviet publisher of the works of Marx, Engels and Lenin, of
  party and Comintern literature, and of schoolbooks and fiction, with branches in
  Petrograd (Leningrad). In 1930 it was merged into OGIZ, the association of state
  publishers.
