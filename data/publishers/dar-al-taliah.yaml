name: Dar al-Tali'a
alternate_names:
  - Dār al-Ṭalīʻah
  - دار الطليعة
country: Lebanon
city: Beirut
founded: 1959
status: active
languages:
  - Arabic
description: >-
  A Beirut publishing house founded around 1959–60 by Bashir al-Daouk, a professor at
  the American University of Beirut, which translated Marx, Mao, Trotsky and Hegel into
  Arabic and became a hub of the Arab New Left; Naji Aloush, its head in the 1960s, was
  a Palestinian socialist. It published Sadiq Jalal al-Azm's Critique of Religious
  Thought.
sources:
  - title: Al Jadid — Bashir al-Daouk (1931–2007)
    url: https://aljadid.com/content/bashir-al-daouk-1931-2007-memoriam-farewell-publisher-hero
  - title: JSTOR — Dār al-Ṭalīʿah and the Question of Arab Authenticity in the 1960s
    url: https://www.jstor.org/stable/27131899
