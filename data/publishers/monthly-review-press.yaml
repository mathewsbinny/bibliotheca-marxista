description: >
  The book-publishing arm of the independent socialist magazine Monthly Review
  (founded 1949). It began in 1952 with I. F. Stone's The Hidden History of the
  Korean War, which Stone could not place with another publisher. Its list has been
  central to Marxist political economy, dependency and world-systems theory, and
  labour studies, and it remains active.
