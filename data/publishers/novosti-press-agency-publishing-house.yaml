description: >
  The book-publishing arm of the Novosti Press Agency, the Soviet Union's agency
  for information and propaganda abroad, set up in 1964 (the agency itself was
  founded on 21 February 1961). It issued some 250 titles a year in print runs of
  over 20 million copies — books and pamphlets about Soviet life and policy in
  dozens of languages — alongside APN's magazines, including Sputnik. APN ceased
  in 1991; its successors became RIA Novosti.
