description: >
  The London house founded in 1927 by the socialist publisher Victor Gollancz,
  whose list in the 1930s and 1940s was central to the British Left — anti-fascist
  reportage, Popular Front politics and, from 1936, the Left Book Club. After
  Victor Gollancz's death in 1967 the firm was run by his daughter Livia until its
  sale to Houghton Mifflin in 1989. It passed to Cassell in 1992 and so to the
  Orion Publishing Group (owned by Hachette), where since 1998 Gollancz has been
  Orion's science-fiction and fantasy imprint. This catalogue covers the Victor
  Gollancz years, 1927–1967.
