name: Frente Sandinista de Liberación Nacional
alternate_names:
  - FSLN
  - Sandinista National Liberation Front
country: Nicaragua
city: Managua
founded: 1961
status: active
affiliation: Marxist-influenced liberation front of Nicaragua
languages:
  - Spanish
description: >-
  The Sandinista National Liberation Front, founded in 1961 by Carlos Fonseca and others
  on a Marxist and Sandinist programme, which overthrew the Somoza dictatorship in 1979
  and governed until 1990. Its secretariat of propaganda and political education and its
  representation in Havana published the works of Fonseca and its leaders. Only its
  output to 1995 is catalogued here.
sources:
  - title: Wikipedia — Sandinista National Liberation Front
    url: https://en.wikipedia.org/wiki/Sandinista_National_Liberation_Front
