description: >-
  The publishing house of the West German Maoist current led by Willi Dickhut — the
  Communist Workers' League of Germany (KABD, 1972–1982) and its successor, the
  Marxist-Leninist Party of Germany (MLPD, from 1982) — first in Stuttgart and later in
  Essen and Gelsenkirchen. It published Dickhut's The Restoration of Capitalism in the
  Soviet Union and the party's theoretical series.
