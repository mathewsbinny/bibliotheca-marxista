name: Volksbuchhandlung Hottingen-Zürich
alternate_names:
  - Volksbuchhandlung
  - Schweizerische Genossenschaftsbuchdruckerei
country: Switzerland
home_country: Germany
city: Zurich
founded: 1880
dissolved: 1890
status: defunct
affiliation: Exile publisher of the German Social Democratic Party
languages:
  - German
description: >
  The exile press of German Social Democracy during Bismarck's Anti-Socialist Laws
  (1878–1890), when the party's publications were banned in Germany. From Hottingen,
  near Zurich, it published the party organ Der Sozialdemokrat and works by Marx,
  Engels, Bebel, Kautsky and Bernstein for smuggling across the border. Its role ended
  with the lapse of the Anti-Socialist Laws in 1890. Its dates (c. 1880–1890) are
  approximate.
