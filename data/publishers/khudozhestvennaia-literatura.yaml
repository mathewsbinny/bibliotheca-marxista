description: >
  The leading Soviet publisher of fiction, founded in Moscow on 1 October 1930 as
  the State Publishing House of Fiction (GIKhL) from the literary sector of the
  State Publishing House and the Zemlya i Fabrika house. It was renamed Goslitizdat
  in 1934, absorbed Academia in 1937, and took the name Khudozhestvennaia
  literatura in 1963. It published Russian and Soviet classics, collected works of
  Soviet writers and world literature in translation, including the Library of
  World Literature. Only its output to 1991 is catalogued here.
