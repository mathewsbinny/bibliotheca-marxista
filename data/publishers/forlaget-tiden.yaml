name: Forlaget Tiden
alternate_names:
  - Tiden
country: Denmark
city: Copenhagen
founded: 1945
dissolved: 1992
status: defunct
affiliation: Communist Party of Denmark (DKP)
languages:
  - Danish
identifiers:
  wikidata: "Q16323564"
description: >-
  The publishing house of the Communist Party of Denmark from May 1945 to 1992, issuing
  political theory, party writings such as those of its chairman Aksel Larsen, and
  literature. Its first book described Danish communists in the Stutthof concentration
  camp; among its last was the Danish edition of Gorbachev's Perestroika.
