description: >-
  The People's Publishing House of Inner Mongolia, the provincial party press, which publishes
  the local editions of the works of Mao, Marx and Lenin, the documents of the Party and the
  provincial government, political education literature and local history. Only its output to
  1990 is catalogued here.
