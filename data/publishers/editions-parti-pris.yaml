description: >-
  The publishing house of the review Parti pris, founded in Montreal in 1963 by young socialists
  for an independent, socialist and secular Quebec, which published Pierre Vallières's Nègres
  blancs d'Amérique (1968) and the political writing of the Quiet Revolution's left.
