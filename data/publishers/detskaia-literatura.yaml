description: >
  The Soviet state publisher of children's literature, founded on 9 September 1933
  as Detgiz (the State Children's Publishing House). After 1991 it split into a
  Moscow house, which kept the name, and a Saint Petersburg house that became
  Lyceum and later returned to the name Detgiz. Only its output to 1991 is
  catalogued here.
