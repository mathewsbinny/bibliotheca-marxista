name: New York Labor News Company
alternate_names:
  - New York Labor News Co.
country: United States
city: New York
founded: 1889
dissolved: 1995
status: defunct
affiliation: Publishing house of the Socialist Labor Party of America
languages: [English]
description: >
  The Socialist Labor Party of America's party-owned publishing house, operating
  from 1889 to 1995 as the publisher of Daniel De Leon and of the party's pamphlets and its
  weekly The People. It issued early American editions of Marx and Engels —
  including the first American publication of the Critique of the Gotha Programme,
  in The People in 1900 — and between 1903 and 1911 some 21 volumes of translated
  works.
