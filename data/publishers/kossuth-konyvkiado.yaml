description: >-
  Founded as Szikra in Szeged on 7 November 1944 by the Hungarian Communist Party's
  central leadership, organised by Zoltán Vas with József Révai planning its list; by
  1950 it was publishing over 500 titles a year of political pamphlets, Marxist classics
  and literature. In 1956 it became Kossuth Könyvkiadó, the publishing house of the
  Hungarian Socialist Workers' Party, the leading publisher of political literature and
  party documents of the Kádár era. Only its output to 1990 is catalogued here.
