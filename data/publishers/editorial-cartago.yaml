name: Editorial Cartago
alternate_names:
  - Cartago
country: Argentina
city: Buenos Aires
founded: 1958
dissolved: 1985
status: defunct
affiliation: Promoted by the Communist Party of Argentina, though formally a private company
languages: [Spanish]
description: >
  One of the publishing ventures created and promoted by the Communist Party of
  Argentina. Unlike Editorial Anteo it was not an official party undertaking but a
  private company, in whose management communist leaders sat alongside friends and
  allies of the party. Active from 1958 to 1985, it published Marxist and
  progressive literature in Spanish, and is the end point of Horacio López's
  history of the party's publishing, 1918–1983.
sources:
  - title: "Horacio A. López, Las editoriales rojas: de La Internacional a Cartago (review, SciELO)"
    url: https://www.scielo.cl/scielo.php?script=sci_arttext&pid=S0718-50492018000300286
