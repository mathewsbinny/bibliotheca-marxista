  - Baeksan Seodang
country: South Korea
city: Seoul
founded: 1982
status: active
estimated:
  - founded
languages:
  - Korean
description: >-
  One of the leading social-science publishers of South Korea's 1980s democracy
  movement, when Marxist books were banned and their possession punishable under the
  National Security Law; it published critical social science, history and theory for
  the student and labour movements. Only its output to 1995 is catalogued here.
