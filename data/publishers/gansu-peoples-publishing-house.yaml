name: Gansu People's Publishing House
alternate_names:
  - Gansu ren min chu ban she
  - 甘肃人民出版社
country: China
city: Lanzhou
founded: 1956
status: active
estimated:
  - founded
affiliation: Publishing house of the Communist Party committee of Gansu
languages:
  - Chinese
description: >-
  The People's Publishing House of Gansu, the provincial party press, which publishes the local
  editions of the works of Mao, Marx and Lenin, the documents of the Party and the provincial
  government, political education literature and local history. Only its output to 1990 is
  catalogued here.
