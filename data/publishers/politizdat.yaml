name: Politizdat
alternate_names:
  - Издательство политической литературы
  - Gospolitizdat
  - Partizdat
  - Political Literature Publishing House
country: Soviet Union
city: Moscow
founded: 1918
dissolved: 1991
status: defunct
affiliation: Central publishing house of the Communist Party of the Soviet Union
languages: [Russian]
description: >
  The Soviet Communist Party's central publisher of political literature. It began
  in 1918 as the Kommunist publishing house, became the political literature
  department of the State Publishing House in 1919, and was reorganised in 1931 as
  Partizdat, answering directly to the party's propaganda department. Renamed
  Gospolitizdat in 1941, it became Politizdat, the publishing house of the CPSU
  Central Committee, in 1963. It issued the Russian editions of Marx, Engels and
  Lenin and the party's documents. After the party was banned in 1991 it was
  turned into the state publisher Respublika.
