description: >-
  The publishing house of Gerry Healy's Trotskyist movement — The Club, the Socialist
  Labour League from 1959 and the Workers Revolutionary Party from 1973 — which from
  1955 issued its pamphlets and in the 1970s expanded into a major publisher of Trotsky
  and other Marxist literature.
