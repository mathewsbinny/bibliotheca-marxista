name: Progress Publishers
alternate_names:
  - Издательство «Прогресс»
country: Soviet Union
city: Moscow
founded: 1963
dissolved: 1991
status: defunct
predecessor: foreign-languages-publishing-house-moscow
languages: [English, French, German, Spanish, and many others]
description: >
  Formed by the decree of 10 August 1963 from the humanities departments of the
  Foreign Languages Publishing House and the Foreign Literature Publishing House
  (some sources date its start to 1964). Progress issued the standard English
  editions of Marx, Engels and Lenin, including the Lenin Collected Works and —
  jointly with Lawrence & Wishart and International Publishers — the Marx/Engels
  Collected Works. Its fiction list was split off as Raduga Publishers in 1982.
  In 1991 it became a closed joint-stock company, the Progress Publishing Group,
  whose successors include Progress-Tradition (1997) and Progress-Pleiada (2001).
name_history:
  - name: Progress Publishers
    from: 1963
    to: 1991
    note: Fiction and literature split off as Raduga Publishers in 1982
  - name: Progress Publishing Group (joint-stock company)
    from: 1991
    note: Later divided among successor firms, including Progress-Tradition and Progress-Pleiada
