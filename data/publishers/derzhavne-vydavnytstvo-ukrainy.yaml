name: Derzhavne vydavnytstvo Ukrainy
alternate_names:
  - DVU
  - State Publishing House of Ukraine
  - Державне видавництво України
country: Soviet Union
region: Ukraine
city: Kharkiv
founded: 1919
dissolved: 1930
status: defunct
affiliation: Ukrainian Soviet Socialist Republic
languages:
  - Ukrainian
  - Russian
description: >-
  The State Publishing House of Ukraine, founded in 1919 and based in Kharkiv, then the capital
  of Soviet Ukraine, which published the Ukrainian translations of Marx, Engels and Lenin, party
  literature and the writers of the Ukrainisation of the 1920s until it was reorganised in 1930.
