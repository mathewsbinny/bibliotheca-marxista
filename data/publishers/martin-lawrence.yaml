name: Martin Lawrence
alternate_names:
  - Martin Lawrence Ltd
country: United Kingdom
city: London
founded: 1927
dissolved: 1936
status: defunct
affiliation: Publisher of the Communist Party of Great Britain
successor: lawrence-and-wishart
languages: [English]
description: >
  The Communist Party of Great Britain's official press, publishing Marx, Engels,
  Lenin and Stalin in English alongside party pamphlets. It was set up in 1927 to
  take over the party's publishing (one library catalogue record gives a Martin
  Lawrence imprint dated 1926, possibly a cataloguing error). It did not close so
  much as merge: in
  1936 it combined with Wishart Ltd, Ernest Wishart's left-wing, anti-fascist
  family firm, to form Lawrence & Wishart, which still publishes in London (one
  source, Spartacus Educational, gives 1935, but Yale's archive, Lawrence &
  Wishart's own history and Wikipedia all give 1936).
sources:
