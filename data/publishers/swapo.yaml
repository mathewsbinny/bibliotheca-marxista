name: SWAPO
alternate_names:
  - South West Africa People's Organisation
country: Namibia
city: Windhoek
founded: 1960
status: active
languages:
  - English
description: >-
  The South West Africa People's Organisation, founded in 1960, which fought for
  Namibia's independence from South African rule from exile in Zambia and Angola, with
  the support of the socialist states, and has governed Namibia since independence in
  1990. Its publications from Luanda, Dar es Salaam and New York include military
  communiqués, refugee reports and its students' seminars. Only its publications to 1990
  are catalogued here.
sources:
