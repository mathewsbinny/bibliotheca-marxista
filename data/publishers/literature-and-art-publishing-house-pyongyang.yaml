description: >
  North Korea's main publisher of fiction, poetry and literary criticism. Its books
  appear in library catalogues under the imprints Munye Ch'ulp'ansa (Literature and Art
  Publishing House), Munhak Yesul Chonghap Ch'ulp'ansa (Literature and Art Comprehensive
  Publishing House) and, from September 2001, Munhak Yesul Ch'ulp'ansa, which also
  publishes the magazine Chosŏn Yesul. Its founding date is not documented in the
  sources consulted. Unrelated Seoul houses with similar romanised names are excluded.
