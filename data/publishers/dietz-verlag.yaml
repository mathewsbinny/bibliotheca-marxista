name: Dietz Verlag Berlin
alternate_names:
  - Dietz Verlag
  - Karl Dietz Verlag Berlin
country: East Germany
city: Berlin
founded: 1946
status: active
affiliation: Party publisher of the Socialist Unity Party of Germany (SED)
languages: [German]
identifiers:
  wikidata: "Q1224245"
description: >
  The principal Marxist publisher of the German Democratic Republic and the SED's
  party publishing house, founded in East Berlin in 1946 and trading as Dietz
  Verlag Berlin from 1947. It issued the standard German editions of Marx and
  Engels and of Lenin, alongside party history and political literature. It
  continues after reunification as Karl Dietz Verlag Berlin. It is distinct from
  the Social Democratic J. H. W. Dietz Nachf. of Stuttgart and Bonn.
name_history:
  - name: J. H. W. Dietz Nachf. GmbH (East Berlin)
    from: 1946
    to: 1947
  - name: Dietz Verlag Berlin
    from: 1947
  - name: Karl Dietz Verlag Berlin
    note: Post-reunification successor
