name: Quân đội nhân dân
alternate_names:
  - Nhà xuất bản Quân đội nhân dân
  - People's Army Publishing House
country: Vietnam
city: Hanoi
founded: 1961
status: active
estimated:
  - founded
affiliation: Publishing house of the Vietnam People's Army
languages:
  - Vietnamese
description: >-
  The publishing house of the Vietnam People's Army, which publishes the army's
  political literature, the history of the wars against France and the United States,
  military theory, and memoirs of Võ Nguyên Giáp and other commanders. Only its output
  to 1990 is catalogued here.
