name: Mongolian People's Revolutionary Party
alternate_names:
  - MPRP
country: Mongolia
city: Ulaanbaatar
founded: 1921
status: active
languages:
  - Mongolian
  - English
description: >-
  The ruling party of the Mongolian People's Republic from 1921 to 1990, whose paper was
  Ünen; it renamed itself the Mongolian People's Party in 2010. Its imprint published
  central committee reports, such as Yumjaagiin Tsedenbal's.
