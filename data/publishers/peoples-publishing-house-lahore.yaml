name: People's Publishing House (Lahore)
alternate_names:
  - People's Publishing House, Lahore
country: Pakistan
city: Lahore
founded: 1942
status: active
languages: [Urdu, English]
description: >
  Established in Lahore in 1942 as a branch of the Communist Party of India's
  People's Publishing House, founded that year when the party was legalised.
  After Partition in 1947 it became a major Pakistani publisher of Marxist and
  progressive literature in its own right, and it remains active.
