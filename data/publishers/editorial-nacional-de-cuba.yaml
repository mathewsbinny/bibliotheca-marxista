name: Editorial Nacional de Cuba
alternate_names:
  - Imprenta Nacional de Cuba
country: Cuba
city: Havana
founded: 1962
dissolved: 1967
status: defunct
languages:
  - Spanish
description: >-
  The national publishing house of revolutionary Cuba, directed by Alejo Carpentier, which
  issued mass editions of Cuban and world literature and political works until the Instituto
  Cubano del Libro took over its work in 1967.
