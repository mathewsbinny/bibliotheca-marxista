name: Xin Qingnian She (New Youth Society)
alternate_names:
  - 新青年社
  - New Youth Society
country: China
city: Shanghai
founded: 1920
dissolved: 1926
status: defunct
affiliation: Chinese Communist Party
languages:
  - Chinese
description: >-
  The press of New Youth, the magazine founded by Chen Duxiu in 1915 that became an
  organ of the young Chinese Communist Party. Under this imprint it issued early Chinese
  socialist anthologies and party writings on the Chinese revolution in the 1920s.
