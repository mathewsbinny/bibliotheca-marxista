name: VIVA — Vereinigung Internationaler Verlagsanstalten
alternate_names:
  - VIVA
  - Vereinigung Internationaler Verlags-Anstalten
country: Germany
city: Berlin
founded: 1921
dissolved: 1933
status: defunct
affiliation: Publishing house of the Communist Party of Germany (KPD)
languages: [German]
description: >
  One of the names under which the Communist Party of Germany published between
  the wars. Because communist literature was repeatedly seized, the KPD's
  publishing house changed its name several times: Vulkan Verlagsgesellschaft and
  Frankes Verlag (1919), VIVA (from 1921), Agis-Verlag (1924–1932) and
  Internationaler Arbeiterverlag (1927–1933). VIVA published party literature and
  German editions of Marx, Engels and Lenin until the Nazi seizure of power.
name_history:
  - name: Vulkan Verlagsgesellschaft; Frankes Verlag
    from: 1919
  - name: VIVA — Vereinigung Internationaler Verlagsanstalten
    from: 1921
  - name: Agis-Verlag
    from: 1924
    to: 1932
    note: Used alongside VIVA
  - name: Internationaler Arbeiterverlag
    from: 1927
    to: 1933
sources:
  - title: Verbrannte und Verbannte — Vereinigung Internationaler Verlagsanstalten
    url: https://verbrannte-und-verbannte.de/publisher/196
