name: People's Democratic Party of Afghanistan
alternate_names:
  - PDPA
  - Ḥizb-i Dimūkrātīk-i Khalq-i Afghānistān
country: Afghanistan
city: Kabul
founded: 1965
dissolved: 1992
status: defunct
languages:
  - Dari
  - Pashto
  - English
description: >-
  Afghanistan's Marxist–Leninist party, founded in 1965 and divided into the Khalq and
  Parcham factions, which seized power in the Saur Revolution of 1978 and ruled the
  Democratic Republic of Afghanistan, with Soviet intervention from 1979, until 1992.
  Its imprint published central committee documents and conference records.
sources:
