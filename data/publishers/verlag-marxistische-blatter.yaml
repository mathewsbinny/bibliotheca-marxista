description: >-
  The West German publisher of the journal Marxistische Blätter, founded in November
  1963 and close to the German Communist Party (DKP), with funding from East Germany
  until 1989. It published Marxist theory, party history and co-editions with Dietz
  Verlag of East Berlin.
