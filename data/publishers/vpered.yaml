name: Vpered
alternate_names:
  - Kn-vo Vpered
  - Вперёд
country: Soviet Union
city: Geneva
founded: 1904
dissolved: 1907
status: defunct
affiliation: Publishing house of the Bolshevik faction of the RSDLP
languages:
  - Russian
description: >-
  The Bolshevik publishing house that grew up around Lenin's newspaper Vpered
  ("Forward"), founded in Geneva in December 1904 after the Mensheviks took over Iskra,
  and continued legally in St Petersburg in the revolution of 1905–1907. It published
  Lenin's pamphlets and the literature of the Third Party Congress.
