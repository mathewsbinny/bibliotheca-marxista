name: Książka
alternate_names:
  - Spółdzielnia Wydawnicza Książka
country: Poland
city: Warsaw
founded: 1918
dissolved: 1948
status: defunct
affiliation: Cooperative publishing house of the Polish communist movement
languages:
  - Polish
description: >-
  The publishing cooperative founded in 1918 by the left of the Polish socialist
  movement, which published communist literature legally between the wars and became the
  press of the Polish Workers' Party after 1944, until its merger with Wiedza into
  Książka i Wiedza in 1948.
sources:
  - title: Wikipedia (pl) — Książka i Wiedza
    url: https://pl.wikipedia.org/wiki/Ksi%C4%85%C5%BCka_i_Wiedza
