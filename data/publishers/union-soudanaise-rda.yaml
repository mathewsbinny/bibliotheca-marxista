description: >-
  The Sudanese Union–African Democratic Rally, the party of Modibo Keïta, which led Mali
  to independence in 1960 and ruled it as a one-party state pursuing 'scientific
  socialism' in alliance with the socialist countries until the coup of 1968. Its
  seminars and congresses set out its socialist programme.
