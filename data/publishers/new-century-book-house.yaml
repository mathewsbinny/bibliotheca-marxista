name: New Century Book House
alternate_names:
  - NCBH
  - New Century Book House Pvt Ltd
country: India
city: Madras
founded: 1951
status: active
languages: [Tamil, English]
website: https://ncbhpublisher.in/
description: >
  A Tamil publisher and bookseller founded in Madras, according to its own
  account on 1 June 1951 (another source gives 1958). It publishes Tamil
  translations of the Marxist classics — including the Communist Manifesto —
  alongside Tamil literature, and now has 18 branches across Tamil Nadu. It is
  associated with the Communist Party of India; the details of that association
  still need confirming.
sources:
  - title: New Century Book House — About
    url: https://ncbhpublisher.in/about
