name: Hunan People's Publishing House
alternate_names:
  - Hunan ren min chu ban she
  - 湖南人民出版社
country: China
city: Changsha
founded: 1954
status: active
estimated:
  - founded
affiliation: Publishing house of the Communist Party committee of Hunan
languages:
  - Chinese
description: >-
  The People's Publishing House of Hunan, the provincial party press, which publishes the local
  editions of the works of Mao, Marx and Lenin, the documents of the Party and the provincial
  government, political education literature and local history. Only its output to 1990 is
  catalogued here.
