name: Sofia Press
alternate_names:
  - Sofia-Press
  - София-прес
country: Bulgaria
city: Sofia
founded: 1967
dissolved: 1990
status: defunct
predecessor: foreign-languages-press-sofia
languages: [English, French, German, Russian, and others]
description: >
  Bulgaria's state foreign-language publisher from around 1967, taking over the
  role of the Foreign Languages Press. It issued pamphlets and books on Bulgarian
  politics, history and culture in the same foreign-language propaganda style; the
  Library of Congress holds a long run of its pamphlets from 1977 to 1989. Its
  output ends with the fall of the communist government in 1989–90, and nothing
  shows it continuing as a publisher into the 1990s. Its founding date and the
  formal handover from the Foreign Languages Press are approximate.
sources:
  - title: Open Library — Sofia-Press
    url: https://openlibrary.org/publishers/Sofia-Press
