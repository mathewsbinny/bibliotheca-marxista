name: Zerno
alternate_names:
  - Kn-vo Zerno
  - Зерно
country: Soviet Union
city: St Petersburg
founded: 1906
dissolved: 1907
status: defunct
affiliation: Bolshevik publishing house of the 1905 revolution
languages:
  - Russian
description: >-
  A legal Bolshevik publishing house in St Petersburg in 1906–1907, run by Mikhail
  Kedrov, which published Lenin's writings, including the collection Za 12 let (In
  Twelve Years, 1907), before it was suppressed.
