name: Shenghuo Shudian
alternate_names:
  - Sheng huo shu dian
  - 生活书店
  - Life Bookstore
country: China
city: Shanghai
founded: 1932
dissolved: 1948
status: defunct
affiliation: Left-wing publishing house founded by Zou Taofen
languages:
  - Chinese
description: >-
  The Shanghai publishing house founded in 1932 by the journalist Zou Taofen, the largest
  progressive publisher of the 1930s and 1940s, which published translations of Marx, Engels and
  Soviet literature and the writers of the anti-Japanese movement, moving with the war to Hankou
  and Chongqing. In 1948 it merged with Dushu and Xinzhi into Sanlian.
