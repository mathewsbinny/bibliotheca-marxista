name: Naim Frashëri Publishing House
alternate_names:
  - Shtëpia Botuese Naim Frashëri
  - Naim Frashëri
country: Albania
city: Tirana
founded: 1946
dissolved: 1991
status: defunct
languages: [Albanian]
description: >
  Albania's principal publisher under communism, founded in 1946 and for much of
  the period the country's only literary publisher. Its political and translated
  Marxist list was split off in 1973 as the 8 Nëntori Publishing House, after
  which Naim Frashëri concentrated on literature. It closed in 1991, with the end
  of the communist period.
sources:
  - title: Wikipedia — Naim Frashëri Publishing House
    url: https://en.wikipedia.org/wiki/Naim_Frash%C3%ABri_Publishing_House
