description: >-
  The main opposition party of Botswana, founded in 1965 by Kenneth Koma, a Marxist educated in
  Moscow, as a broad front of the left. Its secretariat in Mahalapye, and later Gaborone,
  published the party's programme, Koma's writings on African revolution and education, and its
  election manifestos.
