name: Merlin Press
country: United Kingdom
city: London
founded: 1956
status: active
languages: [English]
website: https://www.merlinpress.co.uk/
description: >
  Founded in 1956 by Martin Eve amid the break-up of the British communist
  movement after the Soviet invasion of Hungary, to publish for the emerging New
  Left. It is the long-standing publisher of the Socialist Register and remains
  active.
sources:
