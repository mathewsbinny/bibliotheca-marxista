description: >-
  Founded in Cologne in 1957 by Manfred Pahl-Rugenstein, a West German publisher of left
  scholarship covertly financed by East Germany — nicknamed "Pahl-Rubelschein" when this
  became known. When the East German funding and contracts ended with the fall of the
  Wall, it filed for bankruptcy on 15 December 1989; former staff founded PapyRossa
  Verlag in 1990.
