name: Dushu Chubanshe
alternate_names:
  - Du shu chu ban she
  - Dushu shenghuo chubanshe
  - 读书出版社
  - Reading Publishing House
country: China
city: Shanghai
founded: 1936
dissolved: 1948
status: defunct
affiliation: Left-wing publishing house of the 1930s and 1940s
languages:
  - Chinese
identifiers:
  wikidata: "Q140925533"
description: >-
  A Shanghai publishing house of the left, founded in 1936 (first as Dushu shenghuo chubanshe),
  which published the first complete Chinese translation of Capital (1938) and other Marxist
  works, and in 1948 merged into Sanlian.
