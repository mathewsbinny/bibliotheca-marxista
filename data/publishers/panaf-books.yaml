description: >
  Founded in 1968 by Kwame Nkrumah, then in exile in Conakry, after the London
  publishers of his earlier books refused to handle them following the 1966 coup that
  overthrew him in Ghana. Managed by his former research assistant June Milne from 89
  Fleet Street, it bought up the remaining stock of his earlier books — saving them from
  pulping — kept them in print, and published the new books he wrote in exile, including
  his later Marxist works on class struggle and revolutionary warfare in Africa. It
  remains active.
