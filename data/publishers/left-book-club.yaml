name: Left Book Club
country: United Kingdom
city: London
founded: 1936
dissolved: 1948
status: defunct
parent: victor-gollancz
affiliation: Selection committee of Victor Gollancz, John Strachey and Harold Laski
languages: [English]
description: >
  A subscription book club founded by the publisher Victor Gollancz in May 1936.
  Members received a monthly "Choice" in distinctive limp orange covers, and the
  Club grew into a mass movement of local discussion groups supporting the Popular
  Front against fascism. It wound down in 1948. A new Left Book Club was launched
  in November 2015 by Jan Woolf and Neil Faulkner in collaboration with Pluto Press;
  this catalogue covers the original Club, 1936–1948.
name_history:
