description: >
  A book and journal publisher with openly political aims, formed in early 1841 from the
  Winterthur bookshop of the printer Hegner when the geologist Julius Fröbel, a German
  émigré in Zurich, took over its direction. It set out to fight the reaction restored
  in Zurich in 1839 and to let opposition German writers evade the censorship of the
  German Confederation. Its first book, Georg Herwegh's Gedichte eines Lebendigen
  (1841), ran through seven editions and 19,000 copies in eighteen months; it went on to
  publish Arnold Ruge's Anekdota, Ludwig Feuerbach's Grundsätze der Philosophie der
  Zukunft and Bruno Bauer's Das entdeckte Christenthum. It fulfilled this role until
  1845.
