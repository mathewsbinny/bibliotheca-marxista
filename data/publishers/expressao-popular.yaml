name: Expressão Popular
alternate_names:
  - Editora Expressão Popular
country: Brazil
city: São Paulo
founded: 1999
status: active
affiliation: Founded from the Landless Workers' Movement (MST)
languages: [Portuguese]
description: >
  A São Paulo publisher founded in 1999 out of the Landless Workers' Movement
  (MST), to educate the activists of rural and urban social movements, students
  and teachers. In its first twenty-five years it published more than 700 titles,
  and it runs its own bookshop and a book club. It remains active.
