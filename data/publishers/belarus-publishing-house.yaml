description: >-
  The oldest publishing house of Belarus, founded in Minsk in 1921 as the State
  Publishing House of the BSSR and renamed Belarusʹ in 1963, when it became the
  republic's publisher of political literature: the works of Lenin and the documents of
  the Communist Party of Byelorussia in Belarusian and Russian.
