name: Communist Party of Korea, North Korean Bureau
alternate_names:
  - Chosŏn Kongsandang Puk Chosŏn Punʼguk
  - North Korean Branch Bureau of the Communist Party of Korea
country: North Korea
city: Pyongyang
founded: 1945
dissolved: 1946
status: defunct
affiliation: North Korean organisation of the Communist Party of Korea
languages:
  - Korean
description: >-
  The North Korean branch bureau of the Communist Party of Korea, formed in Pyongyang in
  October 1945 with Kim Il Sung at its head, which led the land reform of 1946 and
  merged with the New People's Party to form the Workers' Party of North Korea in August
  1946. Its propaganda department published explanations of the land reform.
