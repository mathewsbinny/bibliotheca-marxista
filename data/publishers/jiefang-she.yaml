name: Jiefang She (Liberation Press)
alternate_names:
  - 解放社
  - Chieh-fang she
  - Liberation Press
country: China
city: Yan'an
founded: 1937
dissolved: 1950
status: defunct
affiliation: Chinese Communist Party
languages:
  - Chinese
identifiers:
  wikidata: "Q1518038"
description: >-
  The publishing imprint of the Chinese Communist Party's Central Committee during the
  war years, based in Yan'an after the party's central organs moved there in 1937. It
  issued Mao's wartime writings, Chinese translations of Marx, Lenin and Stalin, and
  study materials for the rectification movement. Its imprint appears in library
  catalogues from 1937 to the late 1940s.
