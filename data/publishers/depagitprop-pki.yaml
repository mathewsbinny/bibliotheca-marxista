description: >-
  The imprints of the Communist Party of Indonesia's Central Committee and its Agitation
  and Propaganda Department, which issued the party's constitution, programmes, election
  manifestos, resolutions, study courses and speeches by D. N. Aidit. They appear in
  library catalogues from 1953 until the destruction of the party in 1965–66.
