name: Workers' Party of Korea Publishing House
alternate_names:
  - 조선로동당출판사
  - Chosŏn Rodongdang Ch'ulp'ansa
  - Joseon Rodongdang Chulpansa
country: North Korea
city: Pyongyang
founded: 1945
status: active
affiliation: Controlled by the Propaganda and Agitation Department of the Workers' Party of Korea
languages: [Korean]
description: >
  The Workers' Party of Korea's own publishing house, founded in Pyongyang in
  October 1945. It publishes political works and fiction — including the writings
  of the party's leaders — along with posters and Kulloja, the party's theoretical
  monthly. Its books are mostly in Korean; foreign-language editions are issued by
  the Foreign Languages Publishing House. It remains active.
sources:
