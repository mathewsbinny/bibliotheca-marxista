name: Editora Austral
country: Chile
city: Santiago
founded: 1951
dissolved: 1973
status: defunct
estimated:
  - founded
affiliation: Communist Party of Chile
languages:
  - Spanish
description: >-
  A Santiago publisher of the Chilean communist movement from the 1950s until the coup
  of 1973. It published Hernán Ramírez Necochea's histories of imperialism and of the
  Communist Party of Chile, the memoirs of party founder Elías Lafertte, and political
  poetry by Pablo Neruda.
sources:
  - title: Memoria Chilena — El Partido Comunista de Chile (1922–1990)
    url: https://www.memoriachilena.gob.cl/602/w3-article-3394.html
