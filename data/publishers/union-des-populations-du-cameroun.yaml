description: >-
  The anti-colonial party founded in 1948 under Ruben Um Nyobè, banned by France in
  1955, which fought an insurrection against French rule and the Ahidjo government; its
  leaders, including Um Nyobè and Félix Moumié, were killed. Its publications, many from
  exile, include Elenga Mbuyinga's Pan-Africanism or Neo-Colonialism?
