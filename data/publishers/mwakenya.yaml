name: Mwakenya
alternate_names:
  - Muungano wa Wazalendo wa Kukomboa Kenya
country: Kenya
city: Nairobi
founded: 1982
dissolved: 1991
status: defunct
estimated:
  - dissolved
languages:
  - English
  - Swahili
description: >-
  The underground socialist movement that opposed Daniel arap Moi's one-party state,
  which grew out of the December Twelve Movement after the failed coup of 1982 and was
  active into the 1990s, with Ngũgĩ wa Thiong'o among its supporters in exile; it
  published its draft minimum programme and democracy plank.
