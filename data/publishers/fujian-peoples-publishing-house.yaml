name: Fujian People's Publishing House
alternate_names:
  - Fujian ren min chu ban she
  - 福建人民出版社
country: China
city: Fuzhou
founded: 1955
status: active
estimated:
  - founded
affiliation: Publishing house of the Communist Party committee of Fujian
languages:
  - Chinese
description: >-
  The People's Publishing House of Fujian, the provincial party press, which publishes the local
  editions of the works of Mao, Marx and Lenin, the documents of the Party and the provincial
  government, political education literature and local history. Only its output to 1990 is
  catalogued here.
