description: >-
  Founded in Berlin in 1917 by Wieland Herzfelde with his brother John Heartfield and
  George Grosz, a leading house of the avant-garde and communist left, publishing
  proletarian literature, Soviet writers in translation and Heartfield's photomontage
  covers. After 1933 its stock of some 40,000 books was confiscated and destroyed;
  Herzfelde re-established it in Prague, then in London from 1938, and in 1944 founded
  its successor, the Aurora Verlag, in New York.
