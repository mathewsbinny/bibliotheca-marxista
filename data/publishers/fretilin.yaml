name: FRETILIN
alternate_names:
  - Frente Revolucionária de Timor-Leste Independente
  - Revolutionary Front for an Independent East Timor
country: Timor-Leste
city: Dili
founded: 1974
status: active
languages:
  - Portuguese
  - English
description: >-
  The Revolutionary Front for an Independent East Timor, founded in 1974, which declared
  independence in 1975 and led the resistance to the Indonesian occupation; its
  Marxist-influenced manual and programme and its external relations department's
  reports were published abroad, from Maputo among other places.
