description: >
  The bookshop and publishing arm of L'Humanité. It began in 1913, when the daily
  still belonged to the Socialist Party; after the Congress of Tours the new
  Communist Party took over the paper and its bookshop in 1921. Meant to be the
  party's sole publisher, with Boris Souvarine in charge for a few years, it
  absorbed other communist imprints, including the Bibliothèque communiste and
  Éditions Clarté, and between 1920 and 1925 issued 20 to 40 titles a year,
  averaging about 5,600 copies each. It was not closed outright but replaced: in
  1925 the party created the Bureau d'éditions, de diffusion et de publicité to
  run the national leadership's publishing, and in 1927 added the Éditions
  Sociales Internationales, more closely controlled by the Comintern. That line of
  descent leads to the Éditions Sociales of 1944.
