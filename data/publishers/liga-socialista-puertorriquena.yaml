name: Liga Socialista Puertorriqueña
alternate_names:
  - Puerto Rican Socialist League
country: United States
region: Puerto Rico
city: Santurce
founded: 1964
dissolved: 1977
status: defunct
estimated:
  - dissolved
affiliation: Marxist–Leninist organisation of Puerto Rican independence
languages:
  - Spanish
description: >-
  The Marxist–Leninist league founded in 1964 by the poet and former Nationalist Juan Antonio
  Corretjer and Consuelo Lee Tapia, which combined Albizu Campos's nationalism with Marxism and
  advocated armed struggle for independence. Its cadres published its theses and study materials
  in Santurce and Guaynabo.
sources:
