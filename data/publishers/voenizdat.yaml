name: Voenizdat
alternate_names:
  - Voennoe izdatelʹstvo
  - Military Publishing House of the USSR Ministry of Defence
  - Воениздат
country: Soviet Union
city: Moscow
founded: 1919
status: active
affiliation: Publishing house of the Soviet Ministry of Defence
languages:
  - Russian
description: >-
  The military publishing house of the Soviet state, founded in 1919, which published
  the Red Army's political literature, military theory, memoirs of the Civil War and the
  Second World War, and the political education materials of the armed forces. It
  continues as the publisher of the Russian Ministry of Defence.
