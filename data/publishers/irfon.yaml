name: Irfon
alternate_names:
  - Ирфон
  - Nashriëti Irfon
country: Soviet Union
region: Tajikistan
city: Dushanbe
founded: 1928
status: active
affiliation: State publishing house of the Tajik SSR
languages:
  - Tajik
  - Russian
predecessor: tadzhikgosizdat
description: >-
  The state publishing house of the Tajik SSR, founded in 1928 as the Tajik State
  Publishing House and renamed Irfon ("Knowledge") in 1969, which published the
  republic's political literature, including the Tajik editions of Lenin, alongside
  fiction and history.
