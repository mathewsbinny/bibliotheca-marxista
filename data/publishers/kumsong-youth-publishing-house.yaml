name: Kŭmsŏng Youth Publishing House
alternate_names:
  - Kŭmsŏng Ch'ŏngnyŏn Ch'ulp'ansa
  - Kumsong Ch'ongnyon Ch'ulp'ansa
  - 금성청년출판사
country: North Korea
city: Pyongyang
founded: 1946
status: active
languages:
  - Korean
description: >
  A Pyongyang publisher whose catalogued titles are mainly fiction and poetry for
  children and young people. Its imprint appears in library catalogues from the 1980s;
  its founding date is not documented in the sources consulted.
