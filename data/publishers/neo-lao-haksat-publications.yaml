name: Neo Lao Haksat Publications
alternate_names:
  - Neo Lao Haksat
  - Éditions du Neo Lao Haksat
  - Lao Patriotic Front
country: Laos
founded: 1966
dissolved: 1975
status: defunct
affiliation: Publishing imprint of the Neo Lao Haksat (Lao Patriotic Front), the political arm of the Pathet Lao
languages: [English, French]
description: >
  The publishing imprint of the Neo Lao Haksat (Lao Patriotic Front), the political
  arm of the Pathet Lao, founded in January 1956. During the war against the
  U.S.-backed Royal Lao Government it put out English and French pamphlets for
  foreign readers: the Front's official documents, accounts of U.S. bombing and
  intervention — such as Twelve Years of U.S. Imperialist Intervention and
  Aggression in Laos (1966) — speeches by Souphanouvong, Kaysone Phomvihane and
  Phoumi Vongvichit, collections such as A Quarter Century of Grim and Victorious
  Struggle (1970), and revolutionary short stories. Its dated English titles run
  from 1966 to about 1973, and its French editions continue to 1973; the imprint
  ended with the founding of the Lao People's Democratic Republic in 1975.
sources:
