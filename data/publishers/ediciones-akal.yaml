name: Ediciones Akal
alternate_names:
  - Akal
country: Spain
city: Madrid
founded: 1972
status: active
languages: [Spanish]
description: >
  A left-leaning Madrid publisher founded in 1972 by Ramón Akal González, in the
  last years of the Franco dictatorship. Its catalogue of some three thousand
  works in forty collections spans the humanities, classic texts and modern
  literature. It remains active.
