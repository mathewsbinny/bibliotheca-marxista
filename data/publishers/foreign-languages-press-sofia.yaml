name: Foreign Languages Press (Sofia)
alternate_names:
  - Foreign Languages Press, Sofia
country: Bulgaria
city: Sofia
founded: 1957
dissolved: 1967
status: defunct
successor: sofia-press
languages: [English, French, German, and others]
description: >
  The People's Republic of Bulgaria's state foreign-language publisher in the late
  1950s and the 1960s — the Bulgarian counterpart of the better-known presses in
  Moscow and Beijing. It issued propaganda, official speeches, history and
  literature in English, French, German and other languages. Its role passed to
  Sofia Press, set up around 1967. Both dates are approximate: library catalogue
  records show its imprints from 1955 to 1969, and the formal handover to Sofia
  Press has not been confirmed.
sources:
  - title: Open Library — Foreign Languages Press
    url: https://openlibrary.org/publishers/%5BForeign_Languages_Press%5D
