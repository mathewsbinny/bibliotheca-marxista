name: Partit Socialista Unificat de Catalunya
alternate_names:
  - PSUC
  - Unified Socialist Party of Catalonia
  - Edicions Lluita
  - Departament d'agitació i propaganda del P.S.U.
country: Spain
region: Catalonia
city: Barcelona
founded: 1936
dissolved: 1997
status: defunct
affiliation: Communist International; the communist party of Catalonia
languages:
  - Catalan
  - Spanish
description: >-
  The communist party of Catalonia, formed in July 1936 by the fusion of four socialist and
  communist parties and admitted to the Comintern in its own right. Its department of agitation
  and propaganda published pamphlets, programmes and the speeches of Joan Comorera in Barcelona
  during the Civil War; in exile in France it published as Edicions Lluita and its paper
  Treball, and it returned to legality in 1977.
name_history:
