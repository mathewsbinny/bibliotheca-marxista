description: >-
  The People's Movement for the Liberation of Angola, founded in 1956, which fought
  Portuguese colonialism from exile bases in Congo-Brazzaville and Zambia, took power at
  independence in 1975 with Cuban and Soviet support, and was constituted as a
  Marxist–Leninist vanguard party, the MPLA–Party of Labour, in 1977. It published its
  programmes, congress documents and statements from Lusaka and Luanda. Only its output
  to 1992 is catalogued here.
