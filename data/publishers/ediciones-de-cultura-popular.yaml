name: Ediciones de Cultura Popular
alternate_names:
  - Fondo de Cultura Popular
  - ECP
country: Mexico
city: Mexico City
founded: 1941
dissolved: 1990
status: defunct
estimated:
  - dissolved
affiliation: Mexican Communist Party (PCM)
languages:
  - Spanish
description: >-
  The publishing house of the Mexican Communist Party, which began as the Fondo de
  Cultura Popular in 1941 and took the name Ediciones de Cultura Popular in 1971. It
  published party resolutions and histories, Marxist classics and popular titles such as
  Rius's Lenin para principiantes.
name_history:
  - name: Fondo de Cultura Popular
    from: 1941
    to: 1971
  - name: Ediciones de Cultura Popular
    from: 1971
sources:
