name: Svoboda
alternate_names:
  - Nakladatelství Svoboda
  - Státní nakladatelství politické literatury
  - Nakladatelství politické literatury
country: Czechoslovakia
city: Prague
founded: 1945
dissolved: 1998
status: defunct
affiliation: Communist Party of Czechoslovakia (KSČ)
languages:
  - Czech
description: >-
  The publishing house of the Communist Party of Czechoslovakia, founded in May 1945 on
  the plant of the confiscated agrarian-party publisher Novina. It published
  Marxist–Leninist theory and politics, Soviet writing and Czech literature, under the
  names Svoboda, the State Publishing House of Political Literature and the Publishing
  House of Political Literature, before ending as Svoboda – Libertas in 1998.
