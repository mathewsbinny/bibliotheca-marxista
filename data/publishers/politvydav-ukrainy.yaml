name: Politvydav Ukrainy
alternate_names:
  - Vydavnytstvo politychnoi literatury Ukrainy
  - Політвидав України
  - Political Literature Publishing House of Ukraine
country: Soviet Union
region: Ukraine
city: Kyiv
founded: 1922
dissolved: 1991
status: defunct
affiliation: Publishing house of the Central Committee of the Communist Party of Ukraine
languages:
  - Ukrainian
  - Russian
predecessor: partvydav-ukrainy
description: >-
  The political-literature publishing house of the Ukrainian SSR, founded in 1922 and
  known as Derzhpolitvydav URSR before its renaming. It published the Ukrainian editions
  of Marx, Engels and Lenin, the documents and history of the Communist Party of
  Ukraine, and political education literature.
