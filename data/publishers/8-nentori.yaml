description: >
  Created in 1973 from the political and translation departments of the Naim
  Frashëri Publishing House, and devoted to political and non-fiction works,
  including full Albanian translations of Marxist philosophy. It was the source of
  the foreign-language editions of Albanian political literature, among them the
  works of Enver Hoxha. It closed in 1991, with the end of the communist period.
