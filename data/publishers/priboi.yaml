name: Priboi
alternate_names:
  - Priboĭ
  - Прибой
country: Soviet Union
city: Leningrad
founded: 1922
dissolved: 1930
status: defunct
affiliation: Publishing house of the Leningrad (Petrograd) party organisation
languages:
  - Russian
description: >-
  The publishing house of the Petrograd (Leningrad) party organisation in the 1920s,
  which published Marxist and party literature, the history of the revolution in
  Petrograd, and proletarian fiction, until its merger into the Leningrad regional
  publishing house in 1930.
