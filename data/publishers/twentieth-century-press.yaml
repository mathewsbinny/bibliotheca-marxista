name: Twentieth Century Press
country: United Kingdom
city: London
founded: 1891
dissolved: 1922
status: defunct
affiliation: Press of the Social Democratic Federation
languages: [English]
description: >
  The press of the Social Democratic Federation, Britain's first Marxist party,
  founded to print the Federation's newspaper Justice. The 1891 founding date rests
  on a single source; the earliest firm date is 1893, when it moved into
  37a Clerkenwell Green, with William Morris guaranteeing the first year's £50 rent.
  It had taken over the whole building by 1908–09, and produced there several of
  the earliest English editions of Marx and Engels. In 1902–03, at the invitation
  of Harry Quelch — the Federation's leading figure and editor of Justice — it
  printed Lenin's Iskra. It left Clerkenwell Green in 1922; whether it continued
  elsewhere is unconfirmed, so 1922 is the best end date available rather than a
  confirmed closure. The Marx Memorial Library took over the building in 1933.
