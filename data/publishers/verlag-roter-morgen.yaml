name: Verlag Roter Morgen
alternate_names:
  - Roter Morgen
country: Germany
city: Dortmund
founded: 1969
dissolved: 1986
status: defunct
affiliation: Kommunistische Partei Deutschlands/Marxisten-Leninisten (KPD/ML)
languages: [German]
description: >
  The press of the West German KPD/ML, named after the party's paper Roter Morgen.
  The party was founded in Hamburg on 31 December 1968 and moved to Dortmund in
  1973. First Maoist, it broke with the Chinese party in 1978 and became West
  Germany's leading Hoxhaist organisation, publishing German editions of Enver
  Hoxha alongside its own programmes and the writings of its chairman Ernst Aust.
  The KPD/ML merged into the Unified Socialist Party in 1986; former members kept
  the Roter Morgen name alive until 2011. The founding year given is that of the
  party; the imprint appears in library catalogues from 1972.
