identifiers:
  wikidata: "Q104871511"
description: >-
  The press of Appeal to Reason, the socialist weekly founded by Julius Wayland and
  published in Girard, Kansas, which at its height before the First World War reached
  three-quarters of a million readers. It published the Appeal's pocket library of
  socialist pamphlets and the first edition of Upton Sinclair's The Jungle as a serial,
  and its plant later printed Haldeman-Julius's Little Blue Books.
