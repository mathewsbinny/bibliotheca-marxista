name: Kuraz Publishing Agency
alternate_names:
  - Kurāz
country: Ethiopia
city: Addis Ababa
founded: 1974
dissolved: 1987
status: defunct
estimated:
  - founded
  - dissolved
affiliation: Derg (Provisional Military Government of Socialist Ethiopia)
languages:
  - Amharic
  - English
description: >-
  A state publishing agency of the Derg period, which issued Amharic translations of
  Lenin and other Marxist–Leninist texts and textbooks used to teach socialism, as well
  as literature, including Baalu Girma's novel Oromay (1983). Its founding and closing
  dates are not documented in the sources consulted.
