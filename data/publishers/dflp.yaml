description: >-
  The Marxist–Leninist faction of the PLO led by Nayef Hawatmeh, which split from the
  PFLP in 1969 and was the first Palestinian organisation to propose a two-state
  programme. Its Central Information Committee published its documents and testimony in
  several languages.
