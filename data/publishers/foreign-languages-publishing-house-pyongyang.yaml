name: Foreign Languages Publishing House (Pyongyang)
alternate_names:
  - 외국문출판사
  - Oegungmun Ch'ulp'ansa
  - FLPH Pyongyang
country: North Korea
city: Pyongyang
founded: 1949
status: active
languages: [English, French, Spanish, Russian, and many others]
description: >
  The Democratic People's Republic of Korea's central publisher of foreign-language
  books and periodicals, founded on 10 December 1949. It is best known abroad for
  its editions of the works of Kim Il Sung and Kim Jong Il and for books on Juche,
  Korean history and the Korean War. It remains active, publishing periodicals
  including Korea, Korea Today, Foreign Trade of the DPRK and The Pyongyang Times.
