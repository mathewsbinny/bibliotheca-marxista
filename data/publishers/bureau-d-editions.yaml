name: Bureau d'éditions
alternate_names:
  - Bureau d'éditions, de diffusion et de publicité
  - BEDP
country: France
city: Paris
founded: 1926
dissolved: 1939
status: defunct
affiliation: French Communist Party
predecessor: librairie-de-l-humanite
languages:
  - French
description: >-
  The French Communist Party's publishing and distribution house, founded in July 1926
  to replace the Librairie de l'Humanité, and run by Liber Cical until the war. It
  issued Comintern resolutions, pamphlets and French editions of Soviet writing,
  alongside the Éditions sociales internationales, founded in 1927.
sources:
  - title: 'Bouju, "Lire en communiste: les maisons d''édition du PCF 1920–1968" (PUR)'
    url: https://books.openedition.org/pur/105650?lang=en
  - title: Bouju, "Les maisons d'édition du PCF, 1920–1956" (thesis)
    url: https://theses.fr/2005IEPP0026
  - title: Marie-Cécile Bouju, Lire en communiste (Presses universitaires de Rennes)
    url: https://books.openedition.org/pur/105650
