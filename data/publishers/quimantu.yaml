name: Editora Nacional Quimantú
alternate_names:
  - Quimantú
  - Empresa Editora Quimantú Limitada
country: Chile
city: Santiago
founded: 1971
dissolved: 1973
status: defunct
affiliation: State publisher of the Popular Unity government
languages: [Spanish]
description: >
  The state publishing house of Salvador Allende's Popular Unity government. On
  12 February 1971 the state bought the assets and printing works of Editorial
  Zig-Zag, and on 1 April 1971 Quimantú was constituted, owned by the state
  development corporation CORFO and Chilefilms. Its name joins the Mapudungun
  words kim and antú, "sun of knowledge". Producing books at very low cost, it put
  literature, history and political education within reach of workers, students
  and children across Chile, until the 1973 coup ended it.
sources:
