name: Socialist Party of Canada
country: Canada
city: Vancouver
founded: 1904
dissolved: 1925
status: defunct
affiliation: Socialist Party of Canada (Marxist)
languages:
  - English
description: >-
  The strictly Marxist party founded in British Columbia in 1904, which published the Western
  Clarion and Marxist study pamphlets in Vancouver and Winnipeg; most of its members joined the
  Communist Party in the early 1920s. A party of the same name was refounded in Winnipeg in
  1931.
