  - Filipino
description: >
  A Dutch foundation in Utrecht set up in 1989 by Jose Maria Sison, founder of the
  Communist Party of the Philippines, who chaired it from that year — his last as a
  research consultant at the University of Utrecht, after which he remained in the
  Netherlands in exile. It publishes Sison's writings and other national-democratic
  material: the series Continuing the Philippine Revolution (from 2013), Sison's
  selected works for 1968–1990 co-published with Aklat ng Bayan in Manila, whose first
  volume was Foundation for Resuming the Philippine Revolution; Jose Maria Sison:
  Reflections on Revolution and Prospects, interviews by Rainer Werning (2019); and the
  Sison Reader Series edited by Julieta de Lima (from 2021), which had reached at least
  its fourteenth book, On the Workers' Movement, by 2023, in paperback and e-book. It
  was still publishing in 2023, with no sign of closing.
