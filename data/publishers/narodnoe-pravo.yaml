name: Narodnoe pravo
alternate_names:
  - Народное право
country: Soviet Union
city: Moscow
founded: 1906
dissolved: 1917
status: defunct
affiliation: Publishing house close to the Socialist Revolutionary Party
languages:
  - Russian
description: >-
  A Moscow publishing house of populist and Socialist Revolutionary literature, active in the
  legal periods between 1906 and 1917, which issued pamphlets on land, the peasantry and the
  constituent assembly.
